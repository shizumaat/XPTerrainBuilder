name: CI

# ONE RUN PER COMMIT (#225).  Until 2026-10-02 this fired on BOTH
# `push: branches: ["**"]` and `pull_request`, and the concurrency group
# keyed on `github.ref`, which is a DIFFERENT string for the two events:
#
#   push         -> refs/heads/claude/<lane>
#   pull_request -> refs/pull/<n>/merge
#
# Two group keys, so neither run cancelled the other and every push to a
# branch with an open PR ran the whole 4-job matrix TWICE.  Measured on
# PR #220: 8 check runs under 4 distinct names, from two run ids, on each
# of three consecutive heads — roughly 40-50 runner-minutes per push.
# `cancel-in-progress` did work WITHIN a trigger, which is why this looked
# fine for as long as it did.
#
# The fix is at the trigger, not the group: `push` is narrowed to `main`,
# so a branch gets exactly one run, from `pull_request`.  The group key is
# event-independent as well, belt and braces — `github.head_ref` is the
# SOURCE BRANCH NAME on a pull_request event and empty on a push, so the
# two events on one branch would now collapse into one group even if both
# fired again.
#
# WHAT THIS GIVES UP, deliberately: a branch pushed with NO open PR gets
# no CI run at all.  `claude/*` lanes do push before opening a PR, so a
# lane that pushes and stops now learns nothing from CI until its PR
# exists — at which point `pull_request` runs the full matrix against the
# merge ref, which is the stronger test anyway.  Tags are NOT added here:
# `branches: ["**"]` never matched tags either, and release.yml carries
# its own `push: tags: ["v*"]` trigger with its own four `check_tag_version
# .sh` gates, so nothing in the release path depended on this workflow.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"   # matches the vendored cp313 wheels in Utils/

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # macos-15 runners default to Xcode 16.4, whose SDK predates macOS 26;
      # the app needs the macOS 26 SDK.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version

      - name: Build (debug)
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build (release)
        run: swift build -c release

  # ════════════════════════════════════════════════════════════════════
  # THE ENGINE IS PYTHON AND SHIPS ON THREE PLATFORMS (beta plan §1 B4)
  # ════════════════════════════════════════════════════════════════════
  # Until 2026-09-17 CI ran no Python at all: every Windows and Linux
  # regression was found by a user, or by release.yml failing at freeze
  # time — after the tag.
  #
  # From 2026-09-17 to 2026-09-28 this job ran THREE pytest invocations
  # naming three globs — tests/test_harness.py, tests/test_engine*.py,
  # tests/test_qt_*.py.  Those match 31 of the engine's 660 test files
  # (#63): 629 files, and essentially the whole engine — every law family,
  # the solver, the tunnels, auto_patch_v2 — were NEVER COLLECTED, so a
  # green rollup said nothing about them.  #59 is what that costs: three
  # auto_patch_v2 reds sat on main across a window CI called green.
  #
  # It now runs the WHOLE suite, in the split tests/conftest.py documents
  # as the lawful one: the Qt files SERIAL (-n0), everything else PARALLEL
  # (-n auto from pytest.ini).  The two halves are disjoint and together
  # they are `tests/`.
  #
  # The corpus: /Users/noah/XPTerrainBuilderData is on no runner, and the
  # shared-repo guard in tests/conftest.py is inert when it is absent.
  # tests/auto_patch_v2 carries its own checked-in fixtures (CYXY et al.)
  # and needs no corpus.  Tests that need a tool CI does not install skip
  # themselves: GDAL (requirements drops it, below) and /bin/zsh (macOS
  # only) are the two that bite.
  #
  # Wall time (measured 2026-09-28, 4-core Linux container, py3.13):
  # non-Qt half 21m51s, Qt half ~15s.  Hence timeout-minutes 60, not 30.
  # If a runner ever outgrows that, split the non-Qt half by directory
  # (tests/auto_patch_v2 and the rest) into two jobs — never by dropping
  # files, which is the defect this job just stopped committing.
  python-tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false        # one platform's red must not hide another's
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    defaults:
      run:
        shell: bash           # one recipe; Git bash on the Windows runner
    env:
      # The Qt tests construct real widgets; there is no display on any
      # runner.  MPLBACKEND keeps matplotlib (pulled in transitively) off
      # the interactive backends for the same reason.
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      # #54: a one-off SIGSEGV in the serial Qt suite (rc 139,
      # shiboken6/PySide6) whose dump named no test.  pytest's faulthandler
      # plugin arms only once the session starts, which leaves import and
      # collection uncovered; PYTHONFAULTHANDLER arms it at interpreter
      # start, so a crash anywhere dumps every thread to the real stderr.
      PYTHONFAULTHANDLER: "1"
      # Not load-bearing on Linux — pytest's terminal writer flushes per
      # test once verbose (measured).  It costs nothing and removes the
      # question on the Windows and macOS runners, which this was not
      # measured on.
      PYTHONUNBUFFERED: "1"
      # --timeout: a hung test fails with its own stack dump instead of
      # taking the job's budget and leaving no log behind.  600s, not the
      # 180s the three-glob era used: the full suite includes the
      # build-bound fixture airports, and a per-test ceiling below a
      # legitimate build is a false red.
      PYTEST_FLAGS: >-
        -q --no-header -p no:cacheprovider -rfE
        --continue-on-collection-errors
        --timeout=600 --timeout-method=thread
    steps:
      # FULL HISTORY, not the default depth-1 clone (#76).  Two twins in the
      # suite CI now collects read the repository's own history, and both
      # went red for the clone rather than for the code:
      #   * tests/test_dsf_texture_modes.py pins a baseline commit
      #     (38b3eaf) and builds the same synthetic tile with the base
      #     build_dsf to prove full_ortho is byte-identical.  It REFUSES to
      #     skip here — "CI checkouts must include it (fetch full history,
      #     not a shallow clone); this guard must not silently skip in CI"
      #     — so the fix belongs in the checkout, which is what it asks for.
      #   * tests/test_blast_index.py asserts co-change coupling over 200+
      #     commits; at depth 1 there is no co-change to find.
      # This is the #63/#74 principle applied to the checkout: a test the
      # runner cannot pose the question to is not a test that should be
      # quietly skipped — give it its input.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Ortho4XP/requirements.txt

      # Qt's offscreen platform plugin still links the X/EGL stack.  Same
      # list release.yml installs for the Linux freeze.
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      # Same recipe as release.yml, plus the dev/test tail (pytest,
      # pytest-xdist, hypothesis) which the frozen app deliberately drops.
      #   * gdal: optional at runtime everywhere (O4_DEM_Utils.py guards
      #     the import) and a source build on a runner is not worth it.
      #   * scikit-fmm on Windows: the vendored cp313 wheel in Utils/win,
      #     which is also what the release installs.
      - name: Install engine packages
        working-directory: Ortho4XP
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Windows" ]; then
            python -m pip install Utils/win/*.whl
            grep -v '^gdal==' requirements.txt \
              | grep -v '^scikit-fmm==' > reqs-ci.txt
          else
            grep -v '^gdal==' requirements.txt > reqs-ci.txt
          fi
          python -m pip install -r reqs-ci.txt
          # A hung test must NAME ITSELF, not eat the 30-minute job budget:
          # round 1 (2026-09-17) lost the whole Linux Qt step to a hang with
          # no log, because a cancelled job keeps no logs at all.
          python -m pip install pytest-timeout
          python -m pip list

      # The suite runs in TWO disjoint halves whose union is `tests/`, each
      # `if: always()` so one half's red does not hide the other's.
      #
      # WHY THE SPLIT IS NOT OPTIONAL: pytest.ini carries `-n auto`, and
      # tests/conftest.py REFUSES Qt files collected into a parallel run
      # (one failing item naming this split, then ~300 skips).  Under xdist
      # a Qt worker that dies hard leaves the controller waiting with no
      # --timeout to fire and no log; serial, a crash kills pytest at once.
      #
      # A collection floor stands in front of both.  The three-glob era
      # leaned on `|| [ $? -eq 5 ]`, under which a glob that stopped
      # matching anything — a rename, a moved directory — passed SILENTLY
      # (#63).  Nothing here is allowed to pass by collecting nothing.
      # Floors are deliberately far below the measured counts (11,786
      # non-Qt and 309 Qt on Linux/py3.13, 2026-09-28) because Windows
      # platform-skips whole modules: they catch "collected 0" and
      # "collected 31", not drift.
      # Also records the exact NODE-ID LIST behind each count, and its sorted
      # digest, as a build artifact (#221).  #221 was filed as "the collected
      # count varies between runs of the same commit" — 12,880 vs 12,912 on
      # ubuntu for `bedf8a76`.  It was neither: the two runs were the PUSH run
      # and the PULL_REQUEST run of #225's double trigger, and those check out
      # DIFFERENT TREES.  `actions/checkout` on a pull_request event takes
      # `refs/pull/<n>/merge`, so that job's log reads
      #
      #   HEAD is now at cdfd52b2 Merge bedf8a76... into 688159f6...
      #
      # while the push job built `bedf8a76` itself.  Both check runs report the
      # PR HEAD as their head_sha, which is what made one commit look like two
      # counts.  main had deleted `tests/auto_patch_v2/test_base_plane_pads.py`
      # and shrunk `test_classify_lots.py`; the merge inherits those deletions,
      # worth exactly 23 + 9 = 32 items (reconstructed from the two parents and
      # measured: 13026 vs 12994 node ids, 32 in the head only, 0 in the merge
      # only).  Collection itself is deterministic — four local collections, two
      # `-n0` and two `-n auto`, produced byte-identical node-id lists.
      #
      # The trigger fix above is what closes #221: one run per commit leaves no
      # divergent pair to compare.  This records the evidence anyway, because a
      # count alone could not distinguish the two explanations and cost the
      # issue its wrong premise — a digest says THAT the set moved, and the
      # uploaded list says WHICH items.  Python does the hashing: `sha256sum`
      # is Linux-only and `shasum` is not on every runner, while python is the
      # thing under test.  Node ids use "/" on every platform, so the lists are
      # comparable per-OS; they are NOT comparable ACROSS OSes, since Windows
      # platform-skips whole modules.  Not a gate — the floor below is the
      # gate; this is attribution, and it must never fail a job on its own.
      - name: Collection floor
        if: always()
        working-directory: Ortho4XP
        run: |
          # The count, the sorted node-id digest and the floor itself come
          # from `tools/ci_collection_census.py`, which the reconciliation
          # step below reads back: ONE implementation, so the number the
          # gate prints and the number it compares cannot drift (#244).
          # It also writes the node-id list the artifact has always carried.
          #
          # `|| true` on the pytest call: the step runs under `bash -eo
          # pipefail`, and a collect-only run that errors on a module is
          # still evidence — the census counts those modules by name.  An
          # empty collect file IS the failure signal, and the census's own
          # floor check reports it.
          floor () {   # $1 = human name, $2 = floor, $3.. = pytest target args
            name="$1"; min="$2"; slug="$3"; shift 3
            out="collect-$slug.txt"
            python -m pytest -q --no-header -p no:cacheprovider -n0 \
              --collect-only --continue-on-collection-errors "$@" > "$out" 2>&1 || true
            python tools/ci_collection_census.py census "$out" \
              --name "$name" --floor "$min" --json "census-$slug.json" \
              --nodeids "nodeids-$slug.txt" || return 1
          }
          # The checked-out commit, so a divergent pair is attributable to its
          # TREE rather than to the head_sha both events report (#221).
          echo "checked out: $(git rev-parse HEAD) ($(git log --oneline -1 --no-decorate))"
          floor "non-Qt" 9000 non-qt --ignore-glob='tests/test_qt_*.py' tests
          floor "Qt"      250 qt     tests/test_qt_*.py

      # EVERYTHING except the Qt files, in parallel.  No `|| [ $? -eq 5 ]`:
      # this target cannot legitimately collect nothing, and the floor above
      # already said so.
      #
      # `-s ABRT` rather than the default TERM: with PYTHONFAULTHANDLER
      # (job env) an aborted interpreter dumps EVERY thread, so a step
      # killed on its own clock names the test it was wedged in.  Measured
      # on a synthetic 600 s sleep:
      #     TERM   -> "Terminated", rc 124, and nothing else
      #     ABRT   -> "Fatal Python error: Aborted" + the frame
      #               test_hang_proof.py line 3 in test_that_wedges
      # MEASURED ON WINDOWS 2026-09-28: it does NOT survive there.  Git
      # bash delivers something the native interpreter takes as an ordinary
      # termination, so the kill produced no dump at all — only execnet's
      # "OSError: cannot send (already closed?)" out of pytest_sessionfinish,
      # which is teardown noise from being killed, not the cause.  Kept
      # because it is no worse than the TERM it replaces and it DOES work
      # on the two runners where a wedge is also possible.
      #
      # WINDOWS PROGRESS TRACE.  Windows is killed at this timeout every
      # run (50m01s, 50m03s) while macOS takes ~7m and Linux ~7-10m, and
      # nothing in the log says whether it is grinding or stuck.  Under
      # xdist, -v -v prints a dispatch line per test AND a completion line
      # `[gwN] [ nn%] PASSED ...`, so a killed step's LAST lines answer it:
      # still advancing => merely slow, and the percentage sizes the budget
      # it needs; stopped advancing => wedged, and the dispatched-but-never-
      # completed test names itself.  Windows only: this is ~12k lines per
      # run and the other two runners have nothing to diagnose.  Drop it
      # once Windows is settled.
      - name: Engine suite (parallel, non-Qt)
        if: always()
        working-directory: Ortho4XP
        run: |
          limit=""
          if command -v timeout >/dev/null 2>&1; then
            limit="timeout -s ABRT -k 30 3000"   # absent on the macOS runner
          fi
          progress=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            progress="-v -v"                     # net verbose over PYTEST_FLAGS' -q
          fi
          $limit python -m pytest $PYTEST_FLAGS -n auto $progress \
            --junitxml=junit-non-qt.xml \
            --ignore-glob='tests/test_qt_*.py' tests

      # SERIAL (-n0) and, where the runner has coreutils, under a wall
      # clock of its own.  Rounds 1 and 3 both lost this step on Linux to
      # the job's timeout, and a CANCELLED job keeps NO LOGS AT ALL — two
      # rounds spent learning nothing.  The step's own `timeout` fails the
      # STEP instead of the JOB, so the log survives to be read.
      #
      # #54 (attribution, not a fix): one run of this recipe died rc 139
      # with a faulthandler dump that named no test — not reproduced in 13
      # serial runs since, so the next occurrence is the only evidence
      # there will be, and it has to be complete.
      #   * -p faulthandler: load the plugin explicitly, so the dump
      #     survives pytest's output capture.  PYTHONFAULTHANDLER (job env)
      #     covers the window before the plugin arms.
      #   * -o faulthandler_timeout=0: the pytest-9 spelling is the INI
      #     option, not a --faulthandler-timeout flag, which pytest 9
      #     rejects as an unrecognised argument (rc 4, nothing runs — the
      #     shape that already cost issue #54 one repro attempt).  0 is
      #     explicit-default: hangs belong to pytest-timeout, above, and a
      #     second dumper racing it only muddies the log.
      #   * -v -v, not -v: pytest SUMS verbosity, and PYTEST_FLAGS above
      #     carries -q.  `-q -v` is net zero — ordinary file-level progress
      #     dots, no node IDs — so the -v this step has carried since
      #     2026-09-17 has been a no-op.  -q -v -v is net verbose, which
      #     prints each node ID as it STARTS, so the last line before rc
      #     139 names the test that died.
      #   * tee: a step that fails keeps its log in the UI, but a job that
      #     is cancelled or times out keeps nothing.  The file is uploaded
      #     below either way, so the dump is readable after the fact.
      - name: Qt app (offscreen, serial)
        if: always()
        working-directory: Ortho4XP
        run: |
          limit=""
          if command -v timeout >/dev/null 2>&1; then
            limit="timeout -s ABRT -k 30 900"    # absent on the macOS runner
          fi
          set -o pipefail
          $limit python -m pytest $PYTEST_FLAGS \
            -p faulthandler -o faulthandler_timeout=0 \
            --junitxml=junit-qt.xml \
            -n0 -v -v tests/test_qt_*.py 2>&1 | tee qt-suite.log

      # THE FLOOR MUST GATE THE SET THE SUITE RUNS (#244).  The floor
      # reported ~10 FEWER items than the suite in the same job on the same
      # tree (12,991 vs 13,001 on run 37016002700), so a regression living
      # only in those items was invisible to the gate by construction.  It is
      # not the `-n`: xdist skips itself entirely when only collecting, so
      # the floor's `-n0 --collect-only` collects exactly what an `-n auto`
      # one would.  The gap is that the floor counted COLLECTED ITEMS while
      # the suite's summary counts REPORTED OUTCOMES, and a module that
      # cannot be collected at all (a module-level `importorskip` for an
      # optional dependency the runner lacks, an import error under
      # `--continue-on-collection-errors`) contributes zero node ids and one
      # outcome.  Those modules differ per runner, which is why the gap moved
      # between runs and why no local checkout reproduced it.
      #
      # So this step asserts the two SETS are the same set, naming whatever
      # diverges rather than printing two numbers and leaving the reader to
      # subtract.  `if: always()`: a red suite still collected something, and
      # a floor/suite divergence is most interesting exactly then.
      - name: Collection floor vs suite reconciliation
        if: always()
        working-directory: Ortho4XP
        run: |
          python tools/ci_collection_census.py reconcile --name "non-Qt" \
            --census census-non-qt.json --junit junit-non-qt.xml
          python tools/ci_collection_census.py reconcile --name "Qt" \
            --census census-qt.json --junit junit-qt.xml

      # `if: always()`: the crash log is worth exactly as much as the run
      # that produced it is red.
      #
      # The collection node-id lists ride along in the SAME artifact rather
      # than in a second upload step (#221): they are evidence about this one
      # job, they are wanted on green runs too — a divergence shows up as two
      # green runs disagreeing — and `qt-suite.log` is already uploaded
      # unconditionally for exactly that reason.
      - name: Upload Qt suite log and the collection census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-suite-log-${{ matrix.os }}
          path: |
            Ortho4XP/qt-suite.log
            Ortho4XP/nodeids-non-qt.txt
            Ortho4XP/nodeids-qt.txt
            Ortho4XP/collect-non-qt.txt
            Ortho4XP/collect-qt.txt
            Ortho4XP/census-non-qt.json
            Ortho4XP/census-qt.json
          if-no-files-found: warn
          retention-days: 30
