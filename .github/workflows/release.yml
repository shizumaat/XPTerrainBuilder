name: Release

# Builds the three release artifacts from docs/RELEASES-PLAN.md — every one
# fully self-contained (frozen Python runtime + packages, no user setup):
#   macOS   XPTerrainBuilder-<v>-mac.zip       SwiftUI app, frozen engine embedded
#   Windows XPTerrainBuilder-<v>-win.zip       frozen Qt app (portable)
#   Linux   XPTerrainBuilder-<v>-linux.tar.gz  frozen Qt app (portable)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"   # matches the vendored cp313 wheels in Utils/

jobs:
  mac:
    name: macOS app (frozen engine)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A release tag names a build that EXISTS: the tag's numeric part must
      # equal the app version tracked at this commit (docs/BETA-PLAN-20260916.md
      # §1 B3).  First real step of every job — an hour of freezing and
      # notarizing is not where a mistyped tag should surface.  A
      # workflow_dispatch ref passes with a note.
      - name: Tag matches the tracked app version
        run: bash scripts/check_tag_version.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # macOS GDAL links Homebrew's libproj, and Ortho4XP.spec bundles the
      # PROJ data directory that GDAL's own search paths report
      # (docs/specs/proj-runtime-robustness-spec.md D2(b)).
      - name: PROJ for GDAL's proj data lookup
        run: brew install proj

      # macos-15 runners default to Xcode 16.4, whose SDK predates macOS 26;
      # the app needs the macOS 26 SDK.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode_26*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          swift --version

      - name: Freeze engine
        run: PYTHON=python3 scripts/make_engine.sh

      # The frozen bundle must read the proj.db it shipped with, whatever the
      # user's shell exports (docs/specs/proj-runtime-robustness-spec.md D6).
      # Bogus PROJ paths in; exit 0 out, or no release.
      - name: PROJ self-check (frozen engine, hostile environment)
        env:
          PROJ_LIB: /nonexistent/proj
          PROJ_DATA: /nonexistent/proj
        run: Ortho4XP/dist/Ortho4XP/Ortho4XP --proj-selfcheck

      # The frozen engine must decode LERC elevation assets (owner RULINGS
      # 2026-09-12as (3)) — the same 64x64 fixture check the Windows and
      # Linux jobs run, one implementation.  A bundle missing tifffile /
      # imagecodecs._lerc does not crash: it SKIPS the source and silently
      # degrades New Zealand's 1 m lidar, which is how 1.0.324 shipped.  So
      # it fails HERE.  python3 is the job interpreter, never the thing
      # under test.
      - name: LERC self-check (frozen engine)
        run: bash scripts/check_frozen_lerc.sh Ortho4XP/dist/Ortho4XP/Ortho4XP python3

      # Signing and notarization (docs/BETA-PLAN-20260916.md §1 B1,
      # RELEASES-PLAN §B4).  A TAG release is signed, notarized and stapled
      # or it does not ship: an ad-hoc tag artifact is refused by current
      # macOS with no right-click bypass, so shipping one silently is worse
      # than failing here.  workflow_dispatch may still build ad-hoc, and
      # says so in the artifact name.
      - name: Signing secrets
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=""
          for v in MACOS_CERT_P12 MACOS_CERT_PASSWORD NOTARY_KEY_P8 \
                   NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::tag release requires the signing secrets; missing:$missing"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::building UNSIGNED (missing:$missing)"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # A throwaway keychain, deleted in an `if: always()` step below: the
      # runner's login keychain is shared with everything else on the job.
      - name: Import Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/xptb-signing.keychain-db"
          KPASS="$(openssl rand -base64 24)"
          P12="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$P12"' EXIT
          security create-keychain -p "$KPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPASS" "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Without this, codesign blocks on a UI prompt no runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KPASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENT="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          if [ -z "$IDENT" ]; then
            echo "::error::the imported .p12 carries no Developer ID Application identity"
            exit 1
          fi
          echo "Identity: $IDENT"
          echo "XPTB_SIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # With XPTB_SIGN_IDENTITY a "Developer ID Application" string,
      # make_app.sh routes the stage through scripts/sign_app.sh (hardened
      # runtime, inner-first).  Without it, today's ad-hoc path.
      - name: Build app
        run: scripts/make_app.sh release

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$KEY"' EXIT
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$KEY"
          NOTARY_KEY_PATH="$KEY" scripts/notarize_app.sh \
            dist.nosync/XPTerrainBuilder.app

      # LICENSING.md §6(d) / RELEASES-PLAN §G: every artifact carries the
      # notices, generated from LICENSING.md so they cover what we ship.
      - name: Generate third-party notices
        run: python3 scripts/make_notices.py THIRD-PARTY-NOTICES.txt

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Stage the app next to the license payload, so the artifact root
      # carries the per-artifact checklist of RELEASES-PLAN §G (LICENSE,
      # LICENSING.md, notices, gpl.txt, copyright.txt, Triangle sources).
      # `ditto` (not zip) preserves the symlinks, the signatures and the
      # stapled notarization ticket inside the bundle.
      - name: Stage and zip
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          rm -rf XPTerrainBuilder
          mkdir -p XPTerrainBuilder/Triangle-src
          ditto dist.nosync/XPTerrainBuilder.app \
            XPTerrainBuilder/XPTerrainBuilder.app
          cp LICENSE LICENSING.md THIRD-PARTY-NOTICES.txt XPTerrainBuilder/
          # app + engine + commit, the triple a bug report quotes
          # (docs/BETA-PLAN-20260916.md §1 B3) — the About box reads it.
          bash scripts/write_version_txt.sh XPTerrainBuilder/VERSION.txt
          cp Ortho4XP/Licence/gpl.txt Ortho4XP/Licence/copyright.txt \
            XPTerrainBuilder/
          cp -R Ortho4XP/Utils/src/. XPTerrainBuilder/Triangle-src/
          if [ "$SIGNED" = "true" ]; then
            # The stapled ticket must survive the zip: assert it on the
            # STAGED copy, which is what the artifact actually carries.
            xcrun stapler validate XPTerrainBuilder/XPTerrainBuilder.app
            SUFFIX=mac
          else
            SUFFIX=mac-UNSIGNED
          fi
          ditto -c -k --keepParent XPTerrainBuilder \
            "XPTerrainBuilder-${{ steps.ver.outputs.version }}-$SUFFIX.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: XPTerrainBuilder-*-mac*.zip

      # Never leave the imported certificate on the runner, whatever failed.
      - name: Delete the signing keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ] && [ -f "$SIGN_KEYCHAIN" ]; then
            security delete-keychain "$SIGN_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" || true

  windows:
    name: Windows portable (frozen Qt app)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # A release tag names a build that EXISTS: the tag's numeric part must
      # equal the app version tracked at this commit (docs/BETA-PLAN-20260916.md
      # §1 B3).  First real step of every job — an hour of freezing and
      # notarizing is not where a mistyped tag should surface.  A
      # workflow_dispatch ref passes with a note.
      - name: Tag matches the tracked app version
        run: bash scripts/check_tag_version.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install engine packages
        working-directory: Ortho4XP
        run: |
          # Vendored wheels first (gdal, scikit-fmm), then the rest of the
          # pins; the dev/test section stays out of the frozen app.
          python -m pip install --upgrade pip
          python -m pip install Utils/win/*.whl
          sed '/^# Dev \/ test/,$d' requirements.txt | grep -v '^gdal==' \
            | grep -v '^scikit-fmm==' > reqs-frozen.txt
          python -m pip install -r reqs-frozen.txt pyinstaller

      - name: Freeze Qt app
        working-directory: Ortho4XP
        run: python -m PyInstaller Ortho4XP_Qt.spec --noconfirm

      # The frozen bundle must read the proj.db it shipped with, whatever the
      # user's shell exports (docs/specs/proj-runtime-robustness-spec.md D6).
      # Bogus PROJ paths in; exit 0 out, or no release.
      - name: PROJ self-check (frozen app, hostile environment)
        working-directory: Ortho4XP
        env:
          PROJ_LIB: C:\nonexistent\proj
          PROJ_DATA: C:\nonexistent\proj
        run: dist/Ortho4XP_Qt/Ortho4XP_Qt.exe --proj-selfcheck

      # On Windows this app IS the engine, so it must decode LERC elevation
      # assets itself (owner RULINGS 2026-09-13a (1)) — the same 64x64
      # fixture check the mac engine freeze runs, one implementation.  A
      # bundle missing tifffile / imagecodecs._lerc does not crash: it skips
      # the source and silently degrades New Zealand's 1 m lidar, so it fails
      # HERE.  tifffile and imagecodecs come from requirements.txt above (the
      # filter drops only the dev/test tail, gdal and scikit-fmm).
      - name: LERC self-check (frozen app)
        run: bash scripts/check_frozen_lerc.sh Ortho4XP/dist/Ortho4XP_Qt/Ortho4XP_Qt.exe python

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Brand and zip
        run: |
          mv Ortho4XP/dist/Ortho4XP_Qt XPTerrainBuilder
          mv XPTerrainBuilder/Ortho4XP_Qt.exe XPTerrainBuilder/XPTerrainBuilder.exe
          # app + engine + commit, the triple a bug report quotes
          # (docs/BETA-PLAN-20260916.md §1 B3) — the About dialog reads it.
          bash scripts/write_version_txt.sh XPTerrainBuilder/VERSION.txt
          # License payload at the artifact root (RELEASES-PLAN §G).  The
          # Triangle sources already ship inside
          # _internal/Ortho4XP_Data/Utils/src via Ortho4XP_Qt.spec.
          python scripts/make_notices.py XPTerrainBuilder/THIRD-PARTY-NOTICES.txt
          cp LICENSE LICENSING.md XPTerrainBuilder/
          cp Ortho4XP/Licence/gpl.txt Ortho4XP/Licence/copyright.txt \
            XPTerrainBuilder/
          7z a "XPTerrainBuilder-${{ steps.ver.outputs.version }}-win.zip" XPTerrainBuilder

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: XPTerrainBuilder-*-win.zip

  linux:
    name: Linux portable (frozen Qt app)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A release tag names a build that EXISTS: the tag's numeric part must
      # equal the app version tracked at this commit (docs/BETA-PLAN-20260916.md
      # §1 B3).  First real step of every job — an hour of freezing and
      # notarizing is not where a mistyped tag should surface.  A
      # workflow_dispatch ref passes with a note.
      - name: Tag matches the tracked app version
        run: bash scripts/check_tag_version.sh

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install engine packages
        working-directory: Ortho4XP
        run: |
          python -m pip install --upgrade pip
          # GDAL bindings are optional at runtime; skip rather than fight
          # the source build on the runner.
          sed '/^# Dev \/ test/,$d' requirements.txt | grep -v '^gdal==' \
            > reqs-frozen.txt
          python -m pip install -r reqs-frozen.txt pyinstaller

      - name: Freeze Qt app
        working-directory: Ortho4XP
        run: python -m PyInstaller Ortho4XP_Qt.spec --noconfirm

      # The frozen bundle must read the proj.db it shipped with, whatever the
      # user's shell exports (docs/specs/proj-runtime-robustness-spec.md D6).
      # Bogus PROJ paths in; exit 0 out, or no release.
      - name: PROJ self-check (frozen app, hostile environment)
        working-directory: Ortho4XP
        env:
          PROJ_LIB: /nonexistent/proj
          PROJ_DATA: /nonexistent/proj
        run: dist/Ortho4XP_Qt/Ortho4XP_Qt --proj-selfcheck

      # On Linux this app IS the engine, so it must decode LERC elevation
      # assets itself (owner RULINGS 2026-09-13a (1)) — the same 64x64
      # fixture check the mac engine freeze runs, one implementation.  A
      # bundle missing tifffile / imagecodecs._lerc does not crash: it skips
      # the source and silently degrades New Zealand's 1 m lidar, so it fails
      # HERE.  tifffile and imagecodecs come from requirements.txt above (the
      # filter drops only the dev/test tail and gdal).
      - name: LERC self-check (frozen app)
        run: bash scripts/check_frozen_lerc.sh Ortho4XP/dist/Ortho4XP_Qt/Ortho4XP_Qt python

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Brand and tar
        run: |
          mv Ortho4XP/dist/Ortho4XP_Qt XPTerrainBuilder
          mv XPTerrainBuilder/Ortho4XP_Qt XPTerrainBuilder/XPTerrainBuilder
          # app + engine + commit, the triple a bug report quotes
          # (docs/BETA-PLAN-20260916.md §1 B3) — the About dialog reads it.
          bash scripts/write_version_txt.sh XPTerrainBuilder/VERSION.txt
          # License payload at the artifact root (RELEASES-PLAN §G).  The
          # Triangle sources already ship inside
          # _internal/Ortho4XP_Data/Utils/src via Ortho4XP_Qt.spec.
          python scripts/make_notices.py XPTerrainBuilder/THIRD-PARTY-NOTICES.txt
          cp LICENSE LICENSING.md XPTerrainBuilder/
          cp Ortho4XP/Licence/gpl.txt Ortho4XP/Licence/copyright.txt \
            XPTerrainBuilder/
          tar czf "XPTerrainBuilder-${{ steps.ver.outputs.version }}-linux.tar.gz" XPTerrainBuilder

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: XPTerrainBuilder-*-linux.tar.gz

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out for the GPL v3 source offer (§G) and the release notes.
      # Full history so `git archive HEAD` is the exact tagged tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release tag names a build that EXISTS: the tag's numeric part must
      # equal the app version tracked at this commit (docs/BETA-PLAN-20260916.md
      # §1 B3).  First real step of every job — an hour of freezing and
      # notarizing is not where a mistyped tag should surface.  A
      # workflow_dispatch ref passes with a note.
      - name: Tag matches the tracked app version
        run: bash scripts/check_tag_version.sh

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # GPL v3: the source offer must survive the binaries even if the repo
      # is renamed, moved or taken private (RELEASES-PLAN §G).
      - name: Source archive
        run: |
          git archive --format=tar.gz \
            --prefix="XPTerrainBuilder-${{ steps.ver.outputs.version }}-source/" \
            -o "XPTerrainBuilder-${{ steps.ver.outputs.version }}-source.tar.gz" HEAD

      # Downloaded into a subdirectory: merge-multiple into the checkout
      # root would collide with the working tree.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      # Release notes are REQUIRED on a tag (docs/BETA-PLAN-20260916.md
      # §1 B3(4)).  The bare auto-body this used to fall back to is what a
      # first-time beta tester would be handed instead of the download and
      # first-launch instructions for their platform — so a missing file
      # fails the release, by name, and docs/RELEASE_NOTES-TEMPLATE.md is
      # the thing to copy.
      - name: Release body
        run: |
          notes="docs/RELEASE_NOTES-${{ steps.ver.outputs.version }}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::release notes missing: $notes"
            echo "Copy docs/RELEASE_NOTES-TEMPLATE.md to $notes, fill it in," >&2
            echo "commit it, and move the tag." >&2
            exit 1
          fi
          cp "$notes" RELEASE_BODY.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          body_path: RELEASE_BODY.md
          files: |
            artifacts/XPTerrainBuilder-*-mac.zip
            artifacts/XPTerrainBuilder-*-win.zip
            artifacts/XPTerrainBuilder-*-linux.tar.gz
            XPTerrainBuilder-*-source.tar.gz
