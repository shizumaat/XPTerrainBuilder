name: Windows LEMD elevation (issue #121)

# DISPATCH ONLY — never a release gate (release.yml's tag path is untouched).
# Issue #121: a Windows user's LEMD build on v1.0.350-beta.1 came out with
# no elevation data.  Green Windows CI never made an HTTPS request from the
# frozen exe; this does, through the shipped JSONL protocol:
#   arm A  the SHIPPED binary (the release's -win.zip)
#   arm B  a fresh freeze of this ref (release.yml's Windows freeze steps,
#          copied faithfully: same reqs-frozen filter, same spec)
# Each arm runs scripts/check_frozen_tile.py --pass lemd-elevation: a
# private data root, NO custom_dem, insets ON, auto_patch OFF, imagery OFF,
# LEMD's aerodrome polygon as the only airport, CPL_DEBUG + CPL_CURL_VERBOSE.
#
# Arm B also proves the SYSTEM TRUST STORE (--tls-selfcheck before/after on a
# root that lives in the Windows store only).  Dispatch from main:
#   gh workflow run win-lemd-elevation.yml -f arms=shipped,fresh,hostile
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release whose -win.zip is arm A"
        default: "v1.0.350-beta.1"
      arms:
        description: "comma list of shipped, fresh, hostile (or both = shipped,fresh)"
        default: "shipped,fresh"

env:
  PYTHON_VERSION: "3.13"   # matches the vendored cp313 wheels in Utils/
  RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.350-beta.1' }}

jobs:
  shipped:
    name: "arm A: shipped release"
    if: contains(format(',{0},', inputs.arms || 'shipped,fresh'), ',shipped,') || inputs.arms == 'both'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download the shipped Windows zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p '*-win.zip' -D "$RUNNER_TEMP/rel"
          cd "$RUNNER_TEMP/rel" && 7z x -y *-win.zip > /dev/null && ls

      - name: Pre-flight probes
        run: bash scripts/win_lemd_preflight.sh "$RUNNER_TEMP/rel/XPTerrainBuilder" "$RUNNER_TEMP/lemd-logs"

      - name: LEMD elevation through the shipped exe
        run: |
          python scripts/check_frozen_tile.py \
            "$RUNNER_TEMP/rel/XPTerrainBuilder/XPTerrainBuilder.exe" \
            --pass lemd-elevation --deadline 900 \
            --logs "$RUNNER_TEMP/lemd-logs"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemd-elevation-shipped
          path: ${{ runner.temp }}/lemd-logs
          if-no-files-found: ignore

  fresh:
    name: "arm B: fresh freeze of ${{ github.ref_name }}"
    if: contains(format(',{0},', inputs.arms || 'shipped,fresh'), ',fresh,') || inputs.arms == 'both'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --- copied from release.yml (windows job), unchanged ---------------
      - name: Install engine packages
        working-directory: Ortho4XP
        run: |
          python -m pip install --upgrade pip
          python -m pip install Utils/win/*.whl
          sed '/^# Dev \/ test/,$d' requirements.txt | grep -v '^gdal==' \
            | grep -v '^scikit-fmm==' > reqs-frozen.txt
          python -m pip install -r reqs-frozen.txt pyinstaller

      - name: Generate icon and version resource
        run: |
          python scripts/make_icon.py --out Ortho4XP/Utils/icons/generated
          python scripts/make_version_resource.py Ortho4XP/version_info.txt

      - name: Freeze Qt app
        working-directory: Ortho4XP
        run: python -m PyInstaller Ortho4XP_Qt.spec --noconfirm
      # ---------------------------------------------------------------------

      - name: Pre-flight probes
        run: bash scripts/win_lemd_preflight.sh Ortho4XP/dist/Ortho4XP_Qt "$RUNNER_TEMP/lemd-logs"

      - name: LEMD elevation through the fresh exe
        run: |
          python scripts/check_frozen_tile.py \
            Ortho4XP/dist/Ortho4XP_Qt/Ortho4XP_Qt.exe \
            --pass lemd-elevation --deadline 900 \
            --logs "$RUNNER_TEMP/lemd-logs"

      # THE FIX'S GATE (issue #121): the same fresh exe with TLS
      # verification broken on purpose must REFUSE — no durable
      # no-coverage, no completion stamp, a loud Log warning + Ortho4XP.log
      # line naming SPAIN5M, BuildDone ok=false — never a 0 m tile.
      - name: LEMD elevation through the fresh exe, TLS broken (must refuse)
        if: always()
        run: |
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=win121 hostile root" \
            -keyout "$RUNNER_TEMP/hostile.key" -out "$RUNNER_TEMP/hostile-ca.pem"
          CURL_CA_BUNDLE="$(cygpath -w "$RUNNER_TEMP/hostile-ca.pem")" \
          python scripts/check_frozen_tile.py \
            Ortho4XP/dist/Ortho4XP_Qt/Ortho4XP_Qt.exe \
            --pass lemd-elevation --expect-refusal --deadline 900 \
            --logs "$RUNNER_TEMP/lemd-logs/hostile"

      # THE SYSTEM TRUST STORE (issue #121 follow-up): a root that lives in
      # the WINDOWS store ONLY — what a TLS-inspecting antivirus or proxy
      # installs — and a local https server signed by it.  Before the
      # truststore injection Python's requests (certifi) must FAIL on it;
      # after, it must succeed.  GDAL's Schannel curl is the control the
      # injection must not change.  REQUESTS_CA_BUNDLE / SSL_CERT_FILE /
      # CURL_CA_BUNDLE stay unset: certifi is what the bundle would use.
      - name: System trust store proof (--tls-selfcheck, before/after)
        if: always()
        run: |
          set -u
          T="$RUNNER_TEMP/tls"; mkdir -p "$T"; cd "$T"
          unset CURL_CA_BUNDLE REQUESTS_CA_BUNDLE SSL_CERT_FILE || true
          export MSYS_NO_PATHCONV=1
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=win121 system-store-only root" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout ca.key -out ca.pem
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout srv.key -out srv.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > srv.ext
          openssl x509 -req -in srv.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -days 2 -extfile srv.ext -out srv.pem
          certutil -addstore -f Root "$(cygpath -w "$T/ca.pem")"
          head -c 65536 /dev/urandom > blob.bin
          cat > serve.py <<'PY'
          import http.server, ssl, os
          os.chdir(os.path.dirname(os.path.abspath(__file__)))
          httpd = http.server.HTTPServer(("127.0.0.1", 8443), http.server.SimpleHTTPRequestHandler)
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain("srv.pem", "srv.key")
          httpd.socket = ctx.wrap_socket(httpd.socket, server_side=True)
          httpd.serve_forever()
          PY
          python serve.py > serve.log 2>&1 &
          for i in $(seq 1 30); do curl.exe -s -o NUL --ssl-no-revoke https://localhost:8443/blob.bin && break; sleep 1; done
          echo "curl.exe (Schannel, system store, no revocation):"
          curl.exe -s -o NUL -w '%{http_code}\n' --ssl-no-revoke https://localhost:8443/blob.bin || echo "curl FAILED"
          EXE="$GITHUB_WORKSPACE/Ortho4XP/dist/Ortho4XP_Qt/Ortho4XP_Qt.exe"
          set +e
          "$EXE" --tls-selfcheck https://localhost:8443/blob.bin --no-truststore --out "$T/before.json"; B=$?
          "$EXE" --tls-selfcheck https://localhost:8443/blob.bin --out "$T/after.json"; A=$?
          set -e
          echo "== BEFORE (certifi only), exit $B"; cat "$T/before.json"
          echo "== AFTER (truststore injected), exit $A"; cat "$T/after.json"
          mkdir -p "$RUNNER_TEMP/lemd-logs/tls"; cp "$T"/*.json "$T/serve.log" "$RUNNER_TEMP/lemd-logs/tls/"
          [ "$B" -ne 0 ] || { echo "::error::before-arm requests SUCCEEDED — the proof has no teeth"; exit 1; }
          [ "$A" -eq 0 ] || { echo "::error::after-arm requests FAILED — truststore did not reach the system store"; exit 1; }

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemd-elevation-fresh
          path: ${{ runner.temp }}/lemd-logs
          if-no-files-found: ignore

  # INTERVENTIONAL arm (not a reproduction): the SHIPPED exe with TLS
  # verification broken the way a TLS-intercepting antivirus / proxy or a
  # damaged root store breaks it — CURL_CA_BUNDLE names a CA file holding
  # only a freshly minted self-signed root, which both GDAL's libcurl
  # (Schannel honours CURLOPT_CAINFO) and `requests` obey.  The question
  # it answers is the scout's: does a transport/certificate failure on the
  # inset fetch become a DURABLE no-coverage record and an exit-0 build on
  # the base DEM?  The pass is EXPECTED to fail; its log is the evidence.
  hostile:
    name: "arm H: shipped release, TLS verification broken"
    if: contains(format(',{0},', inputs.arms || 'shipped,fresh'), ',hostile,')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Download the shipped Windows zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -p '*-win.zip' -D "$RUNNER_TEMP/rel"
          cd "$RUNNER_TEMP/rel" && 7z x -y *-win.zip > /dev/null && ls

      - name: Mint an unrelated self-signed root
        run: |
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=win121 hostile root" \
            -keyout "$RUNNER_TEMP/hostile.key" -out "$RUNNER_TEMP/hostile-ca.pem"
          echo "CURL_CA_BUNDLE=$(cygpath -w "$RUNNER_TEMP/hostile-ca.pem")" >> "$GITHUB_ENV"

      - name: Pre-flight probes (under the hostile CA bundle)
        run: bash scripts/win_lemd_preflight.sh "$RUNNER_TEMP/rel/XPTerrainBuilder" "$RUNNER_TEMP/lemd-logs"

      - name: LEMD elevation through the shipped exe, TLS broken (expected red)
        continue-on-error: true
        run: |
          python scripts/check_frozen_tile.py \
            "$RUNNER_TEMP/rel/XPTerrainBuilder/XPTerrainBuilder.exe" \
            --pass lemd-elevation --deadline 900 \
            --logs "$RUNNER_TEMP/lemd-logs"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lemd-elevation-hostile
          path: ${{ runner.temp }}/lemd-logs
          if-no-files-found: ignore
