[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -n auto --dist loadgroup -m "not timing"
# -n auto: parallel across CPUs (pytest-xdist).  The suite is build-bound
# (each airport ~60 s elevation solve); parallelism cuts wall time ~4-5x.
# Use `-n0` to force serial (e.g. for pdb / single-test debugging).
# --dist loadgroup: keep all tests sharing an xdist_group on one worker.
# conftest assigns each airport-parametrised test the group <icao> so the
# shared layout cache builds each airport exactly ONCE per run.
markers =
    xdist_group: pin tests sharing a group to the same xdist worker (pytest-xdist)
    timing: a WALL-CLOCK budget twin (median of O4_TIMING_RUNS runs, default 3).
        Deselected by default (`-m "not timing"` above): single-run wall times
        swing +/-25 % and a timing gate in a correctness suite fails under
        machine load while every correctness assertion passes (RULINGS
        2026-09-12z, four lanes: 12.7 s < 12.0, 29.4 s < 22.0).  Select with
        `-m timing -n0` on a quiet machine, foreground, never beside a build.
filterwarnings =
    ignore::DeprecationWarning
