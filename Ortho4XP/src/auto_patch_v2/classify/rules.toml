# auto_patch_v2 CLASSIFY — the scorer's thresholds (owner 2026-09-03e:
# editable data, not code).  Every value is a CLASSIFICATION rule — where a
# pavement face's ROLE comes from — never a grade cap (those live in
# ``law/``).  v1 references are the constants the 09-02 arms were built with;
# a change here changes roles, and roles change which law applies.

[cells]
snap_grid_m  = 0.01    # noding grid of the pavement slice (v1 global_slice._GRID_SIZE)
min_area_m2  = 0.25    # a polygonised piece below this is noise, folded into its neighbour (v1 _MIN_PIECE_AREA)
on_tol_m     = 1.0     # a cell whose boundary runs within this of a centreline TOUCHES it (v1 _ON_TOL_M)
min_shared_m = 0.5     # ...and shares at least this much boundary with it (a corner graze is not contact)

[keyhole]                       # dead-end centrelines spur to the nearest boundary so the tip grades (v1 global_slice)
deadend_boundary_tol_m = 3.0    # an endpoint farther than this from the pavement boundary is INTERIOR
join_tol_m             = 3.0    # another centreline within this of the endpoint = a junction, not a dead end
max_spur_m             = 40.0   # never spur farther than this (a corridor is at most about this wide)

[corridor]
max_width_m = 50.0     # single-axis face with mean width (area / shared edge) <= this is a CORRIDOR (v1 _CORRIDOR_MAX_WIDTH_M)

[junction]
max_area_m2                  = 2500.0   # a multi-centreline face up to this area is a tight junction (v1 _JUNCTION_MAX_AREA_M2)
route_territory_half_width_m = 25.0     # bigger faces are junctions when mostly within this of their routes (v1 _ROUTE_TERRITORY_HALF_W_M)
route_territory_min_fraction = 0.55     # ...this fraction of their area (v1 _ROUTE_TERRITORY_MIN_FRAC)

[apron]
route_proximity_m   = 50.0   # pavement nearer than this to a taxi centreline or runway is NOT apron (user 2026-07-06; APRON_ROUTE_PROXIMITY_M)
through_join_tol_m  = 2.0    # only THROUGH routes count for the cut: each end joins another centreline or the runway within this (2026-07-06 gate-lead-in fix)
through_min_len_m   = 150.0  # ...or the route is at least this long (owner 2026-07-26, KCLT taxiway U; APRON_ROUTE_THROUGH_MIN_LEN_M)

[osm_taxiways]                 # OSM aeroway=taxiway ways as taxi centrelines where the apt.dat network is SILENT
enabled  = true
dedup_m  = 8.0                 # a way part within this of a 1202 route duplicates it and is dropped
min_len_m = 20.0               # a surviving part shorter than this is noise

[service]
road_width_m     = 6.0     # the 1206 ground-route corridor width outside pavement (SERVICE_ROAD_WIDTH_M)
free_max_width_m = 25.0    # a route station is FREE (cuts its own face) only where the pavement cross-section is at most this wide or absent (owner 2026-07-27 free-road ruling)
sample_step_m    = 5.0     # station spacing of the cross-section test
min_run_m        = 12.0    # free stations group into runs; shorter runs stay with the apron

[osm_roads]                    # OSM highway=* ways as ground-vehicle centrelines beside the 1206 routes (RULINGS 2026-08-15: the mapped road IS the spine where nothing better exists; owner 2026-09-04j evidence)
enabled   = true
highways  = ["service"]        # the tag values admitted (v1 osm_load: highway=service is the airport road feed)
dedup_m   = 8.0                # a way part within this of a 1206 route duplicates it and is dropped
min_len_m = 10.0               # a surviving part shorter than this is noise

[lot]                          # owner 2026-09-04j: roads and PARKING LOTS are classes of their own, cut at the road-to-lot mouths
min_road_fraction      = 0.2   # a polygon CARRIES a road only when the road centreline inside it is at least this fraction of its half-perimeter (CYXY pav4: 41 m of road clipping a 464 m hangar-side strip is not a road strip)
narrow_road_width_m    = 12.0  # a source polygon (apt.dat 110 / DSF page) at most this wide that carries ANY road centreline IS the road (the pavement is the road)
min_lot_width_m        = 11.0  # §37 (5) (owner RULINGS 2026-09-13j item 7, 13ab; Fable 2026-09-13): A PAGE TOO NARROW TO PARK ON IS NOT A CAR PARK. The minimum width a 90-degree car park can physically have is one 5.0 m stall row plus one 6.0 m one-way aisle = 11.0 m; below it there is no parking module at all. A page narrower than this never reaches the two WEAKEST rungs of the lot ladder (`carries_osm`, the 04u `reach > 0` rung) — it is the ROAD where it carries any road centreline and stays `open` where it carries none. MAPPED parking evidence still wins above it (`parking_cover_fraction`, an OSM parking aisle): a surveyed fact outranks a width heuristic. Measured at KCLT: `dsf:pol82` (the owner’s shapeID 791, 8.4 m wide, 601 m long, 71 m of OSM road inside and 5 roads reaching it) was minted `parking_lot` on the 04u rung — the 12 m narrow-road rule never fired because it is gated on `min_road_fraction` × half-perimeter (120 m on a 601 m ribbon) — and §27 then flipped it to `apron` on 20.8 m of lateral contact by the LOT rule, §37 (2)’s share test not applying to a face not born a road. Twelve KCLT pages 6.7–10.3 m wide read the same way. CYXY `pav4` (11.5 m, 41 m of road on a 464 m half-perimeter — the case `min_road_fraction` was written for) is ABOVE this floor and is unmoved.
max_road_pieces_per_100m = 2.0 # ...and at most this many merged road pieces per 100 m of half-perimeter: ONE road, not an aisle grid (measured CYXY 2026-09-04: strips 0.2-1.5, lots 2.9-4.6)
apron_name_tokens      = ["apron", "ramp"]  # an apt.dat 110 description containing one of these names an APRON (SPJC names its aprons "Ramp" — 2026-09-05b): its faces are never corridors (stand lanes inside an apron are apron, RULINGS 2026-09-03j)
through_min_fraction   = 0.6   # a wider polygon (up to service.free_max_width_m) is a road STRIP when at least this fraction of its half-perimeter is road centreline running THROUGH it (both ends on its boundary); parking aisles dead-end inside and never qualify
parking_cover_fraction = 0.5   # an OSM amenity=parking polygon covering at least this fraction of a source polygon makes it a lot (no such tag in the airport feeds today — a data question)
apron_cover_fraction   = 0.1   # OSM `aeroway=apron` covering at least this fraction of a source polygon is APRON EVIDENCE: it refuses the LOT verdict here, and it is one rung of `open_default.apron_evidence` (RULINGS 2026-09-04u). A NOISE FLOOR, not a majority (owner RULINGS 2026-09-11ac item 6) — OSM never draws aeroway=apron over a car park, so partial mapping is authoritative about the KIND even where it is silent about the EXTENT, and a pack's own pavement page is routinely far larger than any one mapped apron polygon. Until 2026-09-11 both tests read `parking_cover_fraction` (one knob, two unrelated jobs) at 0.5, and LEMD's `pav126` — the owner's shapeID 83, a real apron drawn as one 43,000 m2 concrete page, 25 % mapped apron — missed the majority and shipped a parking lot. MEASURED at LEMD: lot sources read 25 % (pav126), 15 % (pav141), 5 % (pav146) and 0 %; genuine aprons read 100-45 %.
airside_edge_min_m     = 10.0  # §27 (owner RULINGS 2026-09-12c, Fable 12e): a LOT face whose boundary shares at least this much with AIRSIDE PAVEMENT (the `side = airside` roles of precedence.toml except `building`) is not a lot — it is `apron`. Measured WELD-TOLERANT at `emit.identity.weld_spacing_m`: the classification cells are pre-weld and exact boundary coincidence under-reads the emitted shared edge by ~30 % (LEMD `pav137`, the owner's shapeID 81: 95.0 m exact, 140.2 m welded). Contact only through a `service_road` / `service_junction` face does NOT count (owner: "something can only be groundside if it has no connection to airside other than a service road"; the 61 LEMD service roads sharing an apron edge are owner question 12c-1, open). Slivers (area / perimeter < 1 m, an emit artefact) never flip. v1 carried this as the AIRSIDE-ADJACENCY VETO (`auto_patch/junction_repair.py:2752-2789`, owner 2026-07-27) at 1.0 m; the v2 port dropped it.
road_airside_edge_frac = 0.2   # §37 (2) (owner RULINGS 2026-09-13q KCLT item 7, 13j item 7): A ROAD FLIPS BY SHARE, A LOT BY EDGE. A STRIP-class face — one born `service_road` / `service_junction`, a road BY EVIDENCE — flips to `apron` only when its lateral airside contact is at least this fraction of its whole perimeter (as well as `airside_edge_min_m`). Measured at KCLT: shapeID 791 (`dsf:pol82`, 8.4 m wide, 575 m of road centreline inside, NO taxi centreline, 1,203 m perimeter) flipped on 15.3 + 10.5 m of lateral apron contact — 2.1 % of its perimeter — and then climbed +12.33 m off its ground under the apron's 1.5 %. A through-road touching an apron for 2 % of its length is a road that passes an apron, not an apron. LEMD's 61 apron-side lanes (lateral edges to 828 m) run ALONGSIDE their apron and stay apron. Lot-class faces are unchanged: a lot flips on `airside_edge_min_m` of edge whatever its perimeter (owner 12c is about the EDGE, not the share).
mouth_width_factor     = 1.5   # §27 (5) (owner RULINGS 2026-09-12f): THE GROUNDSIDE EXEMPTION IS A MOUTH. A groundside shape stays groundside only where its airside contact is a free road meeting it END-ON — the strip's END CAP, its cross-section: a contact at most this many strip-widths long AND TRANSVERSE to the strip's axis (within 45 deg of its normal). A LATERAL edge is never a mouth however short, and a lateral contact of `airside_edge_min_m` flips the face. The strip's width and axis are its minimum rotated rectangle's short and long sides; the narrower of the two faces in contact is the strip (a road meets an apron end-on at the ROAD's cap, never at the apron's). Before 12f the exemption was the neighbour's ROLE (`service_road`), which exempted LEMD's 61 service-road faces running 828 m ALONGSIDE an apron — the free-road ruling (2026-07-27, 'a road sharing an edge with an apron IS the apron') says the opposite.

[taxi_name]                    # RULINGS 2026-09-04z(1): a pavement DESCRIPTION naming a taxiway IS taxi evidence — the page is taxi family (junction) even without a 1202 centreline, never a lot; below a real centreline, above the open default
tokens             = ["taxiway", "twy"]   # whole words, case-insensitive, in the apt.dat 110 description (a DSF page's name is its .pol library path: never a taxiway name)
unauthored_names   = ["new taxiway"]      # the EDITOR'S DEFAULT, not the author's word: WED names every new pavement "New Taxiway N" (measured 2026-09-04: all 31 CYXY 110 polygons, incl. the owner-ruled lots of shape 69 and the shape 161 service road, 04j/04m) — a description equal to one of these plus an optional number names nothing
designator_max_len = 3                    # the word after the token is the taxiway's DESIGNATOR when at most this long ("Taxiway B" -> B; "Taxiway Aux B, C" -> Aux is not one); reported by explain, never a code letter (width class stays the 1202 chain's)

[groundside]
touch_tol_m       = 0.05   # cells within this touch (v1 touch_tol_m); a chain of touching airside cells reaches a runway or is landside (user 2026-06-09)
requires_terminal = true   # an airport with NO terminal has no landside: every paved island is aircraft parking (user 2026-06-11)
default_open_role = "groundside_pavement"  # RULINGS 2026-09-04u: OPEN pavement is never apron by default — a face with no apron evidence (no startup, no taxi centreline on its source, no apron name / aeroway=apron cover) is this role, or parking_lot when a road reaches it (the CYXY pol17+pol20+pol123 lots served by 1206 route 50); gated by requires_terminal like the demotion

[taxi_subrole]                        # corridor faces name their taxi sub-role from geometry against the runways
parallel_max_angle_deg     = 15.0     # axis within this of a runway bearing = a parallel
parallel_min_overlap_frac  = 0.3      # ...and at least this fraction of the axis projects onto the runway's extent
primary_max_offset_m       = 300.0    # the nearest parallel within this lateral offset is the PRIMARY parallel
runway_touch_m             = 1.0      # an axis end within this of a runway is a runway contact (stub)

[leadin]                        # the last dead-end route piece onto a stand carries no spine (user 2026-07-04)
ramp_start_trim_m = 30.0        # a leaf chain ending within this of a 1300 startup...
max_len_m         = 80.0        # ...and no longer than this is a LEAD-IN: out of the slice, the apron covers it

[dsf_pavement]                  # draped .pol pavement pages from the pack DSF (v1 read_dsf_pavements gates)
boundary_buffer_m   = 50.0      # admitted inside the apt.dat boundary + this (DSF_AIRPORT_BOUNDARY_BUFFER_M)
overlay_fraction    = 0.80      # a page >= this fraction inside apt.dat pavement is an OVERLAY: only its remainder counts
remainder_min_m2    = 50.0      # ...and a remainder piece below this is dropped
min_area_m2         = 5.0       # a clipped page below this is dropped

[surfaces]
graded_codes = [1, 2, 3, 4, 5, 12, 14]   # apt.dat surfaces that are pavement to grade; water (13) / transparent (15) are not

[buildings]
sources = ["osm", "dsf:fac", "dsf:object"]   # footprint sources admitted as pads (v1: OSM + DSF facades + OBJ8 structures)
