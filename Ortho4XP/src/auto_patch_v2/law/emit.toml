cluster_apron_reach_m = 40.0   # RE-ARMED as the COLLAR PLANE (owner RULINGS 2026-09-14bk): the apron within this distance of a cluster's outline is ONE PLANE in the AIRSIDE solve (constraints.cluster_pad.cluster_apron_plane), bounded to the touching component and never across a taxi-family face; the pad's plate then equals it in stage 2.  0 disarms.  Previously DISARMED (RULINGS 2026-09-13ce): at 60 the reach moved 2,651 KCLT taxi vertices (worst 1.45 m) through the apron welds while the cluster-pad MERGE was inert (the `_pairs` decimation defect); re-armed only when the merge does the work and the taxi family moves <= hard_tol_m (round 4). Design value 60.0.
# §28 (6) A HILLSIDE TERRACE IS NOT A FRONTAGE (owner RULINGS 2026-09-13o,
# refined 13p; Fable 2026-09-13).  A pad-face PAIR whose median DEM step —
# the median over the face's frontage vertices of ``dem_z`` minus the pad
# footprint's OWN median ``dem_z`` — exceeds this mints NO
