#   LEMD  building4  -> route3/6     +2.03 / +2.00   ARMED
#   LEMD  building12 -> pav70        +0.00   ARMED
#   CYXY  building1  -> pav29(#1)    +0.05 / +0.02   ARMED
# 3.2 is the centre of the 3.00-3.43 gap that population leaves.  It is a
# NARROW gap and it is the one the data has: an emitted-patch read of the
# same pairs gives +4.5 / +4.7 at CYXY because the production DEM is
# SMOOTHED (CYXY inset HRDEM 1 m, smoothing radius 1 px) — quote the frame
# with the number.
#
# DEVIATION REPORTED, never decided here: 13o set 2.8 on the step against
# the pad's SOLVED level (CYXY +4.08 / +3.02 against LEMD +2.66).  On the
# quantity a generator can actually read, the same pairs measure +3.76 /
