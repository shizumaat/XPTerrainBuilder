# a taxi-family face now carries the SAME row at the SAME weight, valued
# at its OWN station (the foot of its perpendicular on the nearest
# centreline chain).  The chain speaks only for its OWN faces (the
# taxi-family faces its own vertices touch) and only where it is LONG, so
# this is a BACKSTOP, not the scope: it stops a chain valuing a vertex on
# the far side of a face that reaches away from it.  MEASURED: CYXY's
