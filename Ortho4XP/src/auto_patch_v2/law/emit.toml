# a lawful terrace.  PER PAIR, never per vertex (a per-vertex bound
# saw-tooths a 16-vertex frontage).  0 disables the bound.
#
# THE QUANTITY IS DEM-VS-DEM because a constraint generator has no SOLVED
# pad level — the level is what §20's rows produce, three lag rounds later.
# MEASURED IN THE ENGINE'S OWN FRAME (lane `v2frontagestep`, the production
# DEM on the captured planar maps, `v2_solve_replay --capture`), the whole
# population of pad-face pairs:
#   CYXY  building9  -> pav4         +3.76   DISARM (the owner's 13l item 1:
#   CYXY  building10 -> dsf:pol129   +3.43   DISARM   cut into the hillside,
#                                                     the lot a storey up)
#   LEMD  building4  -> pav124       +3.00   ARMED  (the case 12r ordered
