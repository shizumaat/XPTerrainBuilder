# ``runway_profile_window_m`` (``constraints/surface_trend.py``, the 2-D
# sibling of ``trend.py``) — and NO affine rows.  A body at or under the
# window keeps its three ``body_datum`` rows: inside one window the trend
# is its plane to the fit's own precision.
# WEAK, at ``taxi_trend``'s price and below ``body_datum`` by design: the
# trend says WHERE the apron sits, and every law row, the within-shape
# rows and the pad's own level are senior to it.  The ground still enters
# pavement only through LONG-WAVE trends (08t (1)) — the window is the
# guard, and the fit's degree is bounded by what its samples resolve.
apron_trend   = 30.0
road          = 3.0    # a road chain's own bending (the second difference along its breakline), welded at its pavement contacts, ramping between levels at its own caps
detached_mean = 1.0    # a truly detached body (no route, no touching pavement, no road) sits at its own DEM mean: ONE soft term on the body's mean (owner 08t answer 6)
# THE PER-BODY DATUM (owner RULINGS 2026-09-09p (3), refining 08t answer 6:
# taxiway G at CYXY "is not sloping up enough like it was before, resulting in
