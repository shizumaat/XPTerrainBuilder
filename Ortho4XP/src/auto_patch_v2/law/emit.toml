polish_rounds_max = 2      # MEASURED (lane v2cyxy round 2, three HECA builds and five CYXY replays): beyond TWO rounds the polish buys no law and costs surface.  HECA at 2 rounds is BYTE-IDENTICAL to round 1 (body_sha 87b241d8319b), solve 43.4 s, 05C/23C bow -2.28 m; at 12 rounds the worst hard row moves 0.1488 -> 0.1270 m and the SAME bow goes to -2.76 m for +90 s of solve; at 12 rounds with hard_weight 1e7 it reaches 0.0276 m for +237 s and STILL does not settle.  The augmented-Lagrangian polish does NOT converge on a real airport at any weight measured — the multiplier sequence oscillates while the one-sided active set re-forms under it — so the loop's job here is to report the NAMED FAILURE, which is what 09r (3) asks of it when the cap is reached
