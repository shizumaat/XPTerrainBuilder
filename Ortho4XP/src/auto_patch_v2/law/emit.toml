# up the hill was pulled toward the runway's level and the taxiway serving it
# flattened.  Every APRON BODY (the connected faces of the ``apron`` bending
# class — every value role that is not runway family, taxi family or road)
# now carries ONE row: the MEAN z of its vertices targets the MEAN production
# DEM under them.  ONE row per body, NEVER per vertex — the bending term still
# shapes the body, this only says WHERE IT SITS.  Runway and taxi bodies are
# excluded: they carry the threshold chord and the taxi design profile.
# WEIGHT: the LAW's own (300).  The datum is a TARGET of equal standing
# with the law rows it trades against — a heavier one overpowers them
# (measured at 3000: apron|apron within_shape steps of 0.85 m minted in the
