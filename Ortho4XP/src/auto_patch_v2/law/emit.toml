# auto_patch_v2 LAW — emission constants: chord density, identity,
# materiality (Appendix A §5; plan §1 "chord density is a law parameter
# applied once at planar-map build").

[chords]
pavement_max_chord_m    = 60.0   # no airside-pavement ring chord longer than this — ONE decimator, ONE cap (memory two-decimators-mask-each-other)
apron_interior_spacing_m = 50.0  # apron interior vertex lattice spacing; a void wider than this is a membrane defect (08-24b/c, 08-26)
station_spacing_m       = 12.0   # runway / spine profile station spacing along breaklines (crown spines 12 m stations, 08-05)

[identity]
coordinate_dp           = 11     # canonical vertex identity = lat/lon rounded to this many decimals (memory canonical-identity-join)
min_distinct_spacing_m  = 0.5    # two DISTINCT vertices never closer than this — the census's proximity knob (LAW_TRUE_KNOBS proximity_m)
dsf_pavement_admission_m = 1000.0  # a DSF .pol pavement page is THIS airport's only within this of its own apt.dat runways / pavements / boundary (RULINGS 2026-09-06a: the tile DSF carries every airport's pages — LEGT/LERM/LETO admitted LEMD-tile pages 47–79 km away and the flat-site grid sampled a cold tile 1,300 km south)
weld_spacing_m          = 1.0    # THE SLIVER WELD (RULINGS 2026-09-04u): two same-side pavement cells whose boundaries lie within this of each other share the edge / the vertices at planar build — no unowned sliver between pavements (CYXY cross_connector 101 / junction 211: 0.47 m, draped as a cliff). Read in PRE-SNAP coordinates, so it is the identity spacing plus the snap's half-diagonal (0.5 + 0.35), which also covers HECA's post-snap 0.554 m rim (04s, pav129 #331 / pav81 #42) and matches the frontage near-miss horizon (structures.building_pad.frontage_near_miss_m)

[materiality]
elevation_m             = 0.01   # a residual below this is PASS-with-residual, never iterated (owner 2026-08-02 convergence guards)
grade                   = 0.0001 # 0.01 pp for grade residuals (same ruling)
step_m                  = 0.5    # an elevation disagreement at one coordinate ≥ this is a STEP (06-20; LAW_TRUE_KNOBS edge_step_m)

[no_step]
# RULINGS 2026-09-04o (clarifying 08-27): "feasible elevations propagate out
# from runway thresholds and have to follow taxi routes ... aircraft can't
# travel straight across the grass".  A no-step pair is formed ALONG
# PAVEMENT and priced at the cap of the TRAVEL PATH over the ROUTE distance
# (04q-1), never a plan chord at the apron's cap; a pair with no pavement
# path inside the window does not exist.  v1's 150 m / K=16 re-derived as
# route metres (measured trigger: CYXY apron 156 held 3.4-4.7 m under the
# lidar by 149.9 m chords to runway vertices while its route is ~250 m).
metric                  = "route"  # the pair metric: along the taxi network through airside pavement (04o)
window_m                = 150.0  # airside no-step window, ROUTE metres (08-27 constant, 04o metric; AIRSIDE_NO_STEP_WINDOW_M)
k                       = 16     # law pairs per airside vertex: its K nearest BY ROUTE DISTANCE (AIRSIDE_NO_STEP_K)

[transect]
# THE TRANSECT WALK (owner 2026-08-21, spec transverse-hyperplane-solve-spec.md
# step 2; v1 auto_patch/transect_walk.py constants): the transverse law prices
# a corridor CROSS-SECTION at stations along each axis, a perpendicular either
# side, the ring-edge INTERPOLATIONS the perpendicular crosses.
step_m        = 10.0   # station spacing along an axis (STEP_M)
half_width_m  = 80.0   # how far either side a perpendicular looks (HALF_M)
min_width_m   = 3.0    # the narrowest cross-section the law prices (MIN_WIDTH_M)
max_gap_m     = 1.0    # the priced span's near side may sit at most this off the axis (MAX_GAP_M)

[within_shape]
# WHICH ring pairs the within-shape law prices (v1 grade_graph / grade_law).
apron_body_chord_max_m   = 60.0  # apron interior body chord beyond this is not a grade path (APRON_BODY_CHORD_MAX_M); ring-adjacent and spine chords never dropped
runway_station_cluster_m = 5.0   # runway ring vertices cluster into stations at this along-axis step; only same/adjacent-station pairs are lateral law (user 2026-07-08, RUNWAY_STATION_CLUSTER_M)
# CAP BY EDGE PORTION (RULINGS 2026-09-04t-2, refining owner 2026-07-06): a
# junction / road sharing a LONG EDGE with an apron takes the apron's cap on
# the portion ALONG the apron only; a MOUTH (a corridor joining or leaving the
# apron across its own width) keeps its own cap.  "Long" is geometric: the
# contiguous shared run's length against the face's own width (the short
# side of its minimum rotated rectangle).  A mouth shares about one width
# (a square-on join ~1.0, a 45-degree skewed join ~1.4); a face that runs
# ALONG an apron shares a multiple of its width.  v1's oracle reads the same
# value (auto_patch.config.APRON_EDGE_PORTION_MIN_WIDTH_RATIO; a harness
# twin holds the two equal).
apron_edge_portion_min_width_ratio = 1.5
# JUNCTION BODIES ARE PRICED BY THEIR MESH (RULINGS 2026-09-04y, applying
# 04t-3; the v1 oracle's JUNCTION MESH RULE, user 2026-06-30): a face of
# one of these roles has NO all-pairs body — its law edges are the ring
# edges, the pairs sharing ONE stretch, and the edges of its own triangle
# mesh (published as sidecar ``mesh_edges``); each mesh edge at the cap of
# the crossing stretch nearest its midpoint; a chord between two stretches
# of different letters produces no row.  v1: grade_law.JUNCTION_ROLES
# (service_junction there is the road family here and keeps roads.py).
junction_mesh_roles = ["junction"]
# THE WITHDRAWN CHORD LAW'S FLOOR (RULINGS 2026-09-06o/06p (3)): the v1
# oracle's taxi-family CHORD rows on a route-law patch are stamped
# ``withdrawn_law_05aa`` (harness/census.py::stamp_withdrawn_taxi_chords)
# ONLY when the chord is at least this long — a 6 m neighbour is not the
# withdrawn 700 m chord: a short stub|stub step is PRICED (measured HECA
# 1.0.291: every taxi|taxi within_shape row was stamped regardless of
# length, stub|stub 13,004, and a 6 m step over 6 m read as withdrawn law).
withdrawn_chord_min_m = 30.0

pad_slope_max            = 0.01  # RULINGS 2026-09-05f (moved here from the deleted [relaxation] table, 08t): a rigid pad is ONE level and its EMITTED plane may slope at most this (m/m) — steeper is a ``pad_flat`` DEFECT (verify/pads.py). Owner: "a 2.27 % floor is a visible tilt"

[seam]
# THE TILE-SEAM CUT (user 2026-05-10; v1 tile_cut.py TILE_CUT_HALF_WIDTH_M): every
# integer lat/lon line the airport crosses is cut out of the layout as a band
# this wide each side — the DEM owns the band, the band-edge vertices are
# DEM-pinned (user 2026-07-04 "treat the seam like a runway edge"; the runway
# arm: owner 2026-07-24, seam contacts enter the profile as hard anchors), and
# each tile's patch carries only the faces on its side.
half_width_m = 5.0

[instrument]
# THE CENSUS'S OWN ENCODING ENVELOPE — the forgiveness the v1 oracle grants
# an EMITTED value (never a solve budget: the solver satisfies the law
# exactly and the reader forgives rounding on top).  verify/ prices with
# the same envelope so the two row sets are diffable.
rounding_noise_m   = 0.03  # per-node alt_abs at 0.01 m: a pair carries this (ELEV_ROUNDING_NOISE_M)
coarse_noise_m     = 0.1   # junction-family weld hubs / sloped quads (SLOPED_QUAD_ROUNDING_NOISE_M); also every rate reader's quantum
coarse_noise_roles = ["junction", "service_junction"]  # the weld-hub roles the coarse envelope applies to (check_grade._WELD_HUB_ROLES = JUNCTION_ROLES)
strip_edge_noise_m = 0.15  # runway_end_skirt ring edges (skirt_edge_noise_m)
step_contact_tol_m = 1.0   # a vertex touches a foreign edge within this (_STEP_CONTACT_TOL_M)
edge_search_m      = 5.0   # step readers look this far for a foreign edge (LAW_TRUE_KNOBS edge_search_m)
tile_seam_zone_m   = 400.0 # nodes within this of a crossed tile line are seam-zone (TILE_SEAM_ZONE_M)

[lateral_contiguity]
# THE STATION WALK (owner FINAL 2026-08-02 clause 2; RULINGS 2026-08-25b,
# 2026-08-28 Amendment 2 "the cap lives at the STATION"; v1
# auto_patch/lateral_contiguity.py constants): a road-family ring is priced
# at stations along its own long axis; at each station a perpendicular
# probe cuts every governed pavement ring, the pieces that TOUCH merge
# into a run, and the run holding the station takes the STRICTEST class
# cap present in it.  The emitter publishes the vector (sidecar
# ``station_caps``) and the census reads it — the fourth reader.
station_step_m = 5.0    # station spacing along the long axis (STATION_STEP_M); stations sit at interval CENTRES
probe_m        = 60.0   # the perpendicular probe reaches this far either side (PROBE_M)
gap_tol_m      = 0.05   # two cut pieces closer than this are ONE run (GAP_TOL_M — emitted-coordinate noise, never a near-miss horizon)
min_member_m   = 0.5    # a foreign piece shorter than this along the probe is a graze, not a member (MIN_MEMBER_M)

[road_profile]
# THE CORE SMOOTHS FIRST (RULINGS 2026-09-04t-4; 2026-08-31 "leverage the
# core"): a road-family face's fit target is the profile Ortho4XP's own
# road clamp (`O4_Vector_Utils.clamp_road_network`, per way, on the
# centreline, cap-Lipschitz mid-envelope) gives it, laterally levelled
# (both kerbs read the centreline, `include_roads.alt_vec_shift`).  These
# are the CORE's constants mirrored here so the adapter can be law-driven;
# `test_m3c_roads.py` holds them equal to the core's own values.
station_m         = 20.0   # clamp station spacing (O4_Vector_Utils.DEFAULT_ROAD_STATION_M)
lane_width_m      = 4.0    # the core's `lane_width` cfg default; a hosted build passes the tile's own
answer_radius_lane_widths = 2.0  # a vertex reads the profile within this many lane widths (Levelled_Roads.radius_m)
# the longitudinal cap is `common.roles.service_road.longitudinal` — ONE
# constant with the core's `road_grade_limit` default (O4_Cfg_Vars); a
# hosted build passes the tile's own value.
[terrace]
# THE SHAPES (owner RULINGS 2026-09-08k; spec ``heca-v1-parity-spec.md`` §8;
# ``planar/shapes.py``): "if pavement is touching, or overlapping, then it
# should be treated as a single shape, only separated by narrow mouths /
# service roads; pavement separated by more than 0.5 m is a separate apron
# or lot and could then have a wall / step between them; no other steps are
# allowed in aprons — they must be solved by what their connecting taxiways
# can serve".  A SHAPE is a connected component of the union of the
# shape_roles faces, closed by separation_m and opened by narrow_mouth_max_m
# (the bodies of one component are the parts of its erosion by half the
# mouth width; a neck narrower than the mouth, a point contact, a contact
# edge shorter than the mouth separate two bodies).  A road is never a
# member: it SEPARATES (its vertices take the nearest shape's label, the
# boundary falls mid-road).  A JOINT exists only between two shapes — the
# label-boundary contour through a face carrying two labels, or the midline
# of a gap the step readers price (instrument.step_contact_tol_m) — declared
# in the sidecar ``terrace_joints`` so both instruments read the step as
# lawful.  Inside a shape no step is lawful and no joint exists: the apron
# rows yield without a ceiling (``[yield]``).  A joint inside a runway strip
# is never declared (walls at runway edges are never lawful, owner
# 2026-08-01): the two bodies weld there.
separation_m       = 0.5    # pavement closer than this is ONE shape (the owner's number; the 04u weld shares the vertices of gaps under identity.weld_spacing_m already — this governs unwelded pavement)
narrow_mouth_max_m = 12.0   # a connection narrower than this (a neck, a point contact, a short contact edge) does not join two bodies — wider than any service road, narrower than a code-C taxiway; pending the owner's number
shape_roles        = ["runway", "runway_crossing", "primary_parallel", "secondary_parallel", "stub", "cross_connector", "junction", "apron"]  # the pavement whose union forms the shapes (the runway and taxi families, the apron-like roles); the road family never (a separator), pads never (07c-3: a pad takes its majority label), groundside never (the stand-off is its own lawful terrace)
band_roles         = ["apron", "junction", "service_road", "service_junction"]  # the faces whose non-station vertices lose their hop-derived REACH band (RULINGS 2026-09-07g (2): the in-shape band measured INFEASIBLE under pairwise agreement; the kept rows carry the reach) — the taxi / runway faces keep theirs

# THE SHAPE-STAGE CONSTANTS the yield table used to hold (moved here with
# the yielding machinery's deletion, RULINGS 2026-09-08t): neither is yield
# law — the sliver merge runs in the planar build, the groundside ramp is a
# LAW GENERATOR (``constraints/groundside.py``).
sliver_area_factor  = 8.0     # 08d change 4 (a): a face of the SAME pavement and role under (identity.min_distinct_spacing_m x this)^2 = 16 m2 is a classification sliver merged into its neighbour at the planar build (HECA pav131 face 269: 3 nodes, 9.8 m2, 47 m long)
groundside_ramp_max = 0.05    # 08d change 4 (b): the apron edge RAMPS to the groundside ring across the stand-off at this grade (v1 GROUNDSIDE_MAX_GRADE, config.py:1519), never a step

[design]
# THE DESIGN SURFACE (owner RULINGS 2026-09-08t; spec ``auto-patch-v2/
# design-surface-spec.md``): pavement is a DESIGNED surface — minimum
# curvature, unbounded cut and fill, flush and tangent at every contact,
# the DEM a datum only, every law a TARGET the surface aims for, the sim
# the acceptance.  ONE sparse least-squares solve (``solve/design.py``)
# replaces the LP with tiers, IIS, relaxation and yield rows.  These are
# the objective's WEIGHTS — the relative price of a metre of each residual
# (bending is metres of integrated curvature, every other term metres) —
# law-table values, never literals in the code.
bend          = 1.0    # thin-plate bending over each connected pavement complex (the cotangent Laplacian of its constrained Delaunay triangulation): the shaping term, the unit the rest are priced against
chord         = 300.0  # the runway's threshold-chord target per ridge station (``constraints/runway_chord.py``, published through ``PlanarMap.preferred_z``): the runway sits on its chord and FILLS, it never fits the DEM
law           = 300.0  # every law row of every generator as a ONE-SIDED quadratic penalty (grade caps, transverse, K, rate, no_step, crown, portions, bands, offsets): strong, so a law is met wherever the geometry allows, and a design target where it cannot
dem_zone      = 10.0   # the DEM fit on the adjacent-ground / graded-strip zone vertices ONLY, ramped 0 at the pavement edge to this at the zone's outer ring (beyond it the vertex IS the DEM, not an unknown)
road          = 3.0    # a road chain's own bending (the second difference along its breakline), welded at its pavement contacts, ramping between levels at its own caps
detached_mean = 1.0    # a truly detached body (no route, no touching pavement, no road) sits at its own DEM mean: ONE soft term on the body's mean (owner 08t answer 6)
# THE ONE-SIDED PENALTIES are met by an ACTIVE-SET iteration: solve, take
# the rows the surface violates, re-solve with those rows active, repeat
# to a fixed point of the active set.
active_set_max_rounds = 200    # iterations before the solve reports the set it stopped on (measured: CYXY and HECA settle well inside this)
active_set_tol_m      = 0.001  # a row inside this of its bound is not counted as a set change (a tenth of the 0.01 m elevation materiality)
solver_tol            = 1e-8   # the linear solver's relative residual tolerance per round
solver_max_iter       = 20000  # per-round iteration cap of the linear solver
