taxi_trend_face_reach_m = 250.0
# THE APRON BODY'S 2-D TREND (owner RULINGS 2026-09-10ar; spec §8.7).
# ``body_datum`` gives an apron body three AFFINE rows, so its
# least-squares PLANE follows the ground's.  Over a body larger than the
