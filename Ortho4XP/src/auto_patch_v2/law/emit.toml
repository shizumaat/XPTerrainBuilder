# auto_patch_v2 LAW — emission constants: chord density, identity,
# materiality (Appendix A §5; plan §1 "chord density is a law parameter
# applied once at planar-map build").

[chords]
pavement_max_chord_m    = 60.0   # no airside-pavement ring chord longer than this — ONE decimator, ONE cap (memory two-decimators-mask-each-other)
apron_interior_spacing_m = 50.0  # apron interior vertex lattice spacing; a void wider than this is a membrane defect (08-24b/c, 08-26)
station_spacing_m       = 12.0   # runway / spine profile station spacing along breaklines (crown spines 12 m stations, 08-05)

[identity]
coordinate_dp           = 11     # canonical vertex identity = lat/lon rounded to this many decimals (memory canonical-identity-join)
min_distinct_spacing_m  = 0.5    # two DISTINCT vertices never closer than this — the census's proximity knob (LAW_TRUE_KNOBS proximity_m)
dsf_pavement_admission_m = 1000.0  # a DSF .pol pavement page is THIS airport's only within this of its own apt.dat runways / pavements / boundary (RULINGS 2026-09-06a: the tile DSF carries every airport's pages — LEGT/LERM/LETO admitted LEMD-tile pages 47–79 km away and the flat-site grid sampled a cold tile 1,300 km south)
weld_spacing_m          = 1.0    # THE SLIVER WELD (RULINGS 2026-09-04u): two same-side pavement cells whose boundaries lie within this of each other share the edge / the vertices at planar build — no unowned sliver between pavements (CYXY cross_connector 101 / junction 211: 0.47 m, draped as a cliff). Read in PRE-SNAP coordinates, so it is the identity spacing plus the snap's half-diagonal (0.5 + 0.35), which also covers HECA's post-snap 0.554 m rim (04s, pav129 #331 / pav81 #42) and matches the frontage near-miss horizon (structures.building_pad.frontage_near_miss_m)

[materiality]
elevation_m             = 0.01   # a residual below this is PASS-with-residual, never iterated (owner 2026-08-02 convergence guards)
grade                   = 0.0001 # 0.01 pp for grade residuals (same ruling)
step_m                  = 0.5    # an elevation disagreement at one coordinate ≥ this is a STEP (06-20; LAW_TRUE_KNOBS edge_step_m)

[no_step]
# RULINGS 2026-09-04o (clarifying 08-27): "feasible elevations propagate out
# from runway thresholds and have to follow taxi routes ... aircraft can't
# travel straight across the grass".  A no-step pair is formed ALONG
# PAVEMENT and priced at the cap of the TRAVEL PATH over the ROUTE distance
# (04q-1), never a plan chord at the apron's cap; a pair with no pavement
# path inside the window does not exist.  v1's 150 m / K=16 re-derived as
# route metres (measured trigger: CYXY apron 156 held 3.4-4.7 m under the
# lidar by 149.9 m chords to runway vertices while its route is ~250 m).
metric                  = "route"  # the pair metric: along the taxi network through airside pavement (04o)
window_m                = 150.0  # airside no-step window, ROUTE metres (08-27 constant, 04o metric; AIRSIDE_NO_STEP_WINDOW_M)
k                       = 16     # law pairs per airside vertex: its K nearest BY ROUTE DISTANCE (AIRSIDE_NO_STEP_K)

[transect]
# THE TRANSECT WALK (owner 2026-08-21, spec transverse-hyperplane-solve-spec.md
# step 2; v1 auto_patch/transect_walk.py constants): the transverse law prices
# a corridor CROSS-SECTION at stations along each axis, a perpendicular either
# side, the ring-edge INTERPOLATIONS the perpendicular crosses.
step_m        = 10.0   # station spacing along an axis (STEP_M)
half_width_m  = 80.0   # how far either side a perpendicular looks (HALF_M)
min_width_m   = 3.0    # the narrowest cross-section the law prices (MIN_WIDTH_M)
max_gap_m     = 1.0    # the priced span's near side may sit at most this off the axis (MAX_GAP_M)

[within_shape]
# WHICH ring pairs the within-shape law prices (v1 grade_graph / grade_law).
apron_body_chord_max_m   = 60.0  # apron interior body chord beyond this is not a grade path (APRON_BODY_CHORD_MAX_M); ring-adjacent and spine chords never dropped
runway_station_cluster_m = 5.0   # runway ring vertices cluster into stations at this along-axis step; only same/adjacent-station pairs are lateral law (user 2026-07-08, RUNWAY_STATION_CLUSTER_M)
# CAP BY EDGE PORTION (RULINGS 2026-09-04t-2, refining owner 2026-07-06): a
# junction / road sharing a LONG EDGE with an apron takes the apron's cap on
# the portion ALONG the apron only; a MOUTH (a corridor joining or leaving the
# apron across its own width) keeps its own cap.  "Long" is geometric: the
# contiguous shared run's length against the face's own width (the short
# side of its minimum rotated rectangle).  A mouth shares about one width
# (a square-on join ~1.0, a 45-degree skewed join ~1.4); a face that runs
# ALONG an apron shares a multiple of its width.  v1's oracle reads the same
# value (auto_patch.config.APRON_EDGE_PORTION_MIN_WIDTH_RATIO; a harness
# twin holds the two equal).
apron_edge_portion_min_width_ratio = 1.5
# JUNCTION BODIES ARE PRICED BY THEIR MESH (RULINGS 2026-09-04y, applying
# 04t-3; the v1 oracle's JUNCTION MESH RULE, user 2026-06-30): a face of
# one of these roles has NO all-pairs body — its law edges are the ring
# edges, the pairs sharing ONE stretch, and the edges of its own triangle
# mesh (published as sidecar ``mesh_edges``); each mesh edge at the cap of
# the crossing stretch nearest its midpoint; a chord between two stretches
# of different letters produces no row.  v1: grade_law.JUNCTION_ROLES
# (service_junction there is the road family here and keeps roads.py).
junction_mesh_roles = ["junction"]
# THE WITHDRAWN CHORD LAW'S FLOOR (RULINGS 2026-09-06o/06p (3)): the v1
# oracle's taxi-family CHORD rows on a route-law patch are stamped
# ``withdrawn_law_05aa`` (harness/census.py::stamp_withdrawn_taxi_chords)
# ONLY when the chord is at least this long — a 6 m neighbour is not the
# withdrawn 700 m chord: a short stub|stub step is PRICED (measured HECA
# 1.0.291: every taxi|taxi within_shape row was stamped regardless of
# length, stub|stub 13,004, and a 6 m step over 6 m read as withdrawn law).
withdrawn_chord_min_m = 30.0

pad_slope_max            = 0.01  # RULINGS 2026-09-05f (moved here from the deleted [relaxation] table, 08t): a rigid pad is ONE level and its EMITTED plane may slope at most this (m/m) — steeper is a ``pad_flat`` DEFECT (verify/pads.py). Owner: "a 2.27 % floor is a visible tilt"

[seam]
# THE TILE-SEAM CUT (user 2026-05-10; v1 tile_cut.py TILE_CUT_HALF_WIDTH_M): every
# integer lat/lon line the airport crosses is cut out of the layout as a band
# this wide each side — the DEM owns the band, the band-edge vertices are
# DEM-pinned (user 2026-07-04 "treat the seam like a runway edge"; the runway
# arm: owner 2026-07-24, seam contacts enter the profile as hard anchors), and
# each tile's patch carries only the faces on its side.
half_width_m = 5.0

[instrument]
# THE CENSUS'S OWN ENCODING ENVELOPE — the forgiveness the v1 oracle grants
# an EMITTED value (never a solve budget: the solver satisfies the law
# exactly and the reader forgives rounding on top).  verify/ prices with
# the same envelope so the two row sets are diffable.
rounding_noise_m   = 0.03  # per-node alt_abs at 0.01 m: a pair carries this (ELEV_ROUNDING_NOISE_M)
coarse_noise_m     = 0.1   # junction-family weld hubs / sloped quads (SLOPED_QUAD_ROUNDING_NOISE_M); also every rate reader's quantum
coarse_noise_roles = ["junction", "service_junction"]  # the weld-hub roles the coarse envelope applies to (check_grade._WELD_HUB_ROLES = JUNCTION_ROLES)
strip_edge_noise_m = 0.15  # runway_end_skirt ring edges (skirt_edge_noise_m)
step_contact_tol_m = 1.0   # a vertex touches a foreign edge within this (_STEP_CONTACT_TOL_M)
edge_search_m      = 5.0   # step readers look this far for a foreign edge (LAW_TRUE_KNOBS edge_search_m)
tile_seam_zone_m   = 400.0 # nodes within this of a crossed tile line are seam-zone (TILE_SEAM_ZONE_M)

[lateral_contiguity]
# THE STATION WALK (owner FINAL 2026-08-02 clause 2; RULINGS 2026-08-25b,
# 2026-08-28 Amendment 2 "the cap lives at the STATION"; v1
# auto_patch/lateral_contiguity.py constants): a road-family ring is priced
# at stations along its own long axis; at each station a perpendicular
# probe cuts every governed pavement ring, the pieces that TOUCH merge
# into a run, and the run holding the station takes the STRICTEST class
# cap present in it.  The emitter publishes the vector (sidecar
# ``station_caps``) and the census reads it — the fourth reader.
station_step_m = 5.0    # station spacing along the long axis (STATION_STEP_M); stations sit at interval CENTRES
probe_m        = 60.0   # the perpendicular probe reaches this far either side (PROBE_M)
gap_tol_m      = 0.05   # two cut pieces closer than this are ONE run (GAP_TOL_M — emitted-coordinate noise, never a near-miss horizon)
min_member_m   = 0.5    # a foreign piece shorter than this along the probe is a graze, not a member (MIN_MEMBER_M)

[road_profile]
# THE CORE SMOOTHS FIRST (RULINGS 2026-09-04t-4; 2026-08-31 "leverage the
# core"): a road-family face's fit target is the profile Ortho4XP's own
# road clamp (`O4_Vector_Utils.clamp_road_network`, per way, on the
# centreline, cap-Lipschitz mid-envelope) gives it, laterally levelled
# (both kerbs read the centreline, `include_roads.alt_vec_shift`).  These
# are the CORE's constants mirrored here so the adapter can be law-driven;
# `test_m3c_roads.py` holds them equal to the core's own values.
station_m         = 20.0   # clamp station spacing (O4_Vector_Utils.DEFAULT_ROAD_STATION_M)
lane_width_m      = 4.0    # the core's `lane_width` cfg default; a hosted build passes the tile's own
answer_radius_lane_widths = 2.0  # a vertex reads the profile within this many lane widths (Levelled_Roads.radius_m)
# the longitudinal cap is `common.roles.service_road.longitudinal` — ONE
# constant with the core's `road_grade_limit` default (O4_Cfg_Vars); a
# hosted build passes the tile's own value.
[terrace]
# THE SHAPES (owner RULINGS 2026-09-08k; spec ``heca-v1-parity-spec.md`` §8;
# ``planar/shapes.py``): "if pavement is touching, or overlapping, then it
# should be treated as a single shape, only separated by narrow mouths /
# service roads; pavement separated by more than 0.5 m is a separate apron
# or lot and could then have a wall / step between them; no other steps are
# allowed in aprons — they must be solved by what their connecting taxiways
# can serve".  A SHAPE is a connected component of the union of the
# shape_roles faces, closed by separation_m and opened by narrow_mouth_max_m
# (the bodies of one component are the parts of its erosion by half the
# mouth width; a neck narrower than the mouth, a point contact, a contact
# edge shorter than the mouth separate two bodies).  A road is never a
# member: it SEPARATES (its vertices take the nearest shape's label, the
# boundary falls mid-road).  A JOINT exists only between two shapes — the
# label-boundary contour through a face carrying two labels, or the midline
# of a gap the step readers price (instrument.step_contact_tol_m) — declared
# in the sidecar ``terrace_joints`` so both instruments read the step as
# lawful.  Inside a shape no step is lawful and no joint exists: the apron
# rows yield without a ceiling (``[yield]``).  A joint inside a runway strip
# is never declared (walls at runway edges are never lawful, owner
# 2026-08-01): the two bodies weld there.
separation_m       = 0.5    # pavement closer than this is ONE shape (the owner's number; the 04u weld shares the vertices of gaps under identity.weld_spacing_m already — this governs unwelded pavement)
narrow_mouth_max_m = 12.0   # a connection narrower than this (a neck, a point contact, a short contact edge) does not join two bodies — wider than any service road, narrower than a code-C taxiway; pending the owner's number
shape_roles        = ["runway", "runway_crossing", "primary_parallel", "secondary_parallel", "stub", "cross_connector", "junction", "apron"]  # the pavement whose union forms the shapes (the runway and taxi families, the apron-like roles); the road family never (a separator), pads never (07c-3: a pad takes its majority label), groundside never (the stand-off is its own lawful terrace)
band_roles         = ["apron", "junction", "service_road", "service_junction"]  # the faces whose non-station vertices lose their hop-derived REACH band (RULINGS 2026-09-07g (2): the in-shape band measured INFEASIBLE under pairwise agreement; the kept rows carry the reach) — the taxi / runway faces keep theirs

# THE SHAPE-STAGE CONSTANTS the yield table used to hold (moved here with
# the yielding machinery's deletion, RULINGS 2026-09-08t): neither is yield
# law — the sliver merge runs in the planar build, the groundside ramp is a
# LAW GENERATOR (``constraints/groundside.py``).
sliver_area_factor  = 8.0     # 08d change 4 (a): a face of the SAME pavement and role under (identity.min_distinct_spacing_m x this)^2 = 16 m2 is a classification sliver merged into its neighbour at the planar build (HECA pav131 face 269: 3 nodes, 9.8 m2, 47 m long)
groundside_ramp_max = 0.05    # 08d change 4 (b): the apron edge RAMPS to the groundside ring across the stand-off at this grade (v1 GROUNDSIDE_MAX_GRADE, config.py:1519), never a step

[design]
# THE DESIGN SURFACE (owner RULINGS 2026-09-08t; spec ``auto-patch-v2/
# design-surface-spec.md``): pavement is a DESIGNED surface — minimum
# curvature, unbounded cut and fill, flush and tangent at every contact,
# the DEM a datum only, every law a TARGET the surface aims for, the sim
# the acceptance.  ONE sparse least-squares solve (``solve/design.py``)
# replaces the LP with tiers, IIS, relaxation and yield rows.  These are
# the objective's WEIGHTS — the relative price of a metre of each residual
# (bending is metres of integrated curvature, every other term metres) —
# law-table values, never literals in the code.
# THE BENDING WEIGHT IS PER CLASS (RULINGS 2026-09-08v): one weight for the
# whole sheet traded the pavement against the strip — the strip could not be
# smoothed without roughening the runway.  A bending row is priced by the
# class of ITS OWN vertex (the senior class of the faces that touch it, in
# the order runway > taxi > apron > road > strip); every other term is
# unchanged.  Units are the same: the price of a metre of integrated
# curvature, against which chord / law / taxi_profile / road are priced.
bend_runway   = 1.0
bend_taxi     = 1.0
bend_apron    = 1.0
bend_strip    = 30.0
bend_road     = 1.0
chord         = 300.0  # the runway's PROFILE target per ridge station (``constraints/runway_chord.py``, published through ``PlanarMap.preferred_z``): the runway sits on its target profile and FILLS or CUTS to it, it never fits the DEM per vertex.  The row is the same row under 09-10q/10r/10t — only its TARGET changed from the straight threshold chord to the ground's long-wave trend through the pins (spec §21)
# THE RUNWAY PROFILE FOLLOWS THE AIRPORT (owner RULINGS 2026-09-10q/10r,
# ruled 10t (3); spec §21).  SPJC: the built ridge reproduced the straight
# threshold chord to <= 0.01 m at every station — zero vertical curves —
# and sat 26.71 m abeam a taxiway the lawful envelope admits it at 25.60.
# The ``chord`` row's target is now the GROUND'S LONG-WAVE TREND along the
# ridge: at each ridge station the value of a moving QUADRATIC least-squares
# fit of the production DEM over +/- this window, shifted by the LINEAR
# correction that puts it exactly through the two threshold pins (a linear
# correction leaves the fit's second derivative untouched, so the pins cost
# the profile no curvature).  The window is the SCALE OF THE LAW: at 500 m
# it is longer than a K = 305 m vertical curve, so the target already has
# only long gentle curvature and the runway bends with the ground's trend
# without undulating with the ground (08t (1) / 09b).  Schema-validated at
# or above the largest ``rulesets.*.runway.vertical_curve_k_m``.
runway_profile_window_m = 500.0
law           = 300.0  # every law row of every generator as a ONE-SIDED quadratic penalty (grade caps, transverse, K, rate, no_step, crown, portions, bands, offsets): strong, so a law is met wherever the geometry allows, and a design target where it cannot
# THE DEM HAS LEFT THE PATCH (owner RULINGS 2026-09-09b (3)): the
# `dem_zone` weight, its rows and the beyond-the-outer-ring DEM fixing are
# DELETED.  The adjacent ground is a LAW surface off the pavement edge —
# zone 1 the lip draining down, zone 2 the graded strip at the strip
# transverse law, the runway ends per the end-skirt law — and the outer
# ring's elevation is whatever those laws give; the MESH ENGINE blends
# from the patch boundary to the DEM outside it.  The DEM's only entries
# left are the threshold pins, the tile-seam preference and a detached
# body's own terrain plane.
taxi_profile  = 300.0  # THE TAXI DESIGN PROFILE (09-09b (2), "taxiways should follow terrain less and be more like runways"): the second difference of z along every taxi CENTRELINE chain — the runway K pattern as a strong curvature target, so a taxiway is designed along its route instead of draping between its law rows
# THE TAXI CHAIN'S TARGET PROFILE (owner RULINGS 2026-09-10v (1); spec
# §8.6).  ``taxi_profile`` is a SECOND DIFFERENCE with RHS 0 — curvature,
# no level — so a long taxiway had no level at all (CYXY `pav28`, 10o) and
# a taxiway with the right mean had no TILT (SPJC `pav49`, 10t).  Every
# taxi CENTRELINE chain now carries a TARGET PROFILE: the ground's
# long-wave trend along that chain (the SAME §21 construction at the SAME
# window key ``runway_profile_window_m``), shifted linearly through the
# chain's runway contacts (unshifted where it touches none).  WEAK, and
# below ``body_datum`` (300) by design: the trend tells a taxiway where
# the ground is going, and every law row, the apron body's own plane and
# the curvature row are senior to it.  TUNED by measurement (10v's two
# bars: the CYXY transect within +/- 1.5 m of the DEM east of the zone
# ring, and HECA's per-role taxi undulation within +5 % of control).
taxi_trend    = 30.0
# THE TREND'S REACH ACROSS THE FACE (spec §8.6.1; lane `v2taxidatum` round
# 3).  Round 2 priced the trend on the CENTRELINE only, so a taxi body's
# off-centreline vertices carried no binding at all and the edge lagged
# where the ground rose across the body's width (CYXY -1.80 / -1.93 m at
# the 320 / 330 m stations of the owner's transect, against a +/- 1.5 m
# bar, while the centreline itself sat inside +/- 0.9 m).  Every vertex of
# a taxi-family face now carries the SAME row at the SAME weight, valued
# at its OWN station (the foot of its perpendicular on the nearest
# centreline chain).  The chain speaks only for its OWN faces (the
# taxi-family faces its own vertices touch) and only where it is LONG, so
# this is a BACKSTOP, not the scope: it stops a chain valuing a vertex on
# the far side of a face that reaches away from it.  MEASURED: CYXY's
# `pav28` is 160 m wide at the owner's transect (the taxi body reaches
# from station 170 to 330 under one ref), so at 75 m the far edge — the
# -1.80 / -1.93 m stations this round exists to fix — took no row at all.
taxi_trend_face_reach_m = 250.0
# THE APRON BODY'S 2-D TREND (owner RULINGS 2026-09-10ar; spec §8.7).
# ``body_datum`` gives an apron body three AFFINE rows, so its
# least-squares PLANE follows the ground's.  Over a body larger than the
# fit window that plane has no LOCAL reach: LEMD's T4S apron is one
# 439 x 1,242 m body whose plane was satisfied while its pit CORNER sat
# 1.2 m under its own DEM, and the sheet fell 0.79 m over the last 23.8 m
# into the basin rim.  Such a body now takes ONE row per vertex against
# the ground's 2-D LONG-WAVE TREND under it — a moving quadratic SURFACE
# fit of the production DEM, tricube-weighted over the SAME window key
# ``runway_profile_window_m`` (``constraints/surface_trend.py``, the 2-D
# sibling of ``trend.py``) — and NO affine rows.  A body at or under the
# window keeps its three ``body_datum`` rows: inside one window the trend
# is its plane to the fit's own precision.
# WEAK, at ``taxi_trend``'s price and below ``body_datum`` by design: the
# trend says WHERE the apron sits, and every law row, the within-shape
# rows and the pad's own level are senior to it.  The ground still enters
# pavement only through LONG-WAVE trends (08t (1)) — the window is the
# guard, and the fit's degree is bounded by what its samples resolve.
apron_trend   = 30.0
road          = 3.0    # a road chain's own bending (the second difference along its breakline), welded at its pavement contacts, ramping between levels at its own caps
detached_mean = 1.0    # a truly detached body (no route, no touching pavement, no road) sits at its own DEM mean: ONE soft term on the body's mean (owner 08t answer 6)
# THE PER-BODY DATUM (owner RULINGS 2026-09-09p (3), refining 08t answer 6:
# taxiway G at CYXY "is not sloping up enough like it was before, resulting in
# the whole area of the airport being cut into the hill more than it should").
# Under 08t the sheet minimised bending with no datum of its own, so an apron
# up the hill was pulled toward the runway's level and the taxiway serving it
# flattened.  Every APRON BODY (the connected faces of the ``apron`` bending
# class — every value role that is not runway family, taxi family or road)
# now carries ONE row: the MEAN z of its vertices targets the MEAN production
# DEM under them.  ONE row per body, NEVER per vertex — the bending term still
# shapes the body, this only says WHERE IT SITS.  Runway and taxi bodies are
# excluded: they carry the threshold chord and the taxi design profile.
# WEIGHT: the LAW's own (300).  The datum is a TARGET of equal standing
# with the law rows it trades against — a heavier one overpowers them
# (measured at 3000: apron|apron within_shape steps of 0.85 m minted in the
# shape-joint twin, a 2.5 % stretch against a 1.5 % cap, and the active set
# hitting its round cap at 17 s).  At 300 every CYXY apron body lands within
# 0.11 m of its terrain mean and taxiway G climbs +1.23 m over 125 m.
body_datum    = 300.0
# THE PAD PLANE (owner RULINGS 2026-09-09c, "building pads are targeting
# flat, with up to 1 % allowance where no other solution exists"): a pad
# is no longer a hard ``Flat`` group (one merged column, which dragged
# every surface welded to it to one level).  It is ONE PLANE: its
# flatness is a STRONG TARGET priced at ``pad_flat``, and its tilt is
# bounded HARD at ``emit.within_shape.pad_slope_max`` (1 %) by a ruling
# head listed in ``hard_rulings`` above.  ``pad_flat_rulings`` names the
# heads priced at ``pad_flat`` instead of ``law`` (the same shape as
# ``hard_rulings`` / ``one_way_rulings``: one register, no literals).
pad_flat = 3000.0
pad_flat_rulings = [
  "structures.building_pad flat",                        # 09-09c: the pad's flatness target, priced on the PLANE'S TILT (10y)
  "structures.building_pad frontage_level",              # 09-10l/10y: the SENIOR fronting pavement's edge mean IS the pad's level where one plane cannot meet every frontage
]
# THE PAD IS ONE PLANE FITTED TO ITS FRONTAGE (owner RULINGS 2026-09-10l,
# answering 10k-1 = (A): "Pad takes the apron edge level"; refined by 10y).
# The fit needs no row of its own: a vertex the pad SHARES with the
# pavement it fronts is ONE vertex with ONE value (09-01g), so the HARD
# plane rows through those contacts ARE the least-squares fit of the plane
# to the pavement's own edge.  What the register below names is the SENIOR
# clause — the one row per fronting pad that decides WHICH frontage the
# plane's level belongs to where one plane cannot meet them all
# (``precedence.toml`` order: runway family > taxi > apron > road) — and,
# through ``solve/design`` §9b, the withdrawal of the PER-BODY DATUM from a
# fronting pad: its own DEM datum (09p (3)) is for a pad that fronts NO
# pavement.  Round 1's per-vertex frontage following (a "junior" head
# beside this one) was REFUTED and deleted: it stopped the pad being one
# plane (10y).
pad_level_rulings = [
  "structures.building_pad frontage_level",
  "structures.building_pad frontage_level junior",
]
# A PAD FRONTS BY PROXIMITY (owner RULINGS 2026-09-10ax (1)): a pad EDGE
# within this of a pavement EDGE fronts it, shared vertex or not.  Until
# 10ax frontage was identity only (a shared vertex), and LEMD's
# ``building4`` (66,257 m², 40.4603701 -3.5756711) stands 1.60 m from
# ``pav124`` sharing nothing: it had NO frontage row, kept its DEM datum
# while the apron trend lifted the pavement, and ended 1.58 m below the
# apron it faces with the building floating over the drop (owner's 1.0.310
# read, RULINGS 2026-09-10aw).  16 of LEMD's 43 pads are in that class.
# 3.0 m = ``structures.groundside_cutback_m`` 0.6 + the snap's half
# diagonal, with the margin a source-to-source offset needs (SPJC
# building29's 0.68 m facade-vs-apt.dat offset is the near-miss
# precedent, ``frontage_near_miss_m`` 1.0).  0 disables the proximity
# clause and leaves the identity read alone.
pad_frontage_m = 3.0
# THE BANK AT THE PATCH BOUNDARY (owner RULINGS 2026-09-09e; spec §9).
# Ortho4XP's mesh does NOT blend from the patch boundary to the DEM — it
# drapes the raw DEM right outside the constrained ring (§8.4: a 16.8 m
# cliff one triangle wide at HECA).  Outside every patch-boundary ring
# the patch therefore emits a BANK FOOT ring ON THE DEM at plan distance
# ``d = max(bank_min_width_m, |z_ring - DEM(foot)| / bank_slope)`` along
# the outward normal; the mesh triangulates the bank between them (no
# vertex is emitted in between).  ``bank_foot_smooth`` is the
# second-difference weight along the foot chain that keeps the toe from
# zigzagging (spec §9.4 deviation 1: it is applied to the plan distance,
# the foot's z being the DEM itself).
bank_slope       = 0.33   # 1:3 — an embankment / cut slope a pilot reads as ground, not a wall
bank_min_width_m = 5.0    # the narrowest bank: a ring level with its DEM still stands off the drape by this much
bank_foot_smooth = 30.0   # the toe's smoothing weight, against a unit weight on the formula's own distance
# THE LEVEL RINGS ARE DELETED (owner RULINGS 2026-09-09p (1) /
# 2026-09-09t; spec §13).  09f-1 answered the mesh's graph-harmonic
# squeeze by authoring the bank face with intermediate rings every
# ``bank_ring_spacing_m``.  09t measured a level ring re-emitting the
# FOOT's own edges wherever the bank is narrower than the level's offset
# — duplicate constrained segments, and the +30+031 tile unbuildable —
# and the squeeze surviving every spacing anyway.  ``bank_ring_spacing_m``
# and ``bank_first_ring_m`` are GONE with the construction they sized:
# the patch emits ONE foot ring per boundary and the MESH ENGINE gives the
# annulus's free vertices an altitude linear in plan distance between the
# two rings.
# THE DAYLIGHT LINE (owner RULINGS 2026-09-09g; spec §11).  The fixed
# point ``d = |z_ring - DEM(foot)| / bank_slope`` is the daylight point only
# where the ground is smooth; where it is not it erases the very earthworks
# the owner names.  The foot is instead the CIVIL-ENGINEERING DAYLIGHT
# (catch) POINT: walking outward along the ring's normal in
# ``bank_sample_m`` stations, the FIRST station where the 1:3 design slope
# line (down for fill, up for cut, from the ring's design z) meets the DEM
# within ``bank_daylight_tol_m``, never nearer than ``bank_min_width_m``,
# never farther than ``bank_max_width_m`` (a ray that never daylights takes
# the maximum and is reported by name).  Where the DEM inside the first
# ``bank_min_width_m`` already slopes at or steeper than ``bank_slope`` in
# the fill / cut direction the ground has its OWN bank and the foot is at
# the minimum.  The toe smoothing (09f) is CUT wherever the raw daylight
# distance jumps by more than ``bank_toe_break_m`` between neighbours: the
# toe may jump where the ground does.
bank_sample_m       = 2.0
bank_daylight_tol_m = 0.3
bank_max_width_m    = 200.0
bank_toe_break_m    = 10.0
# THE MESH MUST HAVE VERTICES TO CARRY THE BLEND (owner RULINGS
# 2026-09-09x).  ``O4_Mesh_Utils.bank_annulus_blend_values`` writes an
# EXACT ruled altitude on every free vertex inside the annulus, but the
# mesh puts almost none there (40 tile-wide at HECA), so the bank is the
# ring-to-foot triangulation and a triangle joining a ring vertex to a
# foot vertex at a DIFFERENT bank width is skewed.  The annulus is
# therefore written as a Triangle REGION whose maximum triangle area is
# ``(w / bank_triangle_divisions) ** 2``, ``w`` the local bank width —
# i.e. the bank is divided into about this many triangles across.
bank_triangle_divisions = 3.0
# THE TERRAIN EDGE (owner RULINGS 2026-09-10b/10c; spec §19).  An
# adjacent-ground region (zone 1, zone 2, the end corridors) ENDS at the
# physical edge of the ground that carries it: outward from its pavement,
# where the natural DEM falls away below the region's surface faster than
# the bank can follow — the CREST — or, where a road runs along that
# crest, FLUSH at that road's outer edge (the road keeps its own profile).
# Beyond the edge there is no bank and no patch: the DEM's own slope IS
# the bank and the mesh drapes it.  ``edge_probe_m`` is the outward
# baseline the DEM's downhill slope is read over; a cell is CREST when
# that slope exceeds ``bank_slope`` AND the drop over the probe exceeds
# ``edge_min_drop_m`` (the DEM's own noise stays out).  ``edge_grid_m`` is
# the rasterisation the crest is found on (and so the accuracy of a
# crest-cut edge).  A road governs when its line runs within
# ``edge_road_snap_m`` inside the crest for at least ``edge_road_run_m``.
edge_probe_m     = 15.0
edge_min_drop_m  = 2.0
edge_grid_m      = 5.0
edge_road_snap_m = 20.0
edge_road_run_m  = 30.0
# THE ONE-SIDED PENALTIES are met by an ACTIVE-SET iteration: solve, take
# the rows the surface violates, re-solve with those rows active, repeat
# to a fixed point of the active set.
# THE RUNWAY FAMILY'S LAWS ARE HARD (owner 05s/06b within 08t, RULINGS
# 2026-09-08v): CONSTRAINTS of the active set, never targets — the surface
# holds them or the solve reports it, and the app's DEFECT gate reads exactly
# these.  The threshold pins are already equalities (the vertex is fixed).
# A row is hard when the head of its ``Source.ruling`` (everything before the
# first parenthesis) is listed here; a PREFERENCE row among them is hard at
# its CEILING, not at its preferred cap (the end-zone cap yields minimally,
# owner 2026-07-08, and the crown floor yields to a seam pin, M3a) — so the
# runway's MAX GRADE binds everywhere and the preference stays a preference.
# The generator's remaining rows (the crown floor, the ring chords and the
# crossing feet, which the census reads) stay one-sided targets: they price
# PAIRS the four laws above already govern, and hard they were measured
# mutually unsatisfiable (CYXY: 127/1432 ring chords missed by up to 0.77 m
# under the soft solve, spec §6 deviation 8).
hard_rulings = [
  "rulesets.runway.transverse_max",                      # 05o: flat laterally within the crown drop
  "rulesets.runway.vertical_curve_k_m / max_grade_change",  # 06b law 1: the vertical curve K
  "rulesets.runway.longitudinal",                        # the runway's max grade along the profile
  "rulesets.runway.end_zone",                            # the same, at its ceiling in the end zones
  "rulesets.common.pavement_max_grade ceiling",          # 09-09b (4): the 5 % pavement ceiling / 8 % free road
  "structures.building_pad pad_slope_max ceiling",       # 09-09c: a building pad is ONE PLANE tilting at most 1 %
]
hard_weight     = 300000.0 # the CONSTRAINT weight a hard row is priced at (1000x the law's target weight), with a multiplier shift between rounds: the augmented Lagrangian that makes the runway laws HELD rather than traded (measured CYXY: 3e4 leaves 0.036 m, 3e5 0.010 m, 1e6 0.012 m, 1e8 breaks the factorisation).  RE-MEASURED for RULINGS 2026-09-09r (3) with the settling polish: WITHOUT a runway x runway crossing release CYXY settles at 3e5 (0.0159 m in 9 rounds, DEFECTs zero); WITH it the multiplier sequence OSCILLATES and never settles (best 0.026 m of 12 rounds, one runway_transverse DEFECT), because the primary's chord over the crossing is a target 02/20's own pins and cap forbid.  1e6 clears the DEFECTs but still does not settle (13.9 s solve); 1e7 settles in ZERO polish rounds (5.8 s) but MOVES THE WIDER SURFACE — five further twins red (the m3c lawful road leaves its core profile, 37 route-budget rows at the taxi-route pairs, the v2ridge falsification arm 6.0 -> 4.3 m).  The choice is the owner's (lane v2cyxy round 2 report)
# THE HARD SET MUST SETTLE (owner RULINGS 2026-09-09r (3)): a shipped patch
# never carries "HARD SET NOT SETTLED".  The polish iterates the multipliers
# until every hard row is within ``hard_tol_m`` or until these rounds are
# spent (then the report names the failure).  A round that buys less than one
# tolerance of violation NO LONGER ENDS THE LOOP — round 1 stopped there and
# shipped CYXY with a vertical-curve row 15x its bound.  Measured, the
# multiplier sequence is not monotone: it oscillates while the one-sided
# active set around it re-forms (0.050, 0.039, 0.058, 0.040, 0.019 m on the
# m3c road fixture), so the first flat round is nowhere near the answer, and
# the BEST iterate is the one returned.
polish_rounds_max = 2      # MEASURED (lane v2cyxy round 2, three HECA builds and five CYXY replays): beyond TWO rounds the polish buys no law and costs surface.  HECA at 2 rounds is BYTE-IDENTICAL to round 1 (body_sha 87b241d8319b), solve 43.4 s, 05C/23C bow -2.28 m; at 12 rounds the worst hard row moves 0.1488 -> 0.1270 m and the SAME bow goes to -2.76 m for +90 s of solve; at 12 rounds with hard_weight 1e7 it reaches 0.0276 m for +237 s and STILL does not settle.  The augmented-Lagrangian polish does NOT converge on a real airport at any weight measured — the multiplier sequence oscillates while the one-sided active set re-forms under it — so the loop's job here is to report the NAMED FAILURE, which is what 09r (3) asks of it when the cap is reached
# THE FINAL PROJECTION (owner RULINGS 2026-09-09y, closing 09v (3)).  The
# augmented Lagrangian above CANNOT CERTIFY the hard set: measured on real
# airports at every weight, the multiplier sequence oscillates while the
# one-sided active set re-forms under it, and at HECA on 09y its residual
# landed on RUNWAY rows (runway_transverse 1 at 0.50 m, runway_vertical_curve
# 4 at 0.24-0.33 m) — DEFECTs the app's gate refuses.  So after the design
# solve every NON-runway vertex is FIXED at its solved z and the runway
# family's vertices are re-solved as a small QP: least change from the design
# surface subject to every runway-family hard row as a TRUE constraint
# (``solve/project.py``).  The runway DEFECT families then read 0 BY
# CONSTRUCTION.  ``false`` is the DIAGNOSTIC ARM only — it measures what the
# solve alone leaves and is never shipped off.
runway_projection = true
hard_tol_m      = 0.02     # a hard row is HELD at this residual: under the census's own per-node rounding envelope (instrument.rounding_noise_m 0.03), so a held row can mint no defect row.  The multiplier rounds stop here
# THE ADJACENT GROUND FOLLOWS THE PAVEMENT AND NEVER PULLS IT (09-09b
# (2)/(3)): a row whose ruling head is listed here is priced ONE-WAY — the
# row's `follows` vertex (the GROUND) keeps its column, and the pavement
# feet leave the matrix for the right-hand side at their previous
# outer-round value.  Two-way, the corridor rows dragged the taxiway down
# to the ground they were meant to shape (the owner's undulation read).
one_way_rulings = [
  "zones.adjacent_ground",                                  # the zone-1 lip / zone-2 corridor bands
  "zones.adjacent_ground.runway.band_max_down strip tie",   # the strip tie (06b law 2 / 06p / 06q)
  "structures.building_pad frontage_level",                 # 09-10l: the pad FOLLOWS the pavement edge it fronts and never pulls it (the apron must not tier down into the terminal)
  "structures.building_pad frontage_level junior",
  "structures.structure_rim frontage_level",                # 09-10an: a structure RIM is flush with the pavement it sits in — the crest rises to the apron, it never pulls the apron down into the pit
]
one_way_max_rounds = 3     # the lag rounds, each one damped active-set solve (measured HECA: the leader move falls 0.29 m -> under the materiality by round 3; more rounds bought 0.00 m of surface and 12 s)
one_way_relax      = 0.5   # UNDER-RELAXATION of the lag: the plain fixed point does not contract (measured HECA: the worst leader move sat at 0.25-0.29 m over six rounds)
one_way_tol_m      = 0.01  # the lag has settled when no leader foot moved this far (the elevation materiality)
active_set_max_rounds = 200    # iterations before the solve reports the set it stopped on (measured: CYXY and HECA settle well inside this)
active_set_tol_m      = 0.001  # a row inside this of its bound is not counted as a set change (a tenth of the 0.01 m elevation materiality)
solver_tol            = 1e-8   # the linear solver's relative residual tolerance per round
solver_max_iter       = 20000  # per-round iteration cap of the linear solver
