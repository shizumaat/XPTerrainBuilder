frontage_step_max_m = 3.2
# THE BANK AT THE PATCH BOUNDARY (owner RULINGS 2026-09-09e; spec §9).
# Ortho4XP's mesh does NOT blend from the patch boundary to the DEM — it
# drapes the raw DEM right outside the constrained ring (§8.4: a 16.8 m
# cliff one triangle wide at HECA).  Outside every patch-boundary ring
# the patch therefore emits a BANK FOOT ring ON THE DEM at plan distance
# ``d = max(bank_min_width_m, |z_ring - DEM(foot)| / bank_slope)`` along
# the outward normal; the mesh triangulates the bank between them (no
# vertex is emitted in between).  ``bank_foot_smooth`` is the
# second-difference weight along the foot chain that keeps the toe from
# zigzagging (spec §9.4 deviation 1: it is applied to the plan distance,
# the foot's z being the DEM itself).
bank_slope       = 0.33   # 1:3 — an embankment / cut slope a pilot reads as ground, not a wall
bank_min_width_m = 5.0    # the narrowest bank: a ring level with its DEM still stands off the drape by this much
bank_foot_smooth = 30.0   # the toe's smoothing weight, against a unit weight on the formula's own distance
# THE LEVEL RINGS ARE DELETED (owner RULINGS 2026-09-09p (1) /
# 2026-09-09t; spec §13).  09f-1 answered the mesh's graph-harmonic
# squeeze by authoring the bank face with intermediate rings every
# ``bank_ring_spacing_m``.  09t measured a level ring re-emitting the
# FOOT's own edges wherever the bank is narrower than the level's offset
# — duplicate constrained segments, and the +30+031 tile unbuildable —
# and the squeeze surviving every spacing anyway.  ``bank_ring_spacing_m``
# and ``bank_first_ring_m`` are GONE with the construction they sized:
# the patch emits ONE foot ring per boundary and the MESH ENGINE gives the
# annulus's free vertices an altitude linear in plan distance between the
# two rings.
# THE DAYLIGHT LINE (owner RULINGS 2026-09-09g; spec §11).  The fixed
# point ``d = |z_ring - DEM(foot)| / bank_slope`` is the daylight point only
# where the ground is smooth; where it is not it erases the very earthworks
# the owner names.  The foot is instead the CIVIL-ENGINEERING DAYLIGHT
# (catch) POINT: walking outward along the ring's normal in
# ``bank_sample_m`` stations, the FIRST station where the 1:3 design slope
# line (down for fill, up for cut, from the ring's design z) meets the DEM
# within ``bank_daylight_tol_m``, never nearer than ``bank_min_width_m``,
# never farther than ``bank_max_width_m`` (a ray that never daylights takes
# the maximum and is reported by name).  Where the DEM inside the first
# ``bank_min_width_m`` already slopes at or steeper than ``bank_slope`` in
# the fill / cut direction the ground has its OWN bank and the foot is at
# the minimum.  The toe smoothing (09f) is CUT wherever the raw daylight
# distance jumps by more than ``bank_toe_break_m`` between neighbours: the
# toe may jump where the ground does.
# §37 (3) THE BANK IS EMITTED WHERE IT IS LOAD-BEARING (owner RULINGS
# 2026-09-13q KCLT item 8; Fable 2026-09-13).  Measured on the 1.0.324
# KCLT products: the foot ring is emitted at EVERY station of the banked
# region's boundary — 1,855 stations over 34.2 km — and 71.6 % of them
# carry |z_ring - DEM(foot)| under 1.65 m, i.e. no earthwork at all, while
# 451 chords run over 30 m and stand up to 5.6 m off the DEM mid-chord.
# So a station is emitted only where the transition is LOAD-BEARING:
# |z_ring - DEM(foot)| over ``bank_materiality_m``, which is DERIVED, not
# typed — ``bank_min_width_m * bank_slope`` (1.65 m) is exactly the drop a
# minimum-width bank carries, so below it the ring and the DEM meet inside
# the narrowest bank the law knows and the mesh's own interpolation
# carries the difference.  Each surviving RUN is emitted as its own chain
# (padded by one station each side so the bank fades out on the ground
# rather than ending mid-slope); inside a run no chord is longer than
# ``bank_chord_max_m``, and a chord whose mid-point stands more than
# ``bank_split_tol_m`` off the DEM is split further, never below
# ``bank_min_width_m``.
bank_chord_max_m    = 30.0
bank_split_tol_m    = 1.0
# THE OMIT ARM (owner request 2026-09-13): true emits NO bank_foot way at
# all.  A measurement arm for the owner's standing question about the
# bank_foot class (13ce / 13cm).  SHIPPED TRUE for app 1.0.330 by the
# owner's order (RULINGS 2026-09-13cy: "turn off bank foot emission for
# the next build so i can see output") — the owner's sim read of 1.0.330
# is the bank's adjudication.
bank_omit           = true
bank_sample_m       = 2.0
bank_daylight_tol_m = 0.3
bank_max_width_m    = 200.0
bank_toe_break_m    = 10.0
# THE MESH MUST HAVE VERTICES TO CARRY THE BLEND (owner RULINGS
# 2026-09-09x).  ``O4_Mesh_Utils.bank_annulus_blend_values`` writes an
# EXACT ruled altitude on every free vertex inside the annulus, but the
# mesh puts almost none there (40 tile-wide at HECA), so the bank is the
# ring-to-foot triangulation and a triangle joining a ring vertex to a
# foot vertex at a DIFFERENT bank width is skewed.  The annulus is
# therefore written as a Triangle REGION whose maximum triangle area is
# ``(w / bank_triangle_divisions) ** 2``, ``w`` the local bank width —
# i.e. the bank is divided into about this many triangles across.
bank_triangle_divisions = 3.0
# THE TERRAIN EDGE (owner RULINGS 2026-09-10b/10c; spec §19).  An
# adjacent-ground region (zone 1, zone 2, the end corridors) ENDS at the
# physical edge of the ground that carries it: outward from its pavement,
# where the natural DEM falls away below the region's surface faster than
# the bank can follow — the CREST — or, where a road runs along that
# crest, FLUSH at that road's outer edge (the road keeps its own profile).
# Beyond the edge there is no bank and no patch: the DEM's own slope IS
# the bank and the mesh drapes it.  ``edge_probe_m`` is the outward
# baseline the DEM's downhill slope is read over; a cell is CREST when
# that slope exceeds ``bank_slope`` AND the drop over the probe exceeds
# ``edge_min_drop_m`` (the DEM's own noise stays out).  ``edge_grid_m`` is
# the rasterisation the crest is found on (and so the accuracy of a
# crest-cut edge).  A road governs when its line runs within
# ``edge_road_snap_m`` inside the crest for at least ``edge_road_run_m``.
edge_probe_m     = 15.0
edge_min_drop_m  = 2.0
edge_grid_m      = 5.0
edge_road_snap_m = 20.0
edge_road_run_m  = 30.0
# THE ONE-SIDED PENALTIES are met by an ACTIVE-SET iteration: solve, take
# the rows the surface violates, re-solve with those rows active, repeat
# to a fixed point of the active set.
# THE RUNWAY FAMILY'S LAWS ARE HARD (owner 05s/06b within 08t, RULINGS
# 2026-09-08v): CONSTRAINTS of the active set, never targets — the surface
# holds them or the solve reports it, and the app's DEFECT gate reads exactly
# these.  The threshold pins are already equalities (the vertex is fixed).
# A row is hard when the head of its ``Source.ruling`` (everything before the
# first parenthesis) is listed here; a PREFERENCE row among them is hard at
# its CEILING, not at its preferred cap (the end-zone cap yields minimally,
# owner 2026-07-08, and the crown floor yields to a seam pin, M3a) — so the
# runway's MAX GRADE binds everywhere and the preference stays a preference.
# The generator's remaining rows (the crown floor, the ring chords and the
# crossing feet, which the census reads) stay one-sided targets: they price
# PAIRS the four laws above already govern, and hard they were measured
# mutually unsatisfiable (CYXY: 127/1432 ring chords missed by up to 0.77 m
# under the soft solve, spec §6 deviation 8).
hard_rulings = [
  "rulesets.runway.transverse_max",                      # 05o: flat laterally within the crown drop
  "rulesets.runway.vertical_curve_k_m / max_grade_change",  # 06b law 1: the vertical curve K
  "rulesets.runway.longitudinal",                        # the runway's max grade along the profile
  "rulesets.runway.end_zone",                            # the same, at its ceiling in the end zones
  "rulesets.common.pavement_max_grade ceiling",          # 09-09b (4): the 5 % pavement ceiling / 8 % free road
  "structures.building_pad pad_slope_max ceiling",       # 09-09c: a building pad is ONE PLANE tilting at most 1 %
  "road_cross_section",                                  # §37 (8) (owner 2026-09-13, RULINGS 13bb): the 2 % cross-section is LAW on every road-family face, groundside included — "a hillside road keeps its crossfall on a BENCH, not by tilting".  It was a target at 300 and it LOST: KCLT verify 781 violated pairs on the control, 462 with the ramp.  Compatible with the ramp ceiling by construction since §37 (8): the ramp target is one value per (route, station) and cap-Lipschitz along the route, so it can never tilt a section
  "structures.building_pad airside skirt",              # §16g (10) (8) (owner RULINGS 2026-09-14aj): along an airside-sharing edge the pad's rim vertices are one-way FOLLOWERS of the airside and the plate meets them within `pad_slope_max` — a BENT SKIRT.  Hard, because it is the pad's own ceiling reaching a pinned edge; one-way, because AIRSIDE IS KING (the two-sided form moved 17,482 airside vertices, worst 12.15 m)
  "zones.apron cluster_collar_plane ceiling",             # §30 (4) (owner RULINGS 2026-09-14bk): the apron COLLAR within `cluster_apron_reach_m` of a terminal cluster is one plane, and its tilt ceiling is the pad's own 1 % — APRON LAW, in NO conforming register, so §20b stage 1 owns it and the collar is flat before the pad is priced
  "roads.groundside_road ramp ceiling",                  # §37 (6) (owner 13j item 5): a groundside road stands at most [cockpit] visual_m above its ramp target from the airside contact to the DEM — the objective held KCLT's east access road +9.71 m above its own target with NO row binding (13aj), and a weight contest is not a law
]
hard_weight     = 300000.0 # the CONSTRAINT weight a hard row is priced at (1000x the law's target weight), with a multiplier shift between rounds: the augmented Lagrangian that makes the runway laws HELD rather than traded (measured CYXY: 3e4 leaves 0.036 m, 3e5 0.010 m, 1e6 0.012 m, 1e8 breaks the factorisation).  RE-MEASURED for RULINGS 2026-09-09r (3) with the settling polish: WITHOUT a runway x runway crossing release CYXY settles at 3e5 (0.0159 m in 9 rounds, DEFECTs zero); WITH it the multiplier sequence OSCILLATES and never settles (best 0.026 m of 12 rounds, one runway_transverse DEFECT), because the primary's chord over the crossing is a target 02/20's own pins and cap forbid.  1e6 clears the DEFECTs but still does not settle (13.9 s solve); 1e7 settles in ZERO polish rounds (5.8 s) but MOVES THE WIDER SURFACE — five further twins red (the m3c lawful road leaves its core profile, 37 route-budget rows at the taxi-route pairs, the v2ridge falsification arm 6.0 -> 4.3 m).  The choice is the owner's (lane v2cyxy round 2 report)
# WHAT THE HARD SET IS, AND WHAT COUNTS AS A VIOLATION (lane `v2settle`,
# spec §20a; the campaign's first-ranked standing debt, RULINGS 13y (B) /
# 13ab / 14as).  Neither of these is a knob — both are the definitions the
# counters below are read against, recorded here because the numbers are:
#
#  * A HARD ROW MUST CARRY A COLUMN.  `design.assemble` tested `dem_fixed`
#    where it meant "fixed", so a row footed on a `Pin` — a road-profile
#    pin, a threshold — entered the hard set carrying NOTHING THE SOLVE CAN
#    MOVE.  MEASURED at HECA (§20b stage 1, capture off main b1b7704c):
#    142 of 161,780 stage-1 hard rows carried no column, 9 of them violated,
#    including the WORST ROW OF THE WHOLE AIRSIDE SET (0.1794 m, a
#    `roads.groundside_road ramp ceiling` on a pinned service-road vertex at
#    30.13717041421,31.4124359031).  It cost more than the report: phase C
#    keeps `best_worst` pinned at a constant it can never beat, so the
