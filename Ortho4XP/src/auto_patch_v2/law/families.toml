# auto_patch_v2 LAW — the law FAMILIES (Appendix A §1; v1 register
# `check_grade.LAW_FAMILIES`).  One entry per family the census reports.
#   measures   what the family measures, one line
#   parameter  the law key it reads, as a dotted path into the loaded Law
#              (rulesets.<ruleset>.… is written `ruleset.…`); the loader
#              REFUSES a path that does not resolve — a family can never
#              point at a cap that is not in the tables
#   roles      the roles (or role families) the family applies to;
#              "airside" / "groundside" / "all" name the census partition
#   pairs      "within" (one ring), "cross" (two shapes), "steps"
#   ruling     the RULINGS.md id that made it law
#   solver     how v2 satisfies it: "edge" (difference constraint on planar
#              edges), "pin", "flat", "band", "offset", "construction"
#              (true by how the planar map is built), "diagnostic" (an
#              instrument row v2 emits nothing for)
#   cockpit    THE COCKPIT FRAME's class for this family (owner RULINGS
#              2026-09-12x/12y; design-surface-spec §31 (6)).  It says WHAT
#              KIND OF THING a row of this family is, and therefore which
#              of §31's two thresholds reads it — it never changes what the
#              family measures or how many rows it has:
#                "step"        a HEIGHT DISCONTINUITY between neighbours (a
#                              step, joint, tear, stacked node, a vertex
#                              standing off its neighbour's foot).  Priced
#                              at [cockpit] motion_step_m where BOTH sides
#                              are rolled-on roles — the aircraft feels it
#                              — and at visual_m off them.
#                "grade_break" a RATE-OF-CHANGE law (the arc / curve rates):
#                              §31 (1)'s "a grade break the runway/taxi laws
#                              forbid".  A row on rolled-on roles is
#                              CRITICAL motion by its own law's bound; there
#                              is no second threshold to apply.
#                "grade"       a SLOPE excess.  Not one of §31 (1)'s visual
#                              shapes (cut, rise, seam, float, burial,
#                              terrace) and not a step: REPORT.
#                "keepout"     the family measures a thing's PRESENCE in a
#                              region, not a height at all: REPORT.
#              A new family with no cockpit key does not load — the class
#              is a decision, never a default.

[within_shape]
measures  = "ring vertex-pair grade vs the role's cap (apron: nearest-spine chord only)"
parameter = "roles.*.longitudinal"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-08-21b/c/d; 2026-08-24"
solver    = "edge"
cockpit   = "grade"

[road_cross_section]
measures  = "across-axis pairs on road rings vs the road transverse cap (axis split at common.road_transverse_axis_min_deg)"
parameter = "common.roles.service_road.transverse"
roles     = ["service_road", "service_junction"]
pairs     = "within"
ruling    = "2026-08-25g"
solver    = "edge"
cockpit   = "grade"

[taxi_box]
measures  = "THE SHORT-PAIR BOX: a taxi-family pair of one ring (outer or hole; a junction's mesh edges and common-stretch pairs) under emit.within_shape.withdrawn_chord_min_m vs cL*|ds| + cT*|dt| against the nearest stretch axis (generator law, taxi tier)"
parameter = "emit.within_shape.withdrawn_chord_min_m"
roles     = ["taxi_family"]
pairs     = "within"
ruling    = "2026-09-06q (1); 2026-09-06s"
solver    = "edge"
cockpit   = "grade"

[plane_gradient]
measures  = "triangle-plane slope of the junction mesh vs the role cap"
parameter = "roles.*.longitudinal"
roles     = ["junction"]
pairs     = "within"
ruling    = "user 2026-07-05"
solver    = "edge"
cockpit   = "grade"

[runway_end_skirt]
measures  = "end-skirt down-grade and its rate beyond the runway end"
parameter = "ruleset.end_skirt.max_down_grade"
roles     = ["runway_clearance"]
pairs     = "within"
ruling    = "reg-set 2026-08-08"
solver    = "edge"
cockpit   = "grade"

[terrace_joint_route]
measures  = "a declared apron terrace joint crossing a taxi route"
parameter = "structures.retaining_wall.allowed_outside_carves"
roles     = ["apron"]
pairs     = "within"
ruling    = "2026-08-06"
solver    = "construction"
cockpit   = "step"

[terrace_joint_strip]
measures  = "a declared apron terrace joint inside a runway strip"
parameter = "structures.retaining_wall.in_runway_strip"
roles     = ["apron"]
