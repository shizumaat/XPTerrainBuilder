# THE END-AROUND TAXIWAY CEILING (owner RULINGS 2026-09-13j item 2, ruled
# 13q item 2; spec §36).  The rect the solve PINNED at
# `end_z + max(0, D - setback) * slope - tail_height`, read back off the
# emitted surface: the pin is eliminated from the unknowns, so a row here
# means the emitted surface left the value the law stamped.  COCKPIT:
# `keepout` — the family measures a PRESENCE (pavement penetrating the
# departure surface a tail height above it), not a step between neighbours
# and not a slope; §31 reads it as REPORT, and the crossing's own steps and
# grades are still read by their own families.
[eat_ceiling]
measures  = "end-around-taxiway pavement standing above its departure-surface ceiling (the pinned rect, sidecar `eat_rects`)"
parameter = "ruleset.eat.slope"
roles     = ["taxi_family", "apron"]
pairs     = "within"
ruling    = "2026-09-13j item 2 / 13q item 2"
solver    = "pin"
cockpit   = "keepout"

[adjacent_ground_tear]
measures  = "graded-strip vertex outside the zone corridor (wall straddle exempt)"
parameter = "zones.adjacent_ground.lip_width_m"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-08-01"
solver    = "band"
cockpit   = "step"

[adjacent_ground_step]
measures  = "a WELDED step INSIDE one adjacent_ground face (spec §34 (4)): consecutive ring neighbours of the SAME v2 adjacent-ground way whose altitudes differ by more than the cockpit's visual threshold. graded_strip carries no within-shape cap, adjacent_ground_tear fires only under a 1 m edge and strip_seam_tear is the CROSS-shape twin, so a band holding its designed level over a mapped road's own ground (LEMD zone2#2, 1.73 m over 1.5 m at road -6289) was priced by nothing"
parameter = "emit.cockpit.visual_m"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-09-13i item 8 (spec §34 (4))"
solver    = "construction"
cockpit   = "step"

[strip_seam_tear]
measures  = "an adjacent-ground strip seam tear (wall straddle exempt)"
parameter = "zones.adjacent_ground.lip_width_m"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-08-01"
solver    = "construction"
cockpit   = "step"

[strip_transverse]
measures  = "THE RUNWAY-EDGE TIE: any vertex (any role but the runway family and wall crests) abeam a runway edge inside the zone-2 half width standing above OR below the edge foot by more than the strip transverse bound (two-way, 06q (2)) — read geometrically over every vertex, never from a published pair list"
parameter = "zones.adjacent_ground.runway.band_max_down"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-09-06b law 2; 2026-09-06p (1)/(3); 2026-09-06q (2)"
solver    = "edge"
cockpit   = "step"

[transverse]
