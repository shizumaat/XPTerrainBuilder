[raoa]
measures  = "radio-altimeter operating area grade-change rate (ICAO only)"
parameter = "ruleset.raoa.max_grade_change"
roles     = ["runway_family"]
pairs     = "within"
ruling    = "reg-set 2026-08-08"
solver    = "edge"
cockpit   = "grade_break"

[drainage_minimum]
measures  = "a surface flatter than its drainage minimum (runways: crown only)"
parameter = "ruleset.drainage.apron_min_grade"
roles     = ["runway"]
pairs     = "within"
ruling    = "2026-08-13b/14"
