# auto_patch_v2 LAW — the law FAMILIES (Appendix A §1; v1 register
# `check_grade.LAW_FAMILIES`).  One entry per family the census reports.
#   measures   what the family measures, one line
#   parameter  the law key it reads, as a dotted path into the loaded Law
#              (rulesets.<ruleset>.… is written `ruleset.…`); the loader
#              REFUSES a path that does not resolve — a family can never
#              point at a cap that is not in the tables
#   roles      the roles (or role families) the family applies to;
#              "airside" / "groundside" / "all" name the census partition
#   pairs      "within" (one ring), "cross" (two shapes), "steps"
#   ruling     the RULINGS.md id that made it law
#   solver     how v2 satisfies it: "edge" (difference constraint on planar
#              edges), "pin", "flat", "band", "offset", "construction"
#              (true by how the planar map is built), "diagnostic" (an
#              instrument row v2 emits nothing for)
#   cockpit    THE COCKPIT FRAME's class for this family (owner RULINGS
#              2026-09-12x/12y; design-surface-spec §31 (6)).  It says WHAT
#              KIND OF THING a row of this family is, and therefore which
#              of §31's two thresholds reads it — it never changes what the
#              family measures or how many rows it has:
#                "step"        a HEIGHT DISCONTINUITY between neighbours (a
#                              step, joint, tear, stacked node, a vertex
#                              standing off its neighbour's foot).  Priced
#                              at [cockpit] motion_step_m where BOTH sides
#                              are rolled-on roles — the aircraft feels it
#                              — and at visual_m off them.
#                "grade_break" a RATE-OF-CHANGE law (the arc / curve rates):
#                              §31 (1)'s "a grade break the runway/taxi laws
#                              forbid".  A row on rolled-on roles is
#                              CRITICAL motion by its own law's bound; there
#                              is no second threshold to apply.
#                "grade"       a SLOPE excess.  Not one of §31 (1)'s visual
#                              shapes (cut, rise, seam, float, burial,
#                              terrace) and not a step: REPORT.
#                "keepout"     the family measures a thing's PRESENCE in a
#                              region, not a height at all: REPORT.
#              A new family with no cockpit key does not load — the class
#              is a decision, never a default.

[within_shape]
measures  = "ring vertex-pair grade vs the role's cap (apron: nearest-spine chord only)"
parameter = "roles.*.longitudinal"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-08-21b/c/d; 2026-08-24"
solver    = "edge"
cockpit   = "grade"

[road_cross_section]
measures  = "across-axis pairs on road rings vs the road transverse cap (axis split at common.road_transverse_axis_min_deg)"
parameter = "common.roles.service_road.transverse"
roles     = ["service_road", "service_junction"]
pairs     = "within"
ruling    = "2026-08-25g"
solver    = "edge"
cockpit   = "grade"

[taxi_box]
measures  = "THE SHORT-PAIR BOX: a taxi-family pair of one ring (outer or hole; a junction's mesh edges and common-stretch pairs) under emit.within_shape.withdrawn_chord_min_m vs cL*|ds| + cT*|dt| against the nearest stretch axis (generator law, taxi tier)"
parameter = "emit.within_shape.withdrawn_chord_min_m"
roles     = ["taxi_family"]
pairs     = "within"
ruling    = "2026-09-06q (1); 2026-09-06s"
solver    = "edge"
cockpit   = "grade"

[plane_gradient]
measures  = "triangle-plane slope of the junction mesh vs the role cap"
parameter = "roles.*.longitudinal"
roles     = ["junction"]
pairs     = "within"
ruling    = "user 2026-07-05"
solver    = "edge"
cockpit   = "grade"

[runway_end_skirt]
measures  = "end-skirt down-grade and its rate beyond the runway end"
parameter = "ruleset.end_skirt.max_down_grade"
roles     = ["runway_clearance"]
pairs     = "within"
ruling    = "reg-set 2026-08-08"
solver    = "edge"
cockpit   = "grade"

[terrace_joint_route]
measures  = "a declared apron terrace joint crossing a taxi route"
parameter = "structures.retaining_wall.allowed_outside_carves"
roles     = ["apron"]
pairs     = "within"
ruling    = "2026-08-06"
solver    = "construction"
cockpit   = "step"

[terrace_joint_strip]
measures  = "a declared apron terrace joint inside a runway strip"
parameter = "structures.retaining_wall.in_runway_strip"
roles     = ["apron"]
pairs     = "within"
ruling    = "2026-08-06"
solver    = "construction"
cockpit   = "step"

[terrace_actual_step]
measures  = "an apron terrace's actual step past its declared step"
parameter = "emit.materiality.step_m"
roles     = ["apron"]
pairs     = "within"
ruling    = "2026-08-06"
solver    = "construction"
cockpit   = "step"

# §16g (10) (3) THE PAD IS THE CLUSTER (owner RULINGS 2026-09-14x,
# verbatim: "pads must match building clusters, no building, or cluster
# can span multiple pads, if it does, it means we didn't identify the
# building shape or cluster correctly.  They should match exactly.").
# CRITICAL and sidecar-declared: the census cannot recompute a cluster
# from the patch (the footprint outlines live in the rebake plan), so the
# build declares the DEFECT SET over its whole cluster population and
# this prices exactly it.  A patch with no key reports nothing.
[pad_cluster_mismatch]
measures  = "a `building` pad more than half claimed by two clusters, or a cluster that is more than half of two pads"
parameter = "structures.placement.pad_from_cluster"
roles     = ["object_pad"]
pairs     = "within"
ruling    = "2026-09-14x"
solver    = "construction"
cockpit   = "keepout"

# §16g (10) (6) THE PAD WELDS TO THE AIRSIDE (owner RULINGS 2026-09-14ai,
# verbatim: "be sure all pads sharing an edge with airside must weld
# smoothly to the airside").  CRITICAL.  Computed FROM THE PATCH by node
# identity — the step across a welded edge is 0 by construction (09-01g,
# contact = value), so what is priced is the pad being pulled OUT OF
# PLANE at the vertices it shares with airside: the airside is the datum
# and never yields.
[pad_airside_weld]
measures  = "a pad vertex SHARED with an airside face standing further from another vertex of its own pad than the pad's slope ceiling allows — the SKIRT could not reach"
parameter = "emit.within_shape.pad_slope_max"
roles     = ["object_pad"]
pairs     = "within"
ruling    = "2026-09-14ai"
solver    = "edge"
cockpit   = "step"

# THE OPEN CHANNEL (spec §45; owner RULINGS 2026-09-15i).  Two families,
# both stated against the channel's OWN published record
# (`channel_facilities`) and not against a second arithmetic: the floor
# against the profile the generator pinned it at, and the crest against
# the governed cell it edges — `crest = "design"`, never DEM(x, y).
[channel_floor_at_declaration]
measures  = "a channel floor vertex off the record's own declared profile"
parameter = "structures.channel.station_m"
roles     = ["tunnel_trench"]
pairs     = "within"
ruling    = "2026-09-15i"
solver    = "pin"
cockpit   = "step"

[channel_crest_at_edge]
measures  = "a channel crest off the governed cell's emitted level at the corridor edge"
parameter = "structures.channel.bank_slope"
roles     = ["retaining_wall"]
pairs     = "within"
ruling    = "2026-09-15i"
solver    = "offset"
cockpit   = "step"

[basin_floor_declaration]
measures  = "a basin facility floor disagreeing with its own body depth"
parameter = "structures.basin.floor"
roles     = ["object_pad"]
pairs     = "within"
ruling    = "2026-08-26"
solver    = "pin"
cockpit   = "step"

# THE END-AROUND TAXIWAY CEILING (owner RULINGS 2026-09-13j item 2, ruled
# 13q item 2; spec §36).  The rect the solve PINNED at
# `end_z + max(0, D - setback) * slope - tail_height`, read back off the
# emitted surface: the pin is eliminated from the unknowns, so a row here
# means the emitted surface left the value the law stamped.  COCKPIT:
# `keepout` — the family measures a PRESENCE (pavement penetrating the
# departure surface a tail height above it), not a step between neighbours
# and not a slope; §31 reads it as REPORT, and the crossing's own steps and
# grades are still read by their own families.
[eat_ceiling]
measures  = "end-around-taxiway pavement standing above its departure-surface ceiling (the pinned rect, sidecar `eat_rects`)"
parameter = "ruleset.eat.slope"
roles     = ["taxi_family", "apron"]
pairs     = "within"
ruling    = "2026-09-13j item 2 / 13q item 2"
solver    = "pin"
cockpit   = "keepout"

[sea_wall]
measures  = "an emitted ring EDGE standing ON the shore the patch declares (sidecar `shore_edges`, the same witness the §39 (1) weld ran against and the same product the mesh constrains): the DROP to the water (`de_m`), the quay LEVEL (`elev_a`) and the wall's LENGTH (`distance_m`). A vertical drop from the quay to the water is the LAW here (owner 2026-09-15f: 'the pavement should drop straight to the water with no slope'), so every row is stamped `sea_wall_is_the_law` — named, never adjudicated — and the same reading takes the matching `strip_seam_tear` / `adjacent_ground_step` rows out of the acceptance count (`sea_wall`: the tear IS the wall)"
parameter = "emit.identity.min_distinct_spacing_m"
roles     = []
pairs     = "within"
ruling    = "2026-09-15f"
solver    = "diagnostic"
cockpit   = "step"
# The wall itself is the MESH's: `O4_Vector_Map`'s Round 7 / R17-3 seawall
# breaklines offset every graded-coverage ring segment bordering water
# outward by `SEAWALL_OFFSET_M` at `SEAWALL_SEA_LEVEL_M`, which is exactly
# §37 (11) (2)'s breakline pair (the quay edge at Z, the coincident shore
# vertex at the water level).  The patch's job is to END at the coastline
# — §37 (11) (1)'s trim, taken at `planar/zones.zone_regions` — and this
# family is how the census SEES that it did.

[road_coverage_join]
measures  = "a road vertex where the patch's road meets the CORE's levelled ribbon standing off the ribbon's own altitude there (published per pinned vertex in the sidecar `road_coverage_join`)"
parameter = "emit.road_profile.station_m"
roles     = ["service_road", "service_junction"]
pairs     = "within"
ruling    = "2026-09-13be"
solver    = "pin"
cockpit   = "step"
# The core's `include_roads` levelling is REMOVED inside the patch coverage
# + 6 m (`O4_Vector_Map.py:1749-1757`): inside, the patch is the sole road
# authority; outside, the core's clamped ribbon is.  Nothing made the two
# agree until §37 (9) — measured at KCLT way 10826 station 0, the patch's
# kerb 2.36 m over the ribbon across 7.9 m.  THE COCKPIT CLASS is "step":
# a height discontinuity across a join the driver crosses, VISUAL off the
# rolled-on roles by the one cockpit rule.

[seam_residual]
measures  = "a tile-seam band-edge vertex standing off its own tile's baked DEM sample (the value the solve PINNED, published per pin in the sidecar `seam_pins`)"
parameter = "emit.seam.half_width_m"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-09-13ah; 2026-09-13am"
solver    = "pin"
# THE COCKPIT CLASS is "step" — a HEIGHT DISCONTINUITY between the patch
# and the DEM the neighbouring tile's mesh drapes in the band.  That gives
# the spec's own reading for free: CRITICAL MOTION on the rolled-on roles
# (the runway and taxi families, aprons and stands) and VISUAL elsewhere,
# from the ONE cockpit rule, with no second threshold written here.  The
# SPLP class it names: pavement -> down 0.6 m -> 10 m of DEM -> up 0.6 m
# -> pavement, a ~12 % dip and rise across the runway width.
cockpit   = "step"

# §34 (10) THE ROAD MARGIN IS GENERAL (owner RULINGS 2026-09-14bb /
# 14bc / 14bd): every ramp arriving at a road — a pinched corridor climb
# (§34 (9)), a §34 (8) mouth climb-out, a basin ramp, a structure
# approach, a tunnel-object ramp — ends at the road's TRUE edge (the
# centreline offset by the road's half width toward the ramp), never at
# the emitted half-carriageway face's edge, which IS the centreline where
# a road is emitted as two ribbons sharing their long edge.  One
# derivation, `planar/wall_corridor_ramps.road_true_edge`; no per-airport
# key.  Measured 0 at OTHH before and after: the family is the GUARD on
# that derivation, not a defect count.
[ramp_in_road]
measures  = "a RAMP face's vertex standing inside a road ribbon — the road the ramp arrived at, cut by a lane"
# The road's TRUE edge is read from the road's OWN emitted geometry (the
# half-carriageway ribbon's width), so §34 (10) mints no key of its own —
# this names the law the road's width falls back to when the way carries
# no `width` tag, which is the only number in the tables the family's
# region depends on.
parameter = "structures.tunnel.lane_width_m"
roles     = ["tunnel_ramp", "door_ramp", "wall_corridor_ramp", "garage_ramp"]
pairs     = "within"
ruling    = "2026-09-14bb; 2026-09-14bc; 2026-09-14bd"
solver    = "construction"
# "keepout": PRESENCE in a region, not a height — one ramp vertex inside
# the ribbon is the whole defect whatever its elevation.
cockpit   = "keepout"

# §33 (6) THE PACK'S STRUCTURE OBJECTS ARE THE CUT GEOMETRY (owner
# RULINGS 2026-09-15e items 1/3/4/6 and 2026-09-15g; Fable 2026-09-15j).
# Sidecar-declared: `object_cuts` carries, per signature-B corridor, the
# OBJECT'S OWN wall line as a lat/lon ring and the AUTHORED floor its
# floor plate states — so the law and the instrument read ONE reading of
# the pack, never two (the `shore_edges` / `hairline_pair` pattern).
[object_cut_offset]
measures  = "a vertex of an OBJECT CUT's own emitted geometry (its ramp faces and its rim) standing outside the pack object's WALL LINE — the trench leaving the walls the author drew"
parameter = "structures.tunnel.object.wall_face_max_thickness_m"
roles     = ["tunnel_ramp", "retaining_wall"]
pairs     = "within"
ruling    = "2026-09-15e; 2026-09-15g; 2026-09-15j"
solver    = "construction"
# "keepout": PRESENCE outside a region, not a height — one vertex outside
# the object's wall line is the whole defect whatever its elevation.
cockpit   = "keepout"

[object_cut_depth]
measures  = "an OBJECT CUT's emitted floor (its ramp faces' lowest vertex) standing off the AUTHORED floor the object states — the depth is the floor plate's, and it overrides bore_datum_m"
parameter = "structures.tunnel.object.shell_floor_min_m"
roles     = ["tunnel_ramp"]
pairs     = "within"
ruling    = "2026-09-15e; 2026-09-15g; 2026-09-15j"
solver    = "construction"
cockpit   = "step"

# §34 (5) (b) THE COVERED EXTENT OF AN UNDERPASS INCLUDES THE TAXIWAY'S
# STRIP (Fable 2026-09-15; RULINGS 2026-09-15h; owner 15e item 7).  The
# airside sibling of `ramp_in_road`: an underpass beneath a taxiway or
# runway is covered over the pavement AND its graded strip, so the mouth
# opens beyond the strip and the ramp descends outside it.  A ramp vertex
# INSIDE the strip is a trench in the ground an aircraft leaving the
# pavement runs out onto — LEMD 40.4611623,-3.5444804, where a code-E
# strip is 19.0 m and the trench face stood at 15.5 m under a 5.42 m
# unbanked drop (the airport's worst CRITICAL VISUAL row).  The strip
# region is ONE derivation with `planar/zones.zone_regions` and
# `planar/structure_underpass.strip_half_width_m`: the pavement's own
# solid grown by its class's zone-2 half width.
[ramp_in_strip]
measures  = "a RAMP face's vertex standing inside the graded STRIP of the runway or taxiway the structure passes under"
parameter = "zones.adjacent_ground.taxi.half_width_m"
roles     = ["tunnel_ramp", "door_ramp", "wall_corridor_ramp", "garage_ramp"]
pairs     = "within"
ruling    = "2026-09-15h"
solver    = "construction"
# "keepout": PRESENCE in a region, not a height — one ramp vertex inside
# the strip is the whole defect whatever its elevation.
cockpit   = "keepout"

[bank_across_seam]
measures  = "a `bank_foot` node inside a tile-seam band — the bank is never derived at a seam (the coverage edge there is a pin line already at the DEM)"
parameter = "emit.seam.half_width_m"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-09-13ah; 2026-09-13an"
solver    = "construction"
# "keepout": the family measures a thing's PRESENCE in a region, not a
# height — one node inside the band IS the defect, whatever its elevation
# (13an: a chain 0.0237 m off the meridian, split 16,298 times by
# Triangle4XP against the unsplittable tile border).
cockpit   = "keepout"

[hairline_pair]
measures  = "an EMITTED constrained edge laid within emit.identity.min_distinct_spacing_m of, and within 5 deg of parallel to, a FOREIGN constrained edge (an OSM water edge published as `shore_edges`, or another way's ring) without sharing its vertices"
parameter = "emit.identity.min_distinct_spacing_m"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-09-13an; 2026-09-13bk"
solver    = "construction"
# "unmeshable": the row is not a height at all — Triangle4XP must recover
# BOTH segments and fills the hairline wedge between them with a Steiner
# cascade.  LEMD: twenty-five pairs 0.06-0.26 mm apart made 2,301,676
# triangles under 0.1 m2 (73 % of the tile) and X-Plane would not load the
# tile; SPLP: one 5.32 m segment split 16,298 times.  CRITICAL wherever it
# is, whatever its elevation.
cockpit   = "unmeshable"

[adjacent_ground_tear]
measures  = "graded-strip vertex outside the zone corridor (wall straddle exempt)"
parameter = "zones.adjacent_ground.lip_width_m"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-08-01"
solver    = "band"
cockpit   = "step"

[adjacent_ground_step]
measures  = "a WELDED step INSIDE one adjacent_ground face (spec §34 (4)): consecutive ring neighbours of the SAME v2 adjacent-ground way whose altitudes differ by more than the cockpit's visual threshold. graded_strip carries no within-shape cap, adjacent_ground_tear fires only under a 1 m edge and strip_seam_tear is the CROSS-shape twin, so a band holding its designed level over a mapped road's own ground (LEMD zone2#2, 1.73 m over 1.5 m at road -6289) was priced by nothing"
parameter = "emit.cockpit.visual_m"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-09-13i item 8 (spec §34 (4))"
solver    = "construction"
cockpit   = "step"

[zone_on_pavement]
measures  = "square metres of an adjacent_ground:* zone strip standing on the SOLID of an aircraft-pavement face (spec §41 (2)): two authorities own one patch of ground, which breaks no pair law and so was priced by nothing. The frame is the pavement face's SOLID and not its ring — a taxiway loop's ring encloses lawful adjacent ground (HECA pav73: a 202,427 m2 ring around a 162,110 m2 hole; ring-blind the same patch reads 74 strips / 586,619 m2, in the solid frame 0.0 m2). The row's metric de_m is an AREA in m2, not a height"
parameter = "emit.terrace.shape_roles"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-09-13co item 2 (spec §41 (2))"
solver    = "construction"
# "keepout": the family measures PRESENCE in a region, not a height — a
# strip over pavement IS the defect at whatever elevation it holds.
cockpit   = "keepout"

[strip_seam_tear]
measures  = "an adjacent-ground strip seam tear (wall straddle exempt)"
parameter = "zones.adjacent_ground.lip_width_m"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "2026-08-01"
solver    = "construction"
cockpit   = "step"

[strip_transverse]
measures  = "THE RUNWAY-EDGE TIE: any vertex (any role but the runway family and wall crests) abeam a runway edge inside the zone-2 half width standing above OR below the edge foot by more than the strip transverse bound (two-way, 06q (2)) — read geometrically over every vertex, never from a published pair list"
parameter = "zones.adjacent_ground.runway.band_max_down"
roles     = ["all"]
pairs     = "within"
ruling    = "2026-09-06b law 2; 2026-09-06p (1)/(3); 2026-09-06q (2)"
solver    = "edge"
cockpit   = "step"

[transverse]
measures  = "cross-corridor grade vs the taxi transverse cap"
parameter = "ruleset.taxi.transverse"
roles     = ["taxi_family"]
pairs     = "within"
ruling    = "ICAO Annex 14 §3.9.11 (STANDARDS)"
solver    = "edge"
cockpit   = "grade"

[drainage_spine]
measures  = "an enclosed-pocket drainage spine at or above its lower pavement"
parameter = "zones.pockets.drainage_spine"
roles     = ["apron"]
pairs     = "within"
ruling    = "2026-08-01 clarification"
solver    = "band"
cockpit   = "step"

[apron_lattice_membrane]
measures  = "an apron interior lattice pair over the apron's own budget"
parameter = "emit.chords.apron_interior_spacing_m"
roles     = ["apron"]
pairs     = "within"
ruling    = "2026-08-24b/c; 2026-08-26"
solver    = "edge"
cockpit   = "grade"

[airside_no_step]
measures  = "direct-distance grade within the window plus rate of change, all airside pavement"
parameter = "emit.no_step.window_m"
roles     = ["airside"]
pairs     = "within"
ruling    = "2026-08-27"
solver    = "edge"
cockpit   = "step"

[lateral_contiguity]
measures  = "a road cross-section vs the strictest touching pavement class"
parameter = "roles.*.longitudinal"
roles     = ["service_road", "apron"]
pairs     = "within"
ruling    = "2026-08-25b"
solver    = "edge"
cockpit   = "grade"

[strip_longitudinal]
measures  = "graded-strip abeam slope vs the strip cap"
parameter = "ruleset.strip.longitudinal"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "reg-set 2026-08-08"
solver    = "edge"
cockpit   = "grade"

[strip_arc]
measures  = "graded-strip longitudinal grade-change rate"
parameter = "ruleset.strip.arc_rate"
roles     = ["graded_strip"]
pairs     = "within"
ruling    = "reg-set 2026-08-08"
solver    = "edge"
cockpit   = "grade_break"

[resa_transverse]
measures  = "end-corridor transverse grade"
parameter = "ruleset.resa.transverse_max"
roles     = ["runway_clearance"]
