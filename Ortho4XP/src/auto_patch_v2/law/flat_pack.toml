# §1).  A pack whose ground objects nearly all stand at ONE level over
# terrain with real relief was authored for a flat airport.  PHASE 1 only
# REPORTS the verdict (sidecar/report `load.flat_pack`, one log line); no
# geometry reads it while `terrace = false`.  The level window and the
# relief floor are flat_site.toml's (detector.seat_spread_max_m,
