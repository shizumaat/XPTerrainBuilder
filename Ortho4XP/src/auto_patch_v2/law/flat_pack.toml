[detector]
level_share_min = 0.9   # RULINGS 2026-10-20x (answer 60): "Greater than 90% of objects would all be at the same level for a true flattened airport package" — the share of the pack's grounded objects whose seat lies in ONE seat_spread_max_m window; the witness needs MORE than this
grounded_band_m = 1.0   # a foot within this of the member's own ground read (base_profile feet_y) is a GROUNDED foot (the S4 below-grade magnitude, flat_site.detector.below_grade_base_y_m)
min_members     = 3     # fewer grounded objects than this is `no_data`: one or two objects cannot state an airport-wide level
