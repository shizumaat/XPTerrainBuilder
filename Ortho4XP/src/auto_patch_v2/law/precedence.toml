# auto_patch_v2 LAW — roles and authority precedence (Appendix A §2;
# RULINGS 2026-08-03 "emitters emit, never grade"; memory
# emit-consensus-mints-violations).  Where two faces meet, the face whose
# role comes FIRST in `order` owns the shared value; roles not in `order`
# rank after every named one (the terrain tail).  This is a TOTAL order.
#
# PRINCIPLE (RULINGS 2026-09-03i): SENIORITY FOLLOWS FROM BEING GOVERNED.
# Anything without a grade cap in rulesets.toml yields to everything that
# has one — pads yield to aprons by OMISSION (no pad grade law), not by a
# pad rule.  `order` lists the governed roles in their stated seniority;
# `building` appears after `apron` only to fix its place among the
# ungoverned; M2's loader derives the ungoverned tier from "no cap" so a
# new surface class without a cap is junior without a code change.

[authority]
order = [
  "runway", "runway_crossing",                                          # runway family
  "primary_parallel", "secondary_parallel", "stub", "cross_connector",
  "junction", "tunnel_ramp",                                            # taxi family
  "apron", "building",                                                  # apron, then landside occupants
  "service_road", "service_junction", "groundside_pavement",
]

# Every role v2 emits.  `family` selects the cap table (runway / taxi /
# common / none); `side` is the census partition EXACTLY as the v1 oracle
# partitions it (`check_grade._GROUNDSIDE_ROLES`: four roles are
# groundside, every other role is airside — airside is king: a MIXED row
# counts against airside); `value` = carries its own graded elevation (a
# non-value role traces a lawful bound, no within-shape cap); `rigid` = the
# face is ONE flat value (a pad), set by what it touches, never a pin the
# neighbours climb to (09-03h) and never a no-step pair endpoint of its own.
[roles]
runway              = { family = "runway", side = "airside",    value = true,  aeroway = "runway" }
runway_crossing     = { family = "runway", side = "airside",    value = true,  aeroway = "runway" }
primary_parallel    = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
secondary_parallel  = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
stub                = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
cross_connector     = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
junction            = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
tunnel_ramp         = { family = "common", side = "groundside", value = true,  aeroway = "taxiway" }
apron               = { family = "common", side = "airside",    value = true,  aeroway = "apron" }
building            = { family = "common", side = "airside",    value = true,  aeroway = "apron", rigid = true }  # a RIGID flat group levelled by its contact (09-01g weld = value; 09-03h pads yield)
service_road        = { family = "common", side = "groundside", value = true,  aeroway = "apron" }
service_junction    = { family = "common", side = "groundside", value = true,  aeroway = "apron" }
groundside_pavement = { family = "common", side = "groundside", value = true,  aeroway = "apron" }
boundary            = { family = "none",   side = "airside",    value = false, aeroway = "aerodrome" }
retaining_wall      = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
runway_clearance    = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
taxiway_clearance   = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
graded_strip        = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
ols_cut             = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
object_pad          = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
bridge_trench       = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
bridge_causeway     = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
tunnel_trench       = { family = "none",   side = "airside",    value = false, aeroway = "apron" }

[taxi_family]
members = ["primary_parallel", "secondary_parallel", "stub", "cross_connector", "junction"]

[runway_family]
members = ["runway", "runway_crossing"]
