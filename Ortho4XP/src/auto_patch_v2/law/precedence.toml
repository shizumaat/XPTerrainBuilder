# auto_patch_v2 LAW — roles and authority precedence (Appendix A §2;
# RULINGS 2026-08-03 "emitters emit, never grade"; memory
# emit-consensus-mints-violations).  Where two faces meet, the face whose
# role comes FIRST in `order` owns the shared value; roles not in `order`
# rank after every named one (the terrain tail).  This is a TOTAL order.
#
# PRINCIPLE (RULINGS 2026-09-03i): SENIORITY FOLLOWS FROM BEING GOVERNED.
# Anything without a grade cap in rulesets.toml yields to everything that
# has one — pads yield to aprons by OMISSION (no pad grade law), not by a
# pad rule.  `order` lists the governed roles in their stated seniority;
# `building` appears after `apron` only to fix its place among the
# ungoverned; M2's loader derives the ungoverned tier from "no cap" so a
# new surface class without a cap is junior without a code change.

[authority]
order = [
  "runway", "runway_crossing",                                          # runway family
  "primary_parallel", "secondary_parallel", "stub", "cross_connector",
  "junction", "tunnel_ramp",                                            # taxi family
  "apron", "building",                                                  # apron, then landside occupants
  "service_road", "service_junction", "groundside_pavement",
  "parking_lot",                                                        # owner 2026-09-04j: a class of its own, junior-most governed
]

# Every role v2 emits.  `family` selects the cap table (runway / taxi /
# common / none); `side` is the census partition EXACTLY as the v1 oracle
# partitions it (`check_grade._GROUNDSIDE_ROLES`: four roles are
# groundside, every other role is airside — airside is king: a MIXED row
# counts against airside); `value` = carries its own graded elevation (a
# non-value role traces a lawful bound, no within-shape cap); `rigid` = the
# face is ONE flat value (a pad), set by what it touches, never a pin the
# neighbours climb to (09-03h) and never a no-step pair endpoint of its own
# (pad-only against pad-only); against PAVEMENT it is paired (M5, 09-04i).
[roles]
runway              = { family = "runway", side = "airside",    value = true,  aeroway = "runway" }
runway_crossing     = { family = "runway", side = "airside",    value = true,  aeroway = "runway" }
primary_parallel    = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
secondary_parallel  = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
stub                = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
cross_connector     = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
junction            = { family = "taxi",   side = "airside",    value = true,  aeroway = "taxiway" }
tunnel_ramp         = { family = "common", side = "groundside", value = true,  aeroway = "taxiway", structure = true }
# THE DOOR RAMP (RULINGS 2026-09-08b/c; spec othh-terminal-ramps-spec.md §2 / §4):
# a basement access door's ramp, a structure face of its own class — the
# tunnel_ramp cap is 8 % in BOTH instruments (RULINGS 2026-09-12m: the road
# cap; it was 4 % when this role was minted) and the door law is the same 8 %.
# The door ramp stays its OWN role: same cap, different generation and
# oracle law (structure_ramp 10 %).  Omitted
# from [authority] order (a governed role the order omits follows the named
# ones); groundside like the tunnel ramp.  The oracle reads it under
# tunnel_ramp (its partition and structure semantics) and prices it at the
# STRUCTURE RAMP law (RULINGS 2026-09-08u (2): oracle_law "structure_ramp",
# v1 config STRUCTURE_RAMP_MAX_GRADE 10 %) with o4_grade_law_cap =
# oracle_cap, the ramp law's ceiling — the oracle's pair frame reads a
# ramp's ring diagonals, which the face's longitudinal law does not bound,
# and the owner ruled both structure ramps read there at 10 %.  v2 verify
# stays the stricter instrument on a door ramp (its face cap, 8 %).
door_ramp           = { family = "common", side = "groundside", value = true,  aeroway = "taxiway", structure = true, oracle_role = "tunnel_ramp", oracle_law = "structure_ramp", oracle_cap = 0.10 }
# THE WALL CORRIDOR (RULINGS 2026-09-08m/08n Law C; spec othh-terminal-ramps-spec.md §6):
# wall_corridor_ramp = a kerb-wall corridor's floor and its synthetic climb
# (structures.toml [cutout.wall_corridor] ramp_grade 8 %, steepened to
# max_ramp_grade 10 % = this cap where airside pavement stops it);
# garage_ramp = a DESCENDING wall bottom cut as authored (08n: never gated by
# a ramp law; max_authored_grade 25 % = this cap, a sanity cap).  Both read
# by the oracle under tunnel_ramp; wall_corridor_ramp at the structure-ramp
# law + oracle_cap 10 % (08u (2): the 181 lawful 8.2 % rows the service_road
# alias minted at OTHH).  garage_ramp KEEPS the service_road alias: no
# oracle law carries 25 %, and it has no site (08u (3)) — an authored ramp
# over 8 % is still a v1-census row the v2 verify does not raise, an
# instrument limit recorded in the spec §6a row 17 / §7b row 3.
wall_corridor_ramp  = { family = "common", side = "groundside", value = true,  aeroway = "taxiway", structure = true, oracle_role = "tunnel_ramp", oracle_law = "structure_ramp", oracle_cap = 0.10 }
garage_ramp         = { family = "common", side = "groundside", value = true,  aeroway = "taxiway", structure = true, oracle_role = "tunnel_ramp", oracle_law = "service_road" }
apron               = { family = "common", side = "airside",    value = true,  aeroway = "apron" }
building            = { family = "common", side = "airside",    value = true,  aeroway = "apron", rigid = true }  # a RIGID flat group levelled by its contact (09-01g weld = value; 09-03h pads yield)
service_road        = { family = "common", side = "groundside", value = true,  aeroway = "apron" }
service_junction    = { family = "common", side = "groundside", value = true,  aeroway = "apron" }
groundside_pavement = { family = "common", side = "groundside", value = true,  aeroway = "apron" }
# PARKING LOT (owner 2026-09-04j): car parking pavement, a class of its own,
# cut from the roads at the road-to-lot mouths.  ``oracle_role`` is the name
# the v1 census reads it under (``check_grade._GROUNDSIDE_ROLES`` has no
# parking_lot: an unregistered role would be judged AIRSIDE at the CLI
# default cap) — the emitter writes role=<oracle_role>, class=parking_lot and
# o4_grade_law_cap=<its longitudinal cap>, which the census composes as a
# minimum, so the oracle prices exactly this table's cap on the groundside
# partition.  v2's own verify reads the role itself.
parking_lot         = { family = "common", side = "groundside", value = true,  aeroway = "apron", oracle_role = "groundside_pavement" }
boundary            = { family = "none",   side = "airside",    value = false, aeroway = "aerodrome" }
retaining_wall      = { family = "none",   side = "airside",    value = false, aeroway = "apron", structure = true }
runway_clearance    = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
taxiway_clearance   = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
graded_strip        = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
ols_cut             = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
object_pad          = { family = "none",   side = "airside",    value = false, aeroway = "apron" }
bridge_trench       = { family = "none",   side = "airside",    value = false, aeroway = "apron", structure = true }
bridge_causeway     = { family = "none",   side = "airside",    value = false, aeroway = "apron", structure = true }
tunnel_trench       = { family = "none",   side = "airside",    value = false, aeroway = "apron", structure = true }

# STRUCTURE DATUMS (RULINGS 2026-09-05d/e, lane v2hecalemd, spawner ruling
# 2026-09-05: "a structure vertex shared by two structures takes the SENIOR
# structure's datum").  Where two structure generators pin ONE vertex — a
# tunnel wall crest (09-03b L1: crest = DEM by station along the wall path)
# and a basin rim (28c item 3 / 04l: the rim level with the apron, the DEM
# where bare) — the structure named FIRST here keeps its pin and the other
# structure's pin on that vertex is withdrawn, never both hard (LEMD basin
# 22 vs tunnel -5938: two hard pins 5.99 m apart on one vertex were the
# IIS).  The tunnel is senior: its crest is the bore's own geometry
# (bore_datum_m above the mouth), a basin rim is the ground's reading.
# Values are the ``Source.inputs`` prefixes the generators write.
[structures]
datum_order = ["tunnel", "basin"]

[taxi_family]
members = ["primary_parallel", "secondary_parallel", "stub", "cross_connector", "junction"]

[runway_family]
members = ["runway", "runway_crossing"]
