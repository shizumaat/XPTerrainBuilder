# auto_patch_v2 LAW — authority rulesets (RULINGS 2026-09-03d: "the law
# as data", human-editable; Appendix A §2).  Every value is a grade as a
# FRACTION (0.015 = 1.5 %) unless the key ends in `_m` (metres),
# `_fraction`, or `_deg`.  A table with `by_code` is keyed by ICAO aerodrome
# reference CODE NUMBER ("1".."4", the runway keying); `by_letter` by CODE
# LETTER ("A".."F", the repo's proxy for FAA width / design-group columns).
# A class ABSENT from a table means "the authority states no number" — the
# law is a no-op there — and `default` is used when the caller has no key.
# A rate is written as {grade = G, per_m = D} meaning G per D metres.
#
# Ruleset resolution (Law.for_airport): "K…" and PA/PH/PG/PJ/PM/PW
# indicators are FAA, everything else ICAO (owner 2026-08-02).

[resolution]
default = "icao"                                 # fail-safe key (owner 2026-08-02)
faa_first_letters = ["K"]                        # contiguous USA
faa_two_letter_prefixes = ["PA", "PH", "PG", "PJ", "PM", "PW"]  # FAA-jurisdiction territories

# ── Authority-independent role caps (Appendix A §2, ROLE_GRADE_LIMITS) ──
[common.roles]
# THE TIERED APRON LAW (owner RULINGS 2026-09-06w): every apron row is HARD
# at `max` (1.5 % all directions — an apron can never drag a runway harder
# than a taxiway would, 08-24b) and PREFERS `preferred` (1 %, the 06-18 /
# 08-21b value) — charged in the objective junior to the runway family,
# senior to the DEM fit (solve/assemble.py, Weights.preference "apron").
# `role_cap` answers `max`; `role_preferred_cap` answers `preferred`.
apron               = { preferred = { longitudinal = 0.010, transverse = 0.010 }, max = { longitudinal = 0.015, transverse = 0.015 } }
building            = { preferred = { longitudinal = 0.010, transverse = 0.010 }, max = { longitudinal = 0.015, transverse = 0.015 } }  # pad = apron law (08-21b): the same two tiers
tunnel_ramp         = { longitudinal = 0.080, transverse = 0.020 }  # RULINGS 2026-09-12m (owner): a tunnel ramp IS a road — the road cap (service_road / groundside_pavement 0.080, VDOT GS-9); was 0.040 (user 2026-05-08); lateral = road
door_ramp           = { longitudinal = 0.100, transverse = 0.020 }  # RULINGS 2026-09-08b/c: a basement access door's ramp (structures.toml [cutout.door] ramp_grade, checked <= this at load); lateral = road.  0.080 -> 0.100 with §47 (6) (owner RULINGS 2026-09-17h Q1: the walled door ramp holds the SAME 10 % cap as a wall corridor) — the load check forces the two to move together
wall_corridor_ramp  = { longitudinal = 0.100, transverse = 0.020 }  # RULINGS 2026-09-08m Law C: a kerb-wall corridor floor + its climb, steepened to 10 % at an airside stop (structures.toml [cutout.wall_corridor] max_ramp_grade, checked = at load); lateral = road
garage_ramp         = { longitudinal = 0.250, transverse = 0.020 }  # RULINGS 2026-09-08n: a descending wall bottom cut AS AUTHORED — this is the sanity cap max_authored_grade (checked = at load), never a ramp law; lateral = road
service_road        = { longitudinal = 0.080, transverse = 0.020 }  # VDOT GS-9 (owner 2026-08-03); laterally flat 2 % (08-25g)
service_junction    = { longitudinal = 0.080, transverse = 0.020 }  # same car-logic cap as the road body (08-03)
groundside_pavement = { longitudinal = 0.080, transverse = 0.020 }  # THE road limit, same constant (owner 2026-08-12)
parking_lot         = { longitudinal = 0.050, transverse = 0.020 }  # owner 2026-09-04j: lots 5 %; transverse = the road law's lateral 2 % until the owner states otherwise

[common]
apron_fan_ramp_max = 0.050          # the BACK-EDGE class between adjacent pads (owner 08-24; 06w (3): hard, with the apron preference) — v2 models no zone yet (owed, lane v2routecap round 3)
road_transverse_axis_min_deg = 45.0 # ring pair ≥ this off the road axis is ACROSS (08-25g)
runway_crown_transverse = 0.010     # declared crown drop each side of the runway spine (08-05)
# THE 5 % CEILING (owner RULINGS 2026-09-09b (4)): "all pavement including
# groundside has a MAX grade of 5 %; roads are the only exception at 8 %".
# HARD in the design solve's active set beside the runway rows
# (`constraints/ceiling.py`, `[design] hard_rulings`); the per-class letter
# caps (`common.roles.*`, `<ruleset>.taxi.longitudinal`, ...) stay one-sided
# TARGETS under it.  Region-invariant: no aviation authority regulates a
# landside ceiling, and every airside class cap is stricter than 5 %.
pavement_max_grade = 0.05           # every pavement class: airside, groundside pavement, pads, lots, apron, junction, taxi (runway already stricter)
road_max_grade     = 0.08           # a FREE road only (road-family faces alone): the service-road standard already carried by SERVICE_ROAD_MAX_GRADE (owner 2026-08-03); a road welded into a pavement IS that pavement (free-road ruling) and takes the 5 %
vertical_curve_k_grade_unit = 0.01  # the UNIT of every ruleset's vertical_curve_k_m: K is metres per THIS much grade change (one per cent, Annex 14 §3.1.16 / AC 150/5300-13 §3.16); a spacing s admits a change of s / K × this (2026-09-06b law 1)
# ── THE END-AROUND TAXIWAY (spec §36; owner RULINGS 2026-09-13j item 2) ──
# An end-around taxiway loops BEYOND a runway end and crosses the extended
# centreline, so the aircraft on it stands directly under the departure /
# take-off-climb surface — and it is the TAIL, not the wingtip, that
# penetrates.  The ceiling is therefore
#
#     ceiling(D) = end_z + max(0, D − setback) · slope − tail_height
#
# which is NORMALLY BELOW the runway end (KATL taxiway Victor ≈ −9 m).  The
# AUTHORITY states only `slope` / `setback_m` (the `[faa.eat]` / `[icao.eat]`
# tables below, v1 `config.eat_surface_slope_and_setback`); everything here is
# a fact about the FEATURE and the AIRCRAFT, so it is stated ONCE.  These are
# v1's own values, asserted equal by `tests/auto_patch_v2/test_law_tables.py`.
[common.eat]
# maximum aircraft TAIL height (m) by code letter — FAA AC 150/5300-13B
# Table 1-1 ADG by tail height (20 ft = 6.1, 30 = 9.1, 45 = 13.7, 60 = 18.3,
# 66 = 20.1, 80 = 24.4 m), keyed by the ICAO letter (A<->I ... F<->VI), v1
# `config.py:5828 TAIL_HEIGHT_BY_CODE_LETTER`
tail_height_m = { by_letter = { "A" = 6.1, "B" = 9.1, "C" = 13.7, "D" = 18.3, "E" = 20.1, "F" = 24.4 } }
min_crossing_m = 300.0            # v1 EAT_MIN_CROSSING_DIST_M: closer than this the pavement is an ordinary runway-end connector (at 60 m the code-E ceiling is −18.6 m), not an end-around taxiway
max_crossing_m = 600.0            # v1 EAT_MAX_CROSSING_DIST_M (owner 2026-08-25d): real EATs cross at 439-482 m; a wrap a kilometre out is the taxi network crossing a projected line
segment_gap_m = 75.0              # v1 EAT_RECT_SEGMENT_GAP_M: governed vertices closer than this along `s` are ONE crossing
rect_max_along_m = 150.0          # v1 EAT_RECT_MAX_ALONG_M: "the rect is short along the direction of EAT travel" (KCLT spans 43 m); pavement running ALONG the corridor is another facility
min_runway_code_number = 3        # v1 EAT_MIN_RUNWAY_CODE_NUMBER: end-around taxiways exist at transport-category runways only (CYXY 02/20 aimed its corridor across the GA apron)

# ── ICAO Annex 14 Vol I / EASA CS-ADR-DSN ──────────────────────────────
[icao]
name = "ICAO Annex 14 Vol I / EASA CS-ADR-DSN"
authority = "ICAO"

[icao.runway]
longitudinal      = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.015, "4" = 0.0125 }, default = 0.015 }  # ANNEX 14 §3.1.13 IN FULL (owner RULINGS 2026-09-18f (1)/(3); spec §50.1 (1)): 2 % code 1/2, 1.5 % code 3, 1.25 % code 4.  This REVERSES owner 2026-07-08 / spawner 2026-09-04y for codes 1/2 — the owner acknowledged the reversal (CYXY 02/20 now solves under 2 %, and its ledger control is no longer comparable) — and TIGHTENS code 4, chosen KNOWING HECA/LEMD-class runways move; the sim read adjudicates.  04y's cause (the census pricing every runway at a flat 1.5 %) is closed by §50.1 (4): the sidecar's `runway_caps` carries the cap the build priced, for EVERY runway.  The un-coded `default` stays 1.5 % (§50.1 (2)): it is read only by fixtures and twins that state no code
# §50.1 (3) THE CAP YIELDS TO ITS PINS, UNIFORMLY (owner RULINGS
# 2026-09-18d (3)): where a runway's own HARD PINS (CIFP thresholds, a §17
# crossing anchor, a §38 seam DEM pin) demand more grade than this table
# allows, the EFFECTIVE cap for that runway is its pin-to-pin grade plus
# `[design] runway_yield_margin` — derived once in
# `constraints/runway_yield.py`, carried on `PlanarMap.runway_caps`, read
# by the solve through `precedence.cap_of` and published in the sidecar.
# Thresholds are truth; the table is the cap where the pins permit it.
end_zone          = { by_code = { "3" = 0.008, "4" = 0.008 } }   # first/last quarter, code 3/4 only (§3.1.14); code 1/2: no rule
end_zone_fraction = 0.25                                  # extent of each end zone, fraction of length
end_zone_precision_only_codes = [3]                       # code 3: end-zone cap binds Cat II/III only
max_grade_change  = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.015, "4" = 0.015 }, default = 0.015 }  # §3.1.15
vertical_curve_k_m = { by_code = { "1" = 75.0, "2" = 75.0, "3" = 150.0, "4" = 300.0 }, default = 300.0 }  # m per 1 % change (§3.1.16)
transverse_max    = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.1.18
transverse_min    = 0.010                                 # crown minimum (recorded, §3.1.18)
shoulder_transverse_max = 0.025                            # §40 (2) as amended (owner RULINGS 2026-09-13dd; ICAO Annex 14 §3.2.4, runway SHOULDER transverse slope): the cap on a shoulder vertex BEYOND the runway's own half-width. A shoulder keeps the runway's DATUM — no step across the shared edge, the §29 chord surface reaches it — but not the runway's 1.5 % cross-fall, which is the law of the paved runway between its edges. MEASURED at HECA (round 1): two shoulder vertices at 108.7 m and 204.9 m from the ridge read 1.5287 % and 1.5233 % — 3.1 and 4.8 cm past the 1.50 % cap, DEFECT rows the app build fails on; both pass at 2.5 %.

[icao.taxi]
longitudinal = { by_letter = { "A" = 0.030, "B" = 0.030, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.9.10
transverse   = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.9.11
transverse_min = 0.010                                    # recorded, not bound (owner question 5)
width_m = { by_letter = { "A" = 7.5, "B" = 10.5, "C" = 15.0, "D" = 18.0, "E" = 23.0, "F" = 25.0 }, default = 18.0 }  # taxiway pavement width, §3.9.3 (D: 18, OMGWS < 9 m) — law key of RULINGS 2026-09-06t; its corridor reading withdrawn 06v

[icao.strip]
longitudinal = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.0175, "4" = 0.015 }, default = 0.015 }  # §3.4.12 abeam slope (reg-set 08-08)
arc_rate     = { grade = 0.02, per_m = 30.5 }             # PROVISIONAL (§3.4.14 qualitative; owner question 2)
arc_rate_provisional = true

[icao.end_skirt]
max_down_grade = 0.05                                     # beyond the runway end (reg-set 08-08)
corridor_length_m = { by_code = { "1" = 60.0, "2" = 90.0, "3" = 150.0, "4" = 240.0 }, default = 240.0 }  # governed end corridor beyond each end (Annex 14 §3.5.3 RESA length; RUNWAY_END_CLEARANCE_LENGTH_BY_CODE)
rate           = { grade = 0.02, per_m = 30.5 }           # PROVISIONAL
rate_provisional = true

[icao.resa]
transverse_max = 0.05                                     # end corridor, symmetric ± (reg-set 08-08)

[icao.raoa]
length_m         = 300.0                                  # radio-altimeter operating area (Annex 14 Att A §4)
half_width_m     = 60.0
max_grade_change = { grade = 0.02, per_m = 30.0 }

[icao.eat]
# EASA CS-ADR-DSN H.435 / Table J-2 + J.480(e) take-off climb surface, code
# 3/4: 2 % from an inner edge 60 m beyond the runway end (v1
# `config.py:5909-5913 EAT_EASA_TAKEOFF_CLIMB_SLOPE / EAT_EASA_SETBACK_M`).
slope     = 0.02
setback_m = 60.0

[icao.drainage]
# ICAO states no apron drainage minimum: the family is a no-op (08-13b/14).

# ── FAA AC 150/5300-13B ────────────────────────────────────────────────
[faa]
name = "FAA AC 150/5300-13B"
authority = "FAA"

[faa.runway]
longitudinal      = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # Table 3-2 / 3-3
end_zone          = { by_letter = { "C" = 0.008, "D" = 0.008, "E" = 0.008, "F" = 0.008 } }  # first/last quarter, AAC C-E; A/B: no rule
end_zone_fraction = 0.25
end_zone_max_length_m = 762.0                             # lesser of the quarter and 2,500 ft
end_zone_precision_only_codes = []
max_grade_change  = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
vertical_curve_k_m = { by_letter = { "A" = 91.4, "B" = 91.4, "C" = 305.0, "D" = 305.0, "E" = 305.0, "F" = 305.0 }, default = 305.0 }  # m per 1 % (§3.16)
vertical_curve_min_change = { by_letter = { "A" = 0.004, "B" = 0.004 }, default = 0.0 }  # below this no curve (AAC A/B, §3.16.1.1); 0 = always
transverse_max    = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
transverse_min    = 0.010
shoulder_transverse_max = 0.025                            # §40 (2) as amended (RULINGS 2026-09-13dd): the shoulder cap beyond the runway half-width (FAA AC 150/5300-13B §3.13: shoulder grades to 5 %; the ICAO 2.5 % is the stricter reading v2 applies to both authorities until the owner rules otherwise)

[faa.taxi]
longitudinal = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §4 taxiway family
transverse   = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
transverse_min = 0.010
width_m = { by_letter = { "A" = 7.5, "B" = 10.5, "C" = 15.0, "D" = 23.0, "E" = 23.0, "F" = 30.0 }, default = 15.0 }  # AC 150/5300-13B taxiway width by ADG (I 25 ft … VI 100 ft) through the letter proxy (2026-09-06t; corridor reading withdrawn 06v)

[faa.strip]
longitudinal = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # RSA = runway cap
arc_rate     = { grade = 0.02, per_m = 30.5 }             # §3.16.5 item 5
arc_rate_provisional = false

[faa.end_skirt]
near_zone_m          = 61.0                               # first 200 ft beyond the end (Table 3-6)
corridor_length_m    = { by_code = { "1" = 60.0, "2" = 90.0, "3" = 150.0, "4" = 240.0 }, default = 240.0 }  # governed end corridor (RUNWAY_END_CLEARANCE_LENGTH_BY_CODE; the repo keys it by ICAO code number under both authorities)
near_max_down_grade  = 0.03
max_down_grade       = 0.05
rate                 = { grade = 0.02, per_m = 30.5 }
rate_provisional     = false

[faa.resa]
transverse_near_min = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # Table 3-6 S-3
transverse_near_max = { by_letter = { "A" = 0.05, "B" = 0.05, "C" = 0.03, "D" = 0.03, "E" = 0.03, "F" = 0.03 }, default = 0.03 }
transverse_max      = 0.05                                # beyond the near zone

[faa.eat]
# FAA AC 150/5300-13B §4.12 / Order 8260.3 TERPS departure surface: 40:1
# from the departure end, no setback (v1 `config.py:5985-6015
# EAT_FAA_DEPARTURE_SLOPE / EAT_FAA_SETBACK_M`).
slope     = 0.025
setback_m = 0.0

[faa.drainage]
apron_min_grade       = 0.005                             # surface flatter than this fails drainage (08-13b/14: runways only crown)
apron_max_grade_change = 0.02
