# auto_patch_v2 LAW — authority rulesets (RULINGS 2026-09-03d: "the law
# as data", human-editable; Appendix A §2).  Every value is a grade as a
# FRACTION (0.015 = 1.5 %) unless the key ends in `_m` (metres),
# `_fraction`, or `_deg`.  A table with `by_code` is keyed by ICAO aerodrome
# reference CODE NUMBER ("1".."4", the runway keying); `by_letter` by CODE
# LETTER ("A".."F", the repo's proxy for FAA width / design-group columns).
# A class ABSENT from a table means "the authority states no number" — the
# law is a no-op there — and `default` is used when the caller has no key.
# A rate is written as {grade = G, per_m = D} meaning G per D metres.
#
# Ruleset resolution (Law.for_airport): "K…" and PA/PH/PG/PJ/PM/PW
# indicators are FAA, everything else ICAO (owner 2026-08-02).

[resolution]
default = "icao"                                 # fail-safe key (owner 2026-08-02)
faa_first_letters = ["K"]                        # contiguous USA
faa_two_letter_prefixes = ["PA", "PH", "PG", "PJ", "PM", "PW"]  # FAA-jurisdiction territories

# ── Authority-independent role caps (Appendix A §2, ROLE_GRADE_LIMITS) ──
[common.roles]
apron               = { longitudinal = 0.010, transverse = 0.010 }  # all directions (owner 2026-06-18; 08-21b)
building            = { longitudinal = 0.010, transverse = 0.010 }  # pad = apron law (08-21b)
tunnel_ramp         = { longitudinal = 0.040, transverse = 0.020 }  # navigable portal ramp (user 2026-05-08); lateral = road
service_road        = { longitudinal = 0.080, transverse = 0.020 }  # VDOT GS-9 (owner 2026-08-03); laterally flat 2 % (08-25g)
service_junction    = { longitudinal = 0.080, transverse = 0.020 }  # same car-logic cap as the road body (08-03)
groundside_pavement = { longitudinal = 0.080, transverse = 0.020 }  # THE road limit, same constant (owner 2026-08-12)

[common]
apron_fan_ramp_max = 0.050          # interior apron fan cap (FAN_RAMP_CAP; 08-08 fabric model)
road_transverse_axis_min_deg = 45.0 # ring pair ≥ this off the road axis is ACROSS (08-25g)
runway_crown_transverse = 0.010     # declared crown drop each side of the runway spine (08-05)

# ── ICAO Annex 14 Vol I / EASA CS-ADR-DSN ──────────────────────────────
[icao]
name = "ICAO Annex 14 Vol I / EASA CS-ADR-DSN"
authority = "ICAO"

[icao.runway]
longitudinal      = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.015, "4" = 0.015 }, default = 0.015 }  # owner 2026-07-08: 1.5 % IS the law for code 3/4 (supersedes Annex 14 §3.1.13 1.25 % for code 4; the census prices 1.5 %; M3a: CIFP at SPLP implies 1.255 %)
end_zone          = { by_code = { "3" = 0.008, "4" = 0.008 } }   # first/last quarter, code 3/4 only (§3.1.14); code 1/2: no rule
end_zone_fraction = 0.25                                  # extent of each end zone, fraction of length
end_zone_precision_only_codes = [3]                       # code 3: end-zone cap binds Cat II/III only
max_grade_change  = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.015, "4" = 0.015 }, default = 0.015 }  # §3.1.15
vertical_curve_k_m = { by_code = { "1" = 75.0, "2" = 75.0, "3" = 150.0, "4" = 300.0 }, default = 300.0 }  # m per 1 % change (§3.1.16)
transverse_max    = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.1.18
transverse_min    = 0.010                                 # crown minimum (recorded, §3.1.18)

[icao.taxi]
longitudinal = { by_letter = { "A" = 0.030, "B" = 0.030, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.9.10
transverse   = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.9.11
transverse_min = 0.010                                    # recorded, not bound (owner question 5)

[icao.strip]
longitudinal = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.0175, "4" = 0.015 }, default = 0.015 }  # §3.4.12 abeam slope (reg-set 08-08)
arc_rate     = { grade = 0.02, per_m = 30.5 }             # PROVISIONAL (§3.4.14 qualitative; owner question 2)
arc_rate_provisional = true

[icao.end_skirt]
max_down_grade = 0.05                                     # beyond the runway end (reg-set 08-08)
corridor_length_m = { by_code = { "1" = 60.0, "2" = 90.0, "3" = 150.0, "4" = 240.0 }, default = 240.0 }  # governed end corridor beyond each end (Annex 14 §3.5.3 RESA length; RUNWAY_END_CLEARANCE_LENGTH_BY_CODE)
rate           = { grade = 0.02, per_m = 30.5 }           # PROVISIONAL
rate_provisional = true

[icao.resa]
transverse_max = 0.05                                     # end corridor, symmetric ± (reg-set 08-08)

[icao.raoa]
length_m         = 300.0                                  # radio-altimeter operating area (Annex 14 Att A §4)
half_width_m     = 60.0
max_grade_change = { grade = 0.02, per_m = 30.0 }

[icao.drainage]
# ICAO states no apron drainage minimum: the family is a no-op (08-13b/14).

# ── FAA AC 150/5300-13B ────────────────────────────────────────────────
[faa]
name = "FAA AC 150/5300-13B"
authority = "FAA"

[faa.runway]
longitudinal      = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # Table 3-2 / 3-3
end_zone          = { by_letter = { "C" = 0.008, "D" = 0.008, "E" = 0.008, "F" = 0.008 } }  # first/last quarter, AAC C-E; A/B: no rule
end_zone_fraction = 0.25
end_zone_max_length_m = 762.0                             # lesser of the quarter and 2,500 ft
end_zone_precision_only_codes = []
max_grade_change  = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
vertical_curve_k_m = { by_letter = { "A" = 91.4, "B" = 91.4, "C" = 305.0, "D" = 305.0, "E" = 305.0, "F" = 305.0 }, default = 305.0 }  # m per 1 % (§3.16)
vertical_curve_min_change = { by_letter = { "A" = 0.004, "B" = 0.004 }, default = 0.0 }  # below this no curve (AAC A/B, §3.16.1.1); 0 = always
transverse_max    = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
transverse_min    = 0.010

[faa.taxi]
longitudinal = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §4 taxiway family
transverse   = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
transverse_min = 0.010

[faa.strip]
longitudinal = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # RSA = runway cap
arc_rate     = { grade = 0.02, per_m = 30.5 }             # §3.16.5 item 5
arc_rate_provisional = false

[faa.end_skirt]
near_zone_m          = 61.0                               # first 200 ft beyond the end (Table 3-6)
corridor_length_m    = { by_code = { "1" = 60.0, "2" = 90.0, "3" = 150.0, "4" = 240.0 }, default = 240.0 }  # governed end corridor (RUNWAY_END_CLEARANCE_LENGTH_BY_CODE; the repo keys it by ICAO code number under both authorities)
near_max_down_grade  = 0.03
max_down_grade       = 0.05
rate                 = { grade = 0.02, per_m = 30.5 }
rate_provisional     = false

[faa.resa]
transverse_near_min = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # Table 3-6 S-3
transverse_near_max = { by_letter = { "A" = 0.05, "B" = 0.05, "C" = 0.03, "D" = 0.03, "E" = 0.03, "F" = 0.03 }, default = 0.03 }
transverse_max      = 0.05                                # beyond the near zone

[faa.drainage]
apron_min_grade       = 0.005                             # surface flatter than this fails drainage (08-13b/14: runways only crown)
apron_max_grade_change = 0.02
