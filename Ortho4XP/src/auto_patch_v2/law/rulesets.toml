# auto_patch_v2 LAW — authority rulesets (RULINGS 2026-09-03d: "the law
# as data", human-editable; Appendix A §2).  Every value is a grade as a
# FRACTION (0.015 = 1.5 %) unless the key ends in `_m` (metres),
# `_fraction`, or `_deg`.  A table with `by_code` is keyed by ICAO aerodrome
# reference CODE NUMBER ("1".."4", the runway keying); `by_letter` by CODE
# LETTER ("A".."F", the repo's proxy for FAA width / design-group columns).
# A class ABSENT from a table means "the authority states no number" — the
# law is a no-op there — and `default` is used when the caller has no key.
# A rate is written as {grade = G, per_m = D} meaning G per D metres.
#
# Ruleset resolution (Law.for_airport): "K…" and PA/PH/PG/PJ/PM/PW
# indicators are FAA, everything else ICAO (owner 2026-08-02).

[resolution]
default = "icao"                                 # fail-safe key (owner 2026-08-02)
faa_first_letters = ["K"]                        # contiguous USA
faa_two_letter_prefixes = ["PA", "PH", "PG", "PJ", "PM", "PW"]  # FAA-jurisdiction territories

# ── Authority-independent role caps (Appendix A §2, ROLE_GRADE_LIMITS) ──
[common.roles]
# THE TIERED APRON LAW (owner RULINGS 2026-09-06w): every apron row is HARD
# at `max` (1.5 % all directions — an apron can never drag a runway harder
# than a taxiway would, 08-24b) and PREFERS `preferred` (1 %, the 06-18 /
# 08-21b value) — charged in the objective junior to the runway family,
# senior to the DEM fit (solve/assemble.py, Weights.preference "apron").
# `role_cap` answers `max`; `role_preferred_cap` answers `preferred`.
apron               = { preferred = { longitudinal = 0.010, transverse = 0.010 }, max = { longitudinal = 0.015, transverse = 0.015 } }
building            = { preferred = { longitudinal = 0.010, transverse = 0.010 }, max = { longitudinal = 0.015, transverse = 0.015 } }  # pad = apron law (08-21b): the same two tiers
tunnel_ramp         = { longitudinal = 0.100, transverse = 0.020 }  # 0.080 -> 0.100 (owner RULINGS 2026-10-07b (2): roads and ramps up to 10 %); RULINGS 2026-09-12m (owner): a tunnel ramp IS a road — the road cap (service_road / groundside_pavement 0.080, VDOT GS-9); was 0.040 (user 2026-05-08); lateral = road
door_ramp           = { longitudinal = 0.100, transverse = 0.020 }  # RULINGS 2026-09-08b/c: a basement access door's ramp.  Its OWN grade is uncapped — the well frames it (owner RULINGS 2026-10-07e; the lift, publication.lifted_caps); this row prices what the lift does not take: its seams with its neighbours (cross_shape, steps) at the road ramp law, and its cross-section; lateral = road
wall_corridor_ramp  = { longitudinal = 0.100, transverse = 0.020 }  # RULINGS 2026-09-08m Law C: a kerb-wall corridor's ramp.  Its OWN grade is uncapped — the walls frame it (owner RULINGS 2026-10-07e; the lift); this row prices its seams with its neighbours at the road ramp law, and its cross-section; lateral = road
garage_ramp         = { longitudinal = 0.250, transverse = 0.020 }  # RULINGS 2026-09-08n: a descending wall bottom cut AS AUTHORED — this is the sanity cap max_authored_grade (checked = at load), never a ramp law; lateral = road
service_road        = { longitudinal = 0.100, transverse = 0.020 }  # 0.080 -> 0.100 (owner RULINGS 2026-10-07b (2): roads and ramps up to 10 %); VDOT GS-9 (owner 2026-08-03); laterally flat 2 % (08-25g)
service_junction    = { longitudinal = 0.100, transverse = 0.020 }  # 0.080 -> 0.100 (owner RULINGS 2026-10-07b (2): roads and ramps up to 10 %); same car-logic cap as the road body (08-03)
groundside_pavement = { longitudinal = 0.100, transverse = 0.020 }  # 0.080 -> 0.100 (owner RULINGS 2026-10-07b (2): roads and ramps up to 10 %); THE road limit, same constant (owner 2026-08-12)
parking_lot         = { longitudinal = 0.050, transverse = 0.020 }  # owner 2026-09-04j: lots 5 %; transverse = the road law's lateral 2 % until the owner states otherwise

[common]
apron_fan_ramp_max = 0.050          # the BACK-EDGE class between adjacent pads (owner 08-24; 06w (3): hard, with the apron preference) — v2 models no zone yet (owed, lane v2routecap round 3)
road_transverse_axis_min_deg = 45.0 # ring pair ≥ this off the road axis is ACROSS (08-25g)
runway_crown_transverse = 0.010     # declared crown drop each side of the runway spine (08-05)
# THE 5 % CEILING (owner RULINGS 2026-09-09b (4)): "all pavement including
# groundside has a MAX grade of 5 %; roads are the only exception at 8 %".
# HARD in the design solve's active set beside the runway rows
# (`constraints/ceiling.py`, `[design] hard_rulings`); the per-class letter
# caps (`common.roles.*`, `<ruleset>.taxi.longitudinal`, ...) stay one-sided
# TARGETS under it.  Region-invariant: no aviation authority regulates a
# landside ceiling, and every airside class cap is stricter than 5 %.
pavement_max_grade = 0.05           # every pavement class: airside, groundside pavement, pads, lots, apron, junction, taxi (runway already stricter)
# THE UNIVERSAL PAVEMENT CAP (owner RULINGS 2026-09-29ac, #105): the road
# cap below is ALSO the fallback ceiling of every pavement class — HARD over
# every pavement pair no lower cap governs (`tables.pavement_fallback_cap`,
# `constraints/pavement_cap.py`; census `pavement_over_road_cap`).  It is
# a reference to this key, never a second number.
road_max_grade     = 0.10           # 0.08 -> 0.10 (owner RULINGS 2026-10-07b (2): roads and ramps up to 10 %); a FREE road only (road-family faces alone): the service-road standard already carried by SERVICE_ROAD_MAX_GRADE (owner 2026-08-03); a road welded into a pavement IS that pavement (free-road ruling) and takes the 5 %
vertical_curve_k_grade_unit = 0.01  # the UNIT of every ruleset's vertical_curve_k_m: K is metres per THIS much grade change (one per cent, Annex 14 §3.1.16 / AC 150/5300-13 §3.16); a spacing s admits a change of s / K × this (2026-09-06b law 1)
# ── THE END-AROUND TAXIWAY (spec §36; owner RULINGS 2026-09-13j item 2) ──
# An end-around taxiway loops BEYOND a runway end and crosses the extended
# centreline, so the aircraft on it stands directly under the departure /
# take-off-climb surface — and it is the TAIL, not the wingtip, that
# penetrates.  The ceiling is therefore
#
#     ceiling(D) = end_z + max(0, D − setback) · slope − tail_height
#
# which is NORMALLY BELOW the runway end (KATL taxiway Victor ≈ −9 m).  The
# AUTHORITY states only `slope` / `setback_m` (the `[faa.eat]` / `[icao.eat]`
# tables below, v1 `config.eat_surface_slope_and_setback`); everything here is
# a fact about the FEATURE and the AIRCRAFT, so it is stated ONCE.  These are
# v1's own values, asserted equal by `tests/auto_patch_v2/test_law_tables.py`.
[common.eat]
# maximum aircraft TAIL height (m) by code letter — FAA AC 150/5300-13B
# Table 1-1 ADG by tail height (20 ft = 6.1, 30 = 9.1, 45 = 13.7, 60 = 18.3,
# 66 = 20.1, 80 = 24.4 m), keyed by the ICAO letter (A<->I ... F<->VI), v1
# `config.py:5828 TAIL_HEIGHT_BY_CODE_LETTER`
tail_height_m = { by_letter = { "A" = 6.1, "B" = 9.1, "C" = 13.7, "D" = 18.3, "E" = 20.1, "F" = 24.4 } }
min_crossing_m = 457.2            # FAA AC 150/5300-13B Chg 1 §4.12 std 1 (owner RULINGS 2026-10-15e (1)): an EAT's centreline is at least 1,500 ft (457.2 m) from the departure end.  Measured at the 1202 TAXI-ROUTE CROSSING of the extended centreline, never at a vertex (a 23 m taxiway crossing at 461 m has pavement at 450 m).  Nearer, the taxiway is an ordinary ATC-controlled crossing with no depth requirement.  Replaces v1 EAT_MIN_CROSSING_DIST_M = 300 (an engine-chosen value)
max_crossing_m = 600.0            # v1 EAT_MAX_CROSSING_DIST_M (owner 2026-08-25d): real EATs cross at 439-482 m; a wrap a kilometre out is the taxi network crossing a projected line
segment_gap_m = 75.0              # v1 EAT_RECT_SEGMENT_GAP_M: governed vertices closer than this along `s` are ONE crossing
rect_max_along_m = 150.0          # v1 EAT_RECT_MAX_ALONG_M: "the rect is short along the direction of EAT travel" (KCLT spans 43 m); pavement running ALONG the corridor is another facility
min_runway_code_number = 3        # v1 EAT_MIN_RUNWAY_CODE_NUMBER: end-around taxiways exist at transport-category runways only (CYXY 02/20 aimed its corridor across the GA apron)

# ── THE RUNWAY WITNESSES (regulation-conformance spec §3.1/§3.2; owner
# RULINGS 2026-10-15k/l) — ONE classifier for engine and census
# (`law/reference_code.py`); the loader stamps `Runway.code_number` /
# `code_letter` once and every reader takes the stamp (the census from the
# sidecar `runway_axes`).
[common.reference_code]
# ICAO Annex 14 Vol I Table 1-1: the code NUMBER by reference field length,
# runway length as the proxy (a DEFINITION, not a tunable): the length each
# code starts at; below the first, code 1.
number_min_length_m = { by_code = { "2" = 800.0, "3" = 1200.0, "4" = 1800.0 } }
# The code LETTER by runway WIDTH (the wingspan / FAA AAC-ADG proxy), the
# widest runway each letter covers with a 0.5 m unit tolerance: FAA AC
# 150/5300-13B App. G widths 60 ft (18.3 m) A/B-I -> A, 75 ft (22.9) A/B-II
# -> B, 100 ft (30.5) A/B-III and C/D-I..III -> C, ICAO 45 m -> D, 150 ft
# (45.7 m) C/D-IV, D-V -> E (the conservative ADG-V tail, the taller
# aircraft for a ceiling law), Annex 14 Table 3-1 letter F at 60 m and
# above.  Replaces the engine's exclusive bounds at the ICAO minimums
# (60 ft read B, 100 ft read D, OTHH's 60 m read E) and the census's own
# `config.runway_code_letter` (>= 15/21/28/42/55).
letter_max_width_m = { by_letter = { "A" = 18.8, "B" = 23.4, "C" = 31.0, "D" = 45.0, "E" = 46.3 } }
widest_letter = "F"

# ── ICAO Annex 14 Vol I / EASA CS-ADR-DSN ──────────────────────────────
[icao]
name = "ICAO Annex 14 Vol I / EASA CS-ADR-DSN"
authority = "ICAO"

[icao.runway]
longitudinal      = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.015, "4" = 0.0125 }, default = 0.015 }  # ANNEX 14 §3.1.13 IN FULL (owner RULINGS 2026-09-18f (1)/(3); spec §50.1 (1)): 2 % code 1/2, 1.5 % code 3, 1.25 % code 4.  This REVERSES owner 2026-07-08 / spawner 2026-09-04y for codes 1/2 — the owner acknowledged the reversal (CYXY 02/20 now solves under 2 %, and its ledger control is no longer comparable) — and TIGHTENS code 4, chosen KNOWING HECA/LEMD-class runways move; the sim read adjudicates.  04y's cause (the census pricing every runway at a flat 1.5 %) is closed by §50.1 (4): the sidecar's `runway_caps` carries the cap the build priced, for EVERY runway.  The un-coded `default` stays 1.5 % (§50.1 (2)): it is read only by fixtures and twins that state no code
# §50.1 (3) THE CAP YIELDS TO ITS PINS, UNIFORMLY (owner RULINGS
# 2026-09-18d (3)): where a runway's own HARD PINS (CIFP thresholds, a §17
# crossing anchor, a §38 seam DEM pin) demand more grade than this table
# allows, the EFFECTIVE cap for that runway is its pin-to-pin grade plus
# `[design] runway_yield_margin` — derived once in
# `constraints/runway_yield.py`, carried on `PlanarMap.runway_caps`, read
# by the solve through `precedence.cap_of` and published in the sidecar.
# Thresholds are truth; the table is the cap where the pins permit it.
end_zone          = { by_code = { "3" = 0.008, "4" = 0.008 } }   # first/last quarter, code 3/4 only (§3.1.14); code 1/2: no rule
end_zone_fraction = 0.25                                  # extent of each end zone, fraction of length
end_zone_precision_only_codes = [3]                       # code 3: end-zone cap binds Cat II/III only (§3.1.14) — at an END the witness reads Cat II/III (`RunwayEnd.cat_ii_iii`: apt.dat ALSF-II / Calvert II lights with TDZ lights, RULINGS 2026-10-15m (2)); audit row 13
# THE MEAN RUNWAY SLOPE (Annex 14 §3.1.13; audit §4 "missing law" M1, RULINGS
# 2026-10-15l (1)): the highest minus the lowest centreline elevation, over
# the runway length, at most 1 % at code 3/4 and 2 % at code 1/2
# (`constraints/runway_mean_slope.py`; verify `runway_mean_slope`).  FAA
# states no mean slope (absent: no rows).
mean_slope_max    = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.010, "4" = 0.010 } }
# ... stated between ridge stations at least this far apart (an ENGINE value,
# spec §4 emittability): all-pairs over every station cost CYXY 45k rows and
# doubled its solve; between stations the vertical-curve rows (K >= 150 m per
# 1 %) hold the sag to K-rate x s^2 / 8 <= 0.02 m at 50 m, under the 12y bar
mean_slope_station_m = 50.0
max_grade_change  = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.015, "4" = 0.015 }, default = 0.015 }  # §3.1.15
vertical_curve_k_m = { by_code = { "1" = 75.0, "2" = 75.0, "3" = 150.0, "4" = 300.0 }, default = 300.0 }  # m per 1 % change (§3.1.16)
transverse_max    = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.1.18
transverse_min    = 0.010                                 # crown minimum (recorded, §3.1.18)
shoulder_transverse_max = 0.025                            # §40 (2) as amended (owner RULINGS 2026-09-13dd; ICAO Annex 14 §3.2.4, runway SHOULDER transverse slope): the cap on a shoulder vertex BEYOND the runway's own half-width. A shoulder keeps the runway's DATUM — no step across the shared edge, the §29 chord surface reaches it — but not the runway's 1.5 % cross-fall, which is the law of the paved runway between its edges. MEASURED at HECA (round 1): two shoulder vertices at 108.7 m and 204.9 m from the ridge read 1.5287 % and 1.5233 % — 3.1 and 4.8 cm past the 1.50 % cap, DEFECT rows the app build fails on; both pass at 2.5 %.

[icao.taxi]
longitudinal = { by_letter = { "A" = 0.030, "B" = 0.030, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.9.10
transverse   = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §3.9.11
transverse_min = 0.010                                    # recorded, not bound (owner question 5)
# THE TAXIWAY GRADE-CHANGE RATE (owner RULINGS 2026-10-15l (1); audit row 2):
# Annex 14 §3.9.9 — a change of slope accomplished by a curved surface of at
# least 30 m per 1 % at code C-F, 25 m per 1 % at A/B.  Metres of curve per
# `common.vertical_curve_k_grade_unit` of change, by the face's 1202 letter;
# read by the airside no-step RATE on taxi-family rings
# (`tables.airside_rate_per_m`).  The un-lettered default is C-F's (the
# stricter rate).
curve_k_m = { by_letter = { "A" = 25.0, "B" = 25.0, "C" = 30.0, "D" = 30.0, "E" = 30.0, "F" = 30.0 }, default = 30.0 }
width_m = { by_letter = { "A" = 7.5, "B" = 10.5, "C" = 15.0, "D" = 18.0, "E" = 23.0, "F" = 25.0 }, default = 18.0 }  # taxiway pavement width, §3.9.3 (D: 18, OMGWS < 9 m) — law key of RULINGS 2026-09-06t; its corridor reading withdrawn 06v

[icao.strip]
longitudinal = { by_code = { "1" = 0.020, "2" = 0.020, "3" = 0.0175, "4" = 0.015 }, default = 0.015 }  # §3.4.12 abeam slope (reg-set 08-08); ALSO the cap over the strip's `end_length_m` beyond each runway end (owner RULINGS 2026-10-12q (1) (a); Doc 9157 §5.3.17 / CS ADR-DSN.B.180(b): the graded portion is defined about the runway centre line "and its extended centre line")
arc_rate     = { grade = 0.02, per_m = 30.5 }             # PROVISIONAL (§3.4.14 qualitative; owner question 2)
arc_rate_provisional = true
# THE STRIP BEYOND THE END (owner RULINGS 2026-10-12q (1) (a); Doc 9157 Part 1
# §5.3.2 / CS ADR-DSN.B.155(a) / Annex 14 §3.4.2 as the repo cites it): the
# strip extends 60 m beyond the runway end at code 2, 3 and 4; 30 m at code 1
# (the non-instrument figure — the instrument one is 60 m, and the engine has
# no instrument witness, so every code-1 runway takes the length that binds
# all of them).  Over this length the `longitudinal` cap above governs the
# ground; the RESA's `end_skirt.max_down_grade` only beyond it.  The planar
# stage breaks the zone-2 end band here (`planar/zones.py`) so the two slopes
# are expressible.  The band's own LENGTH stays the zone-2 half-width (NOT
# ruled: the RESA length is not built).
end_length_m = { by_code = { "1" = 30.0, "2" = 60.0, "3" = 60.0, "4" = 60.0 }, default = 60.0 }
# ... on an INSTRUMENT runway (owner RULINGS 2026-10-15k (1); Annex 14 §3.4.2:
# 60 m at every code).  Instrument status is the runway's witnessed CIFP
# approaches (`airport/cifp.read_cifp_approach_runways`; none -> non-instrument).
end_length_instrument_m = { by_code = { "1" = 60.0, "2" = 60.0, "3" = 60.0, "4" = 60.0 }, default = 60.0 }

[icao.end_skirt]
max_down_grade = 0.05                                     # beyond the strip's end (Doc 9157 §5.4.13 / CS C.230(a)(2); reg-set 08-08): FALLING ground only (RULINGS 2026-10-12q (1) (c)) — rising ground is bound by the take-off climb surface, `[icao.eat]` below with no tail height (`tables.runway_end_profile`)
# THE RESA beyond the strip's end, by code AND instrument status (owner RULINGS
# 2026-10-15k (1)): Annex 14 §3.5.2 requires a RESA at code 3/4 and at a code
# 1/2 INSTRUMENT runway, §3.5.3 at least 90 m; §3.5.4 recommends 240 m at code
# 3/4 (kept where the table already used it: code 4) and, for a code 1/2
# NON-INSTRUMENT runway, 30 m.  Until 15k this read 60 / 90 / 150 / 240 at
# every status (code 1 cited §3.5.3, which states no code-1 figure).
corridor_length_m = { by_code = { "1" = 30.0, "2" = 30.0, "3" = 90.0, "4" = 240.0 }, default = 240.0 }  # non-instrument
corridor_length_instrument_m = { by_code = { "1" = 90.0, "2" = 90.0, "3" = 90.0, "4" = 240.0 }, default = 240.0 }
rate           = { grade = 0.02, per_m = 30.5 }           # PROVISIONAL — Doc 9157 §5.4.13 / CS C.230(a)(2) are QUALITATIVE ("as gradual as practicable"); read by NOTHING while provisional (RULINGS 2026-10-12q (1): no number invented for ICAO)
rate_provisional = true

[icao.resa]
transverse_max = 0.05                                     # end corridor, symmetric ± (reg-set 08-08)

[icao.raoa]
length_m         = 300.0                                  # radio-altimeter operating area (Annex 14 Att A §4)
half_width_m     = 60.0
max_grade_change = { grade = 0.02, per_m = 30.0 }

[icao.eat]
# THE TAKE-OFF CLIMB SURFACE BY CODE (owner RULINGS 2026-10-15k (2); Annex 14
# Vol I Table 4-2): code 1 5 % from an inner edge 30 m beyond the runway end,
# code 2 4 % from 60 m, code 3/4 2 % from 60 m (EASA CS-ADR-DSN H.435 /
# Table J-2 + J.480(e) the same; v1 `config.py:5909-5913` carried code 3/4's
# figure for every code, as this table did until 15k).
slope     = { by_code = { "1" = 0.05, "2" = 0.04, "3" = 0.02, "4" = 0.02 }, default = 0.02 }
setback_m = { by_code = { "1" = 30.0, "2" = 60.0, "3" = 60.0, "4" = 60.0 }, default = 60.0 }

[icao.drainage]
# ICAO states no apron drainage minimum: the family is a no-op (08-13b/14).

# ── FAA AC 150/5300-13B ────────────────────────────────────────────────
[faa]
name = "FAA AC 150/5300-13B"
authority = "FAA"

[faa.runway]
longitudinal      = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # Table 3-2 / 3-3
end_zone          = { by_letter = { "C" = 0.008, "D" = 0.008, "E" = 0.008, "F" = 0.008 } }  # first/last quarter, AAC C-E; A/B: no rule
end_zone_fraction = 0.25
end_zone_max_length_m = 762.0                             # lesser of the quarter and 2,500 ft
end_zone_precision_only_codes = []
max_grade_change  = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
vertical_curve_k_m = { by_letter = { "A" = 91.4, "B" = 91.4, "C" = 305.0, "D" = 305.0, "E" = 305.0, "F" = 305.0 }, default = 305.0 }  # m per 1 % (§3.16)
vertical_curve_min_change = { by_letter = { "A" = 0.004, "B" = 0.004 }, default = 0.0 }  # below this no curve (AAC A/B, §3.16.1.1); 0 = always
transverse_max    = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
transverse_min    = 0.010
# THE FAA SHOULDER (owner RULINGS 2026-10-15l (3) "Follow regulations",
# superseding 13dd's 2.5 %; audit row 11): AC 150/5300-13B Table 3-6 S-2,
# runway shoulder transverse grade 1.5-5.0 %.  The cap is beyond the runway
# half-width (`tables.runway_transverse_bound`); the minimum fall is RECORDED
# like the crown's `transverse_min` — the transverse rows bound a magnitude.
shoulder_transverse_max = 0.05
shoulder_transverse_min = 0.015
# NO GRADE CHANGE IN THE END ZONES (AC 150/5300-13B §3.16.1, AAC C/D/E
# standard 2; audit §4 missing law M2, RULINGS 2026-10-15l (1)): within the
# lesser of the end quarter and 2,500 ft (`end_zone_max_length_m`) the
# profile changes grade by at most this (none at C-F; A/B: no rule).  The
# runway_vertical_curve rows there carry it as a PREFERENCE, yielding to
# the pins up to the curve bound like the end-zone cap (owner 2026-07-08).
end_zone_max_grade_change = { by_letter = { "C" = 0.0, "D" = 0.0, "E" = 0.0, "F" = 0.0 } }

[faa.taxi]
longitudinal = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # §4 taxiway family
transverse   = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }
transverse_min = 0.010
# THE TAXIWAY GRADE-CHANGE RATE (owner RULINGS 2026-10-15l (1); audit row 2):
# AC 150/5300-13B §4.14.1 (3)(b) — vertical curves of at least 100 ft
# (30.5 m) per 1 % of change, at every ADG; the 3 % maximum change of
# (3)(a) is implied by the 1.5 % longitudinal cap (spec M6).
curve_k_m = { by_letter = { "A" = 30.5, "B" = 30.5, "C" = 30.5, "D" = 30.5, "E" = 30.5, "F" = 30.5 }, default = 30.5 }
width_m = { by_letter = { "A" = 7.5, "B" = 10.5, "C" = 15.0, "D" = 23.0, "E" = 23.0, "F" = 30.0 }, default = 15.0 }  # AC 150/5300-13B taxiway width by ADG (I 25 ft … VI 100 ft) through the letter proxy (2026-09-06t; corridor reading withdrawn 06v)

[faa.strip]
longitudinal = { by_letter = { "A" = 0.020, "B" = 0.020, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # RSA = runway cap
arc_rate     = { grade = 0.02, per_m = 30.5 }             # §3.16.5 item 5
arc_rate_provisional = false

# THE RSA BEYOND THE END — CONFIRMED FROM THE PRIMARY TEXT 2026-10-12 (lane
# rwyend620: AC 150/5300-13B Chg 1 w/ errata, faa.gov PDF, §3.16.5 "RSA
# Grades" Standards items 2-5, p. 3-62, and Figure 3-35 "RSA Grade
# Limitations Beyond 200 feet (61 m) from the Runway End", p. 3-63):
#   2. first 200 ft (61 m) beyond the runway ends: longitudinal grade
#      between 0 and 3.0 percent, "with any slope being downward from the
#      ends" (no rise at all in the near zone);
#   3. beyond 200 ft: the maximum positive grade is such that no part of
#      the RSA penetrates any applicable approach surface or clearway plane
#      (the departure surface, `[faa.eat]` below with no tail height);
#   4. maximum negative grade 5.0 percent;
#   5. grade changes ±2.0 percent per 100 ft (30.5 m).
# Built as one profile by `tables.runway_end_profile` (owner RULINGS
# 2026-10-12q (1) (b)/(c)).
[faa.end_skirt]
near_zone_m          = 61.0                               # §3.16.5 item 2: the first 200 ft; also Table 3-6's transverse near zone
corridor_length_m    = { by_code = { "1" = 60.0, "2" = 90.0, "3" = 150.0, "4" = 240.0 }, default = 240.0 }  # governed end corridor (RUNWAY_END_CLEARANCE_LENGTH_BY_CODE; the repo keys it by ICAO code number under both authorities)
rsa_length_m         = { by_letter = { "A" = 73.2, "B" = 91.4, "C" = 304.8, "D" = 304.8, "E" = 304.8, "F" = 304.8 }, default = 304.8 }  # owner RULINGS 2026-10-15c (2) "Full safety-area length": AC 150/5300-13B App. G dim R "RSA length beyond departure end" (fabric-model-reg-set.md §3.1, Tables G-2 A/B-I 240 ft, G-4 A/B-II 300 ft, G-7..G-12 C/D/E 1,000 ft) through the letter proxy `half_width_faa_m` uses (A = A/B-I, B = A/B-II); no visibility column (master 2026-10-15). Measured from the runway END (App. G fn 9), the blast pad inside it
near_max_down_grade  = 0.03                               # §3.16.5 item 2: 0 to 3.0 percent, downward only
max_down_grade       = 0.05                               # §3.16.5 item 4
rate                 = { grade = 0.02, per_m = 30.5 }     # §3.16.5 item 5
rate_provisional     = false
# THE APPROACH SURFACE BEYOND THE END (owner RULINGS 2026-10-15m (1) "Lower of
# both"; audit row 5): §3.16.5 item 3 — no part of the RSA penetrates an
# applicable approach surface — read per END by its approach class
# (`RunwayEnd.approach`, RULINGS 15m (2) / 15n), each surface a slope from an
# inner edge measured from the THRESHOLD (the displaced length counts),
# AC 150/5300-13B Tables 3-2 to 3-4: visual 20:1 from the threshold;
# non-precision 20:1 from 200 ft (61 m); approach with vertical guidance
# 20:1 from 200 ft and Table 3-4 surface 6, 30:1 from the threshold;
# precision 34:1 from 200 ft (< 3/4 sm, the strict reading — no visibility
# witness, spec Q2) and 30:1.  The ground stays under the LOWEST applicable
# surface and under the 40:1 `[faa.eat]` surface (`tables.runway_end_profile`).
approach_surface = { visual = [{ slope = 0.05, from_threshold_m = 0.0 }], npa = [{ slope = 0.05, from_threshold_m = 61.0 }], apv = [{ slope = 0.05, from_threshold_m = 61.0 }, { slope = 0.0333333333, from_threshold_m = 0.0 }], pa = [{ slope = 0.0294117647, from_threshold_m = 61.0 }, { slope = 0.0333333333, from_threshold_m = 0.0 }] }

[faa.resa]
transverse_near_min = { by_letter = { "A" = 0.015, "B" = 0.015, "C" = 0.015, "D" = 0.015, "E" = 0.015, "F" = 0.015 }, default = 0.015 }  # Table 3-6 S-3
transverse_near_max = { by_letter = { "A" = 0.05, "B" = 0.05, "C" = 0.03, "D" = 0.03, "E" = 0.03, "F" = 0.03 }, default = 0.03 }
transverse_max      = 0.05                                # beyond the near zone

[faa.eat]
# FAA AC 150/5300-13B §4.12 / Order 8260.3 TERPS departure surface: 40:1
# from the departure end, no setback (v1 `config.py:5985-6015
# EAT_FAA_DEPARTURE_SLOPE / EAT_FAA_SETBACK_M`).
slope     = 0.025
setback_m = 0.0

[faa.drainage]
apron_min_grade       = 0.005                             # surface flatter than this fails drainage (08-13b/14: runways only crown)
apron_max_grade_change = 0.02
