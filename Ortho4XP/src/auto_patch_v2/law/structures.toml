# auto_patch_v2 LAW — structures: tunnels, bridges/decks, building pads,
# basins (Appendix A §3; rulings cited per key).  Metres unless a grade.
# A string value names a DATUM the constraint generator resolves (e.g.
# "dem" = the DEM sample at that vertex, "deck_top" = the object's deck).

[tunnel]
bore_datum_m      = 5.1     # the mouth wall node stands this above the ramp's mouth node (BRIDGE_ROAD_CLEARANCE_M; 09-03b)
wall_gap_m        = 0.6     # an OSM BORE's ramp edge -> its at-grade rim, together with wall_band_width_m (09-01c/e; superseded for OBJECT corridors by [cutout], 2026-09-06)
crest             = "dem"   # wall crest = DEM all the way round the ramp, one corridor-top value per station (09-03b L1)
admitted_values   = ["yes"]   # spec 26 (RULINGS 2026-09-11aq item A): the ONLY `tunnel` values that seed a bore. `building_passage` (a road under a building — LEMD's old terminal, 10 of 33 covered bores), `culvert`, `avalanche_protector`, `flooded` and `no` are NOT bores; the passage belongs to the building's pad
ramp_max_grade    = 0.080   # descent grade of the ramp (common.roles.tunnel_ramp; RULINGS 2026-09-12m owner: the road cap, was 0.040 user 2026-05-08) — never above that role cap (checked at load)
mouth_standoff_m  = 150.0   # spec §29 (1) (owner RULINGS 2026-09-12r; Fable 12t): a MOUTH is built only where it stands ON THE FIELD — inside the classified cover grown by this. The test is the mouth point OR its ramp reach. 150 m (round 3): the MEASURED population of on-field highway mouths at LEMD ends at 146 m and the next drop is 208 m, so 150 sits in the natural gap (RULINGS 2026-09-12aa set 100 off the nearest EIGHT drops, which kept only three of the five); the rail mouths are 4,000 m out. Admission is CONJUNCTIVE - a bore is built only if it ALSO passes under a classified cell (LEMD's 4.9 km rail bores were admitted by 125–162 m of cover under one pad and built their far mouths 4.0 km west of the field)
ramp_cuts_runway_family = false   # ramp wins over pavement but NEVER cuts the runway family (08-25)
ramp_crosses_pad = false          # ramp walls are their own cut, never across a building pad (08-25)
wall_band_width_m = 1.0     # an OSM BORE's rim stands wall_gap_m + this off the ramp edge (the mesh wall's plan thickness where no object states a wall; 09-01c's band width, kept as the rim stand-off since [cutout] emit_wall_band = false, 2026-09-06)
lane_width_m      = 3.5     # carriageway width per mapped lane when the way carries no `width` tag (the ramp footprint is the carriageway, 2026-08-30 "ONE ramp surface")
default_lanes     = 2       # lanes assumed for a mapped way with neither `lanes` nor `width`
# THE RAMP WIDTH FROM THE PAVEMENT (RULINGS 2026-09-06b (2)): where an apt.dat /
# DSF pavement traces the road through an OSM ramp, that pavement's width IS
# the ramp width per station — wider or narrower than lanes × lane_width_m.
ramp_width_source = ["pavement", "lanes"]   # in order: a pavement cell containing the station whose across-axis centre lies within ramp_pavement_max_offset_m of the axis and which runs ALONG the axis (contains the neighbouring stations) sets the station's edges; else the way's width / lanes
ramp_pavement_max_offset_m = 2.0            # the axis stands this close to the pavement's across-axis centre at the station (the pack traced THIS road; a pavement the axis merely crosses or skirts is not the ramp)
dual_carriageway_max_separation_m = 40.0   # two bores whose mouths stand closer than this with parallel approaches are ONE ramp spanning both (2026-08-31h "dual carriageways are one ramp")
max_ramp_length_m = 600.0   # a ramp that cannot reach the DEM at ramp_max_grade within this is refused loudly (never a shallower ramp)
# THE APPROACH WALK KEEPS ITS HEADING (spec §34 (2); Fable 2026-09-13i,
# RULINGS 2026-09-13i item 7a).  At a node where the mapped way it entered
# ENDS the walk takes the continuation with the SMALLEST turn from its
# arrival heading, and refuses one over this — an unrelated road meeting the
# approach at a junction is not the road the ramp is on.  A way's OWN nodes
# are never a hop (a mapped hairpin turns gradually and is walked whole), so
# this never shortens a mapped route.  60 deg: the measured LEMD population
# of real continuations sits under 34 deg (7b's -15328 at 2.3, its refused
# neighbour -15331 at 33.3), and a genuine road bend at a way boundary
# (a T on a service loop) stays under 60.
approach_turn_max_deg = 60.0

[tunnel.object]                     # RULINGS 2026-09-05k-1 / 05n: the pack's tunnel wall OBJECTS are the tunnel authority; round 2 = ground-referenced ramps inside the walls
source_precedence   = ["object", "osm"]   # applied PER MOUTH (05n-3): an OSM bore mouth inside an object's trench or wall band is the object's (its OSM ramp is not built); a mouth outside every object keeps its OSM ramp exactly as before
plate_datum         = "ground"      # the wall's top plate is FLUSH with the ground at the wall (05n-4); the object is re-seated to it
mouth_depth         = "floor_slab" # RULINGS 2026-09-08l/08o: the trench depth = the object's FLOOR SLAB (a near-horizontal plate at the model's bottom running along the axis, plate_min_area_m2) when it carries one — depth = crest − slab; else tunnel.bore_datum_m for EVERY mouth kind (bore / closed / family). NEVER the crest-to-anchor height (plate_y is the author's origin handle: OTHH's two mouths of ONE bore read 5.0 and 10.0 by it). The crest stays the seat datum (05n-4).
ramp_end            = "wall_end"    # the ramp reaches ground at the far end of the wall, extended beyond it only where ramp_max_grade needs the length (05n-1)
trench              = "inner_walls" # trench = the region between the walls' INNER faces, following their curves; the wall band = each wall's own plan footprint (05n-2); never a hull rectangle
wall_face_max_thickness_m = 2.0     # a wall solid's plan thickness; thicker plan solids are decks/slabs, not walls (OTHH: 1.0-1.1 m side walls, 2.0 m box walls)
wall_sample_m       = 2.0           # station spacing along a wall line
mouth_end           = "bore"        # the deep end = the end whose axis continues into an OSM tunnel way (bore); else the end facing the other placement of the same family; else the closed end
reseat              = true          # the re-bake seats every tunnel-object family so its plate sits at the ground (delta = ground - rendered plate); never excluded
skirt_min_depth_m   = 3.0           # genuine solids must reach this far BELOW the seat for a wall skirt (OTHH: 10-15 m)
plate_normal_y_min  = 0.7           # reuse of deck_plate_normal_y_min: a crest face is near-horizontal
plate_bin_m         = 0.5           # crest plane = the largest-area bin of plate faces at or above the seat
plate_min_area_m2   = 100.0         # below this the object is not a wall (a bollard, a kerb)
plate_min_height_m  = 2.0           # a FULL tunnel wall's crest stands this far above the seat (its plate height is the depth: mouth_depth = "plate")
# THE EDGE WALL (RULINGS 2026-09-06c (2)): an object with a wall skirt
# (skirt_min_depth_m), a crest plate LOWER than this above the seat, no
# floor plate and no roof is an EDGE-WALL object — it gives the ramp its
# PLAN (the curve, the width between the walls) with the crest FLUSH at
# grade (05n-4, the re-seat), and the DEPTH comes from the tunnel law:
# the OSM bore's bore_datum_m at the mouth, since the wall does not state
# it.  Precedence per mouth (05n-3) unchanged: the bore mouth inside the
# edge walls is the object's.  An edge wall with NO bore mouth has no
# depth authority and is refused by name.  Below this the object is an
# edge wall, at/above plate_min_height_m a full wall; a crest between the
# two (only when this key is set under plate_min_height_m) is a kerb.
edge_wall_max_plate_m = 2.0
# THE CREST IS THE TOP BAND WHEREVER IT LIES (RULINGS 2026-09-06f (1088)): the
# seat is the author's handle, not a datum.  LEMD's Bridge4.obj (one component,
# 660 vertices, 76 × 144 m in plan) is AUTHORED y 0 … 2.02 (its base on the
# seat plane; the live file v1 had baked to −2.88 … −0.86) and was refused
# silently: no skirt below the seat.  A wall whose skirt below the seat is
# shallower than skirt_min_depth_m reads its crest as the TOPMOST plate-worthy
# band of its near-horizontal faces (plate_min_area_m2 at plate_bin_m), above
# or below the seat, and is an EDGE WALL when its solids reach this far below
# THAT crest; the re-seat (05n-4) puts the crest flush at grade.  A full
# wall's skirt (skirt_min_depth_m) stays measured from the seat, and
# edge_wall_max_plate_m keeps its 06c meaning over a full skirt.
edge_wall_min_skirt_m = 1.5
# THE WALL SIGNATURE (RULINGS 2026-09-09w (2)): a crest plate is admitted
# only when the skirt that admitted it — skirt_min_depth_m under the SEAT
# for a full wall, edge_wall_min_skirt_m under the CREST for a shallow-seat
# edge wall (06f) — stands under at least this share of the plate's
# PERIMETER (every ring of every plate polygon, sampled every wall_sample_m,
# a wall face within wall_face_max_thickness_m in plan).  A tunnel wall's
# crest IS the top of its walls, so its skirt runs under all of it (measured
# OTHH: 8 tunnels at 100 %, LEMD's Bridge4 edge wall 100 %); a terminal slab
# at +9 m over a floor has deep solids elsewhere in the file and reads 0 %
# — a roof, refused by name.
skirt_perimeter_min_fraction = 0.5
bore_end_tolerance_m = 5.0         # RULINGS 2026-09-08o: a mapped bore END within this of the walls' plate is that object's mouth (OTHH: the bore's end stood 4.1–4.5 m outside the deep object's plate, beyond end_cap_open_m, so the object read "closed", the OSM mouth was refused for overlapping it and the closed-end fallback cut the crest-to-anchor depth); the OSM mouth PAIRS with the corridor instead of being refused
# THE THIN-PLATE WALL CLASS (spec §33 (2); owner RULINGS 2026-09-13d item 5
# "use object based wall objects provided by the scenery package ... as a
# guide for where the tunnel mouth is and what size it is"; Fable
# 2026-09-13i).  LEMD's pack models its bridges and tunnel walls as THIN
# PLATES — Bridge3.obj 354 x 25 m spanning the whole of bore -5931 with
# 1.03 m of solids, Bridge2.obj 168 x 90 m over two bridge ways at 1.31 m,
# Bridge1.obj 1.50 m — which the wall pre-screen refuses below
# least_skirt = min(skirt_min_depth_m, edge_wall_min_skirt_m) = 1.5.  A
# pack object whose plan footprint lies over a mapped bore (tunnel=yes) or
# deck (bridge=yes) for hull_min_length_m and whose solids span at least
# this is an AUTHORED CORRIDOR: its plan ring gives the corridor's axis,
# width and PORTAL POSITIONS (the object's ends); the depth stays
# tunnel.bore_datum_m for a bore, and for a deck the deck's top is the
# object's authored top WHERE THE PLACEMENT CARRIES AN ABSOLUTE SEAT
# (OBJECT_MSL) — a DRAPED placement's authored top is an offset over the
# solved ground, no datum at all, and the deck's ends govern (§33 (4)).
thin_plate_min_m    = 1.0
hull_min_length_m   = 10.0          # the plan hull's long side; shorter is a stub, refused loudly
end_cap_open_m      = 2.0           # a hull end with no solid within this of the end line is an OPEN end (a mouth); a closed end is a dead wall; also the tolerance for a bore end standing at a wall end
merge_gap_m         = 3.0           # two corridors whose ground ends face within this are reported as one site (they are refused as overlapping structures, never merged into a hull)

[cutout]                            # RULINGS 2026-09-06b (1) + 2026-09-08a: every below-grade OBJECT's trench = floor + at-grade rim INSIDE the wall, NO wall band
# The owner's law: the trench floor slightly OVERLAPS the object's inner
# perimeter (walls have width), a very small gap, and the surrounding at-grade
# terrain follows the object's OUTER perimeter at its outside edge; nothing is
# emitted between them — the mesh makes the near-vertical wall.  Measured
# OTHH 2026-09-06 (this lane): tunnel side walls 1.00 m plan thickness, end
# walls 2.00-2.53 m, the box 2.00 m; drainage pit shells 0.75-0.77 m
# (Drainage_0x_001, area/perimeter of the at-grade ring); the two Dewatering
# shells read 0.25/0.55 m by the same estimate, under what the 0.5 m identity
# grid can express.  RULINGS 2026-09-08a (owner: the gap between wall and ramp
# leaves a visible hole where the terrain drops; the drop must be hidden inside
# the wall objects): the rim moves INSIDE the wall's footprint — it stands
# rim_inset_fraction x the wall's MEASURED plan thickness inward from the outer
# face (side walls 1.00 m -> 0.50, end walls 2.0-2.5 m -> 1.0-1.25, drainage
# shells 0.75 m -> 0.375), and its plan stand-off from the floor ring (= the
# mesh wall band's width) is max(t - floor_overlap_m - inset, the identity
# spacing emit.identity.min_distinct_spacing_m): a rim vertex is never closer
# to the floor ring than two distinct vertices may be.  Where that floor binds
# (t < floor_overlap_m + spacing = 0.8 m) the rim stands 0.8 m outside the
# inner face — at or outside the outer face of a thin shell (spec §1a).
floor_overlap_m     = 0.3           # the floor extends this far OUTWARD past the object's inner perimeter, into the wall's own footprint (unchanged by 09-08a)
rim_inset_fraction  = 0.5           # the at-grade rim stands this fraction of the wall's measured plan thickness INSIDE its outer face (09-08a; was rim_gap_m = 0.3 OUTSIDE it)
emit_wall_band  = false             # no wall face is emitted between floor and rim: the rim is a constrained ring (o4_feature=structure_rim), the mesh triangulates the wall (only false is generated)

[cutout.door]                       # RULINGS 2026-09-08b/c LAW A — THE DOOR RAMP (spec othh-terminal-ramps-spec.md §2)
# Where a below-grade floor plate of an object REACHES ITS EXTERIOR FACE (the
# plate boundary leaves the object's own at-grade geometry: a basement access
# door, not a basement), cut a trench of the sill's width from the sill up to
# grade at ramp_grade, OUTSIDE the building only, along the outward normal of
# that face.  The well floor = the sill plate ⊕ floor_overlap_m (flat at the
# sill); the rim per 09-08a inside the well's walls; beyond the well the OSM
# ramp law's stand-off (as an object corridor beyond its walls).  Measured
# OTHH (scout othhterminal): six wells, sills 1.57-1.70 m under the ground,
# 3.7-5.2 m wide, under the 2.5 m basin gate — nothing was emitted.
sill_min_depth_m = 0.5              # the door's own gate (a sill shallower than this is a threshold, not a door); separate from basin.admission_depth_m
sill_min_width_m = 1.0              # narrower is a drain / a duct, not a door
sill_max_width_m = 6.0              # RULINGS 2026-09-08j: WIDER is a service yard or a sunken parking pit, not a basement access door (OTHH's six wells read 3.7-5.7 m; the letter of the 08c law admitted 8-15 m parking pits at OTHH and 18-38 m service yards at LEMD) — refused loudly until the owner rules on yards
exit_max_fraction = 0.5             # the well's rectangle side OPPOSITE the face (the ramp's exit) lies under the family's above-band solids (obj8.above_grade_footprint, basin.contact_band_m) over at most this share of its length; more is a covered slot (OTHH Terminal_Parking_006's light slots), never a door.  The FACE is the well's longer side nearer the MASS of the family's above-band solids around it (the building; the ramp leaves away from it).  OPEN (lane v2doorramp): OTHH's car-park wells are closed four-walled boxes hanging from the facade lattice, the door a texture on the building-side wall — no pack geometry names the door side; the building's mass is the last discriminating signal
ramp_grade       = 0.08             # the climb beyond the well: a 1.70 m sill -> 21 m (the owner's "small ramp"; the pack's own geometry implies >= 7.5 %: the nearest road 22.8 m away); <= the door_ramp role cap (rulesets.toml), checked at load.  ALSO the sill test: a plate descending at or under this over its reach is a ramp of the object's own (OTHH Terminal_Parking_006's 21 m car-park ramp loop at 5 %), never a sill — a well's steps down to its door are far steeper
max_length_m     = 25.0             # a climb that cannot reach the ground within this is refused loudly, never a shallower ramp
station_m        = 2.0              # ramp station spacing along the climb (the top station stands one station past where the climb meets the ground)
seat             = "none"           # the door family is NEVER re-seated by its trench (spec §2: a floor_plate seat would move all 35 members of OTHH unit:22); members standing > basin.contact_band_m under the mesh are facility members (05p/05q) and keep their authored y

[cutout.sunken_road]                # RULINGS 2026-09-08b/c LAW B — THE SUNKEN ROAD under the building (spec §3)
# A floor plate below the seat that is ROOFED (the tunnel-object signature's
# and the basin pass's refusal) whose plate reaches within basin.contact_band_m
# of the ground at one end is a SUNKEN ROAD: that end is the mouth; the trench
# = the plate ⊕ floor_overlap_m along its axis, the floor = the plate's OWN y
# per station (OTHH TerminalRoads_03_000 / 02_000: 183 m at 1.7 % down to
# 3.1-3.2 m), cut only to max_depth_m — deeper is the underground road, the
# terrain stays (a terrain end wall across the road at that station, hidden
# by the object's own tube); the rim inside the wall (09-08a); the deck above
# untouched (the roof is the object).  Read per ANCHOR FAMILY (the roof and
# the deep continuation are other members of the same anchor).
max_depth_m      = 4.0              # the cut ends where the plate reaches this depth under the local ground
top_depth_m      = 0.1              # the trench's top station: the first station (from the deep end) at which the plate lies within this of the ground — the floor there is the plate's y, the rim converges to it
min_descent_m    = 1.0              # the plate descends at least this between its grade end and its deep end (a kerb dip is not a sunken road)
min_plate_m2     = 200.0            # a connected near-horizontal plate smaller than this is not a road (a ramp panel, a step)
roof_min_fraction = 0.5             # the plate lies under the family's own above-band solids (basin.contact_band_m; obj8.above_grade_footprint) over at least this share of its area — a sunken road is ROOFED (spec §3 "a floor plate below the seat that is ROOFED"); less is an open ramp the tunnel / basin laws own (measured OTHH: the bus bridges' bank plates 16-20 % under their decks, 1.8 m deep, would otherwise be cut)
station_m        = 10.0             # station spacing along the plate's axis (the profile is sampled here; the within-shape law prices every ring pair)
seat             = "none"           # the family is NEVER re-seated by its trench (spec §3: unit:26's 399 members stay)

[cutout.wall_corridor]              # RULINGS 2026-09-08m/08n LAW C — WALL-BOTTOM FLOOR corridors (spec othh-terminal-ramps-spec.md §6)
# The pack models the terminal's road underpass, its loading bays and its
# garage entry ramps as KERB WALLS only: components of VERTICAL faces only,
# reaching under the ground, NO floor at any depth (measured OTHH scout
# othhunderpass: Terminal_Base_2_5 comps 799/800, two 77.8 m bands y −1.888..
# +0.587, inner faces 9.84 m apart, a deck at +2.61 over 74 % of them; the
# loading bay Terminal_Base_2_1 comps 3176/3179 + a Base_4 end wall, 6.3 ×
# 9.75 m, 1.35 m deep).  Every floor-plate reader sees nothing there.  LAW C:
# per ANCHOR FAMILY a genuine component of vertical faces only reaching
# min_wall_depth_m under the ground is a WALL BAND; two bands parallel within
# parallel_max_deg whose inner faces stand min_width_m..max_width_m apart and
# overlap min_wall_length_m along the axis form a CORRIDOR (tunnel_walls
# kind "II"); the FLOOR is the walls' BOTTOM edge PER STATION (08n: level —
# the underpass, the bays — or DESCENDING — a garage ramp: the wall bottom
# runs from grade down to the garage floor, cut AS AUTHORED, the mouth where
# it meets grade, the deep end closed by the garage; the ramp laws (8 %)
# do not gate a pack-authored ramp, max_authored_grade refuses loudly above
# it); an end is CLOSED when a family vertical face crosses it within
# tunnel.object.end_cap_open_m (over end_cap_cover_min of the end line), else
# a MOUTH with a synthetic ramp beyond at ramp_grade; a ramp that would enter
# AIRSIDE pavement STOPS at the pavement edge and steepens up to
# max_ramp_grade (airside is king); a service road across a ramp yields onto
# it (the groundside terrace law); the headroom test replaces the basement
# cover gate; the deck above is untouched; the rim per 09-08a; seat = "none".
mouth_depth        = "wall_bottom"  # the floor = the walls' bottom edge per station (08m; 08n per station)
min_wall_depth_m   = 1.0            # a band reaches this far under the local ground (OTHH: 1.35–1.89 m)
parallel_max_deg   = 5.0            # two bands of one family are a pair when their long axes agree within this
min_width_m        = 6.0            # inner faces at least this apart (OTHH: 9.75–9.84 m)
max_width_m        = 20.0           # ...and at most this (wider is a yard between two fences)
min_wall_length_m  = 5.0            # the bands overlap at least this along the axis (OTHH's shortest bay 6.15 m)
merge_gap_m        = 10.0           # parallel bands of one family within tunnel.object.wall_face_max_thickness_m of each other laterally and interrupted by at most this along the axis are ONE wall (a kerb split at a crossing or a pier: OTHH TerminalRoads_Parking_004 comp 1 = 80 + 62 m runs; the Terminal_Base_9_6 floor-to-deck panels 0.6–0.9 m inside the 2_5 kerbs are those walls' faces)
end_cap_cover_min  = 0.5            # a family vertical face within end_cap_open_m of an end line covering this share of it CLOSES the end
# RULINGS 2026-09-10ad — the groundside-mouth clause (10z (b''), key
# corridor_mouth_road_m) is DELETED: it separated LEMD's cargo foundations
# from OTHH's kerb corridors not at all (10ab).  Law C's admission is the
# AUTHORED depth alone, read in the object's SEATED frame (10u, 10ad).
# RULINGS 2026-09-10ab — the ROUND-4 discriminators, measured per candidate
# before any of them is a gate: (i) FLOOR-vs-ROAD — the nearest road within
# corridor_road_level_m of a mouth, its LEVEL there (Ortho4XP's own longitudinal
# clamp on its centreline: a levelled road profile; the DEM where the core levels
# nothing) minus the corridor's floor at that mouth: a road can ENTER a corridor
# whose floor it meets within corridor_floor_road_tol_m, or reach it at
# max_ramp_grade over the corridor's length; (ii) FLOOR SLAB — a horizontal plate
# of the family thinner than corridor_floor_slab_max_thickness_m lying within
# corridor_floor_slab_tol_m of the floor between the walls over
# corridor_floor_slab_cover_min of the length.
corridor_road_level_m               = 40.0  # the level probe's window round a mouth (the 10z road window widened for the reading)
corridor_floor_road_tol_m           = 1.5   # |road level - floor| within this = a road enters this corridor at its floor
corridor_floor_slab_max_thickness_m = 0.5   # a component thinner than this can be a floor slab (a wall is not)
corridor_floor_slab_tol_m           = 0.5   # ...lying within this of the floor
corridor_floor_slab_cover_min       = 0.5   # ...over at least this share of the corridor's length
min_headroom_m     = 3.5            # the lowest near-horizontal face over the corridor stands this far above its floor (OTHH: 4.3–4.5 m); less is refused by name (replaces the basement cover gate for corridors)
ramp_grade         = 0.08           # the synthetic climb beyond a mouth (the door ramp's grade, 08m): 1.89 m → 23.6 m
max_ramp_grade     = 0.10           # ...steepened up to this where the climb stops at airside pavement (08m (a): site 1's NE ramp 18.9 m); refused loudly above; = the wall_corridor_ramp role's cap (rulesets.toml), checked at load
max_authored_grade = 0.25           # a descending wall bottom steeper than this between stations is refused loudly (08n: a sanity cap, never a ramp law); = the garage_ramp role's cap, checked at load
station_m          = 2.0            # ramp station spacing beyond the walls (the walls' own stations are tunnel.object.wall_sample_m)
seat               = "none"         # the family is NEVER re-seated by its trench (the terminal's 399 members)

[bridge]
clearance_m         = 5.1   # deck needs this above the ramp under it; ramp climbs beyond (08-28 :1931)
clearance_minimum_m = 4.2   # BRIDGE_ROAD_CLEARANCE_MINIMUM_M — below this the deck is unlawful
# THE END'S GROUND IS READ ALONG THE ROAD (spec §34 (6); Fable 2026-09-13i,
# RULINGS 2026-09-13r's owed refinement).  A mapped way STOPS at the surface
# it runs onto — OSM does not trace a service road across an apron — so the
# governed cell a terrain deck's end MEETS stands a few metres past the last
# node.  A cell within this of the end (no cell under it) is that end's
# ground, and §33 (4)'s relational row then takes its SOLVED value, not the
# DEM under it.  25 m: measured LEMD way -6288's east end stands 13.3 m from
# apron pav92 (solved 606.60 against a DEM of 606.10 at the node); the next
# governed cell at any LEMD deck end is 72 m away, so 25 sits in the gap.
deck_end_reach_m    = 25.0
deck_datum          = "deck_top"   # object seating datum = deck TOP (memory othh-bridge-deck-datum-r12)
mapped_deck_cuttable = false       # a mapped road bridge over emitted below-grade is a deck, not cuttable (08-28 :1908)
terrain_deck_without_object = true # no object => terrain deck at road level cutting the ramp (08-28 :1920)
# THE DECK SIGNATURE BY GEOMETRY (RULINGS 2026-09-04k; lane v2deck, M6b) for
# objects carrying NO ATTR_hard_deck (OTHH's Bridge_0x: 0 hard triangles):
# ATTR_hard_deck stays the PRIMARY signature; a family (one anchor spelling)
# with no flagged member is read for a PLATE — the family's dominant plane of
# near-horizontal solid faces standing deck_min_elevation_m or more above the
# family's lowest feet — that SPANS something the terrain cannot carry: a
# mapped bridge way (highway/railway, bridge != no) crossing it, or an emitted
# below-grade region (basin / tunnel ramp) under it.  A roof or a canopy is a
# plate too; the spanning evidence is what refuses it (and, after the mesh, the
# clearance under the seated deck's mid-span: deck_min_clearance_under_m).
deck_plate_normal_y_min = 0.7      # a solid face is a plate face when |normal_y| reaches this (NEAR_HORIZONTAL_NORMAL_Y_MIN; v1 _classify_bridge)
deck_plane_bin_m        = 0.5      # plate faces are binned by their mean authored height this coarse; the family's DECK PLANE is the largest-area bin (PLANE_HEIGHT_BIN_M; v1 _dominant_height_plane — the reading behind the R12 seats the owner accepted)
deck_plane_area_tie     = 0.9      # bins within this fraction of the largest bin's area TIE and the higher one is the deck top (a slab's underside equals its top in area; OTHH's five families have no second bin above 83 % — Bridge_01's 3.5 bin against its 3.0 bin)
deck_min_area_m2        = 200.0    # the deck plane's total face area across the family (BRIDGE_MIN_DECK_AREA_M2)
deck_min_span_m         = 10.0     # a member's plate must run at least this along its long axis to carry abutment end lines (a 2 m² kerb piece founds nothing)
deck_min_elevation_m    = 2.0      # the plane stands at least this above the family's lowest feet — a slab on the ground is not a deck (BRIDGE_DECK_CARRIED_MIN_HEIGHT_M)
deck_close_m            = 1.0      # a member's plate faces are closed at this before its axis is read (BRIDGE_DECK_CLOSE_M)
deck_profile_bin_m      = 10.0     # the deck-top profile along the axis: max face corner per bin (BRIDGE_PROFILE_BIN_LENGTH_M)
deck_way_cover_min      = 0.5      # a mapped bridge way CARRIES a plate when its pieces inside the plate's rectangle project this much of the plate's length along its axis (OTHH: Bridge_05 0.97, _04 0.84, _01 0.67; a way crossing the 466-member TerminalRoads/Terminal_Base slab family transversally reads 0.02 — the slab is no deck)
deck_way_carried_area_min = 0.5    # ...and the plates so carried hold at least this share of the family's deck plane: the way carries THE DECK (OTHH Bridge_01 71 %, _04 95 %, _05 88 %, the 02/03/06 interchange 72 %; Terminal_Parking 2 % — one 90 m kerb road beside 50,000 m² of parking slabs, a mosque on them: no deck, the feet law)
# THE PAVEMENT DECK (RULINGS 2026-09-06f (1088)): an apt.dat / DSF pavement
# cell of these role FAMILIES (precedence.toml [roles].family) that SPANS a
# tunnel corridor — crosses it wall to wall with the corridor continuing on
# both sides — is a DECK over the ramp (the terrain-deck machinery: the ramp
# severed under it at the mouth datum, bridge.clearance_m under the deck,
# the climb resuming beyond), never a cut through the pavement; the deck
# piece keeps the pavement's role and is named bridge_deck:<its ref>.  Read
# INSIDE an object corridor's walls too (a mapped bridge way inside the walls
# is still not read: the walls are the object's).
pavement_deck_families  = ["taxi"]
deck_spanning_evidence  = ["road_bridge", "below_grade"]   # what a plate must span to be a deck: a mapped bridge way over it, or an emitted below-grade region under it (04k "the deck spans a below-grade cut/road")
abutment_sample_step_m  = 5.0      # the abutment grade is sampled along each deck-end line this far apart (_ABUTMENT_GRADE_SAMPLE_STEP_M)
abutment_walk_max_m     = 60.0     # a deck end whose samples are water WALKS LANDWARD along the axis, one step at a time, up to this (R12 amendment 1: _ABUTMENT_LAND_WALK_MAX_M — far enough to clear OTHH's canal bank, short enough to be the bridge's own shore)
abutment_min_land_samples = 4      # ...until this many land samples stand on the line (_ABUTMENT_LAND_MIN_SAMPLES)
deck_stations           = 32       # near-horizontal faces of the plate's own components, spread along the axis, that the clearance test samples (a witness set)
# THE ELEVATED DECK — the CROSS-PLACEMENT GROUPING GATE (owner RULINGS
# 2026-09-11a; spec §17.5): a body groups across placements only when it is a
# DECK ON PIERS — a plate elevated over its own lowest solid, whose GROUND-
# CONTACT FOOTPRINT (the plan trace of the solid faces that reach within
# [basin] contact_band_m of that floor, closed at deck_pier_close_m and its
# holes filled: what the resource actually stands on) is a small fraction of
# the plate it carries.  A BUILDING fails it by construction — its walls trace
# the whole plate back onto the ground (LEMD OldTerminal P2CNX 1.48, LEMD84
# 1.35, LEMD60 1.06, LEMD38 0.26) — where a viaduct's piers do not (LEMD
# Terminal4_green-STRT4 0.088, LEMD02 0.125, OldTerminal STRT1 0.049).
deck_plate_connected_min = 0.50     # ...and the plate must be ONE piece: the largest connected piece of its filled plan trace over the whole of it.  A DECK IS ONE CARRIAGEWAY (LEMD STRT4 1.00, LEMD02 1.00); a resource holding a SCATTER of small plates (OldTerminal_FSX-VRDCH: 279 fence panels on posts, 0.03; Terminal4-LEMD01: 1,059 pieces, 0.05) is not one deck, and against its file-wide floor every panel would otherwise read as a plate on piers
deck_pier_footprint_max = 0.20     # the ground-contact footprint over the plate footprint, at or under which the plate is CARRIED (on piers) rather than WALLED: the elevated-deck gate
deck_pier_close_m       = 0.5      # the ground-contact faces' plan traces are buffered this much before the union (a wall is a zero-area plan sliver; this is what makes it a ring, and what fills a pier's outline)
deck_min_clearance_under_m = 1.0   # AFTER the seat: the mesh under SOME station must lie this far under the seated face there, or be water — a plate whose every station stands on the ground it covers spans nothing (a canopy, an elevated kerb road on columns: OTHH Terminal_Parking); the deck seat is refused with a finding and the feet law governs

[building_pad]
weld_to_touching_pavement = true   # contact = value (09-01g)
footprint_outside_pad_m   = 0.0    # NO footprint outside the pad — outline close retired (09-01g)
groundside_cutback_m      = 0.6    # mixed pad: welds airside, groundside cut back and may differ (09-01i, 01e standoff)
min_area_m2               = 250.0  # tiny pads fold into their host (08-24 :1687; PAD_MIN_AREA_M2)
in_basin_sits_at_floor    = true   # a pad inside a basin sits at the basin floor (08-25 :1771)
step_exemption_pad_to_pad = true   # two pads may sit at different floors (06-20 STEP_EXEMPTIONS)
frontage_near_miss_m      = 1.0    # a soft-pavement ring edge within this of a pad, unshared with it, is a FRONTAGE across a sliver: each endpoint holds the apron cap over its own distance to the pad (BUILDING_FRONTAGE_NEAR_MISS_M; 08-08, cycle-5 item 6; SPJC building29 0.68 m source offset)
frontage_soft_roles       = ["apron", "junction"]   # the soft-pavement roles the frontage law binds across the sliver (NEAR_MISS_FRONTAGE_SOFT_ROLES)

[skirt]                             # RULINGS 2026-09-10af/10ag (spec design-surface-spec.md §22) — A FOUNDATION SKIRT: the object's below-zero geometry, uniform across its footprint.  A SKIRTED building needs NO PAD (it sits on the sloping ground, high side buried, low side exposed); a road-width below-zero cut is a CORRIDOR (Law C's narrow-cut test reads the same reader, airport/skirt.py)
perimeter_fraction  = 0.5           # the share of the footprint's PERIMETER that must carry below-zero geometry for it to be a skirt (10af proposes 0.5); a door well or corridor meets the rim only at its ends and reads far less
depth_tolerance_m   = 0.5           # ...and those perimeter pieces must agree in depth within this ("uniform across its bottom"); a wider spread is several features, not one skirt
min_depth_m         = 0.3           # a below-zero extent shallower than this is a LIP (a kerb, a sill), never a foundation — the basin thickness gate's scale
edge_tolerance_m    = 0.5           # how close a below-zero piece must lie to the footprint's exterior to count as ON the perimeter (an exporter's inset wall face)
pad_cover_fraction  = 0.5           # a candidate pad is dropped only when skirted placements' footprints cover at least this share of its area (a lamp post on a terminal pad neither carries nor vetoes the drop)
drops_pad           = true          # 10ag: a skirted building mints no flat pad, as long as the pad's DEM relief is within the skirt depth s; false = every pad stands as 09c/10y leave it
seat_low_side       = true          # 10ag (2): a body every one of whose members is skirted seats at its LOW-side foot (min over the feet), never 10i's median — the median would float the low side by half the relief; false = 10i's median everywhere

[basin]
# THE FLOOR LAW (RULINGS 2026-09-06b (3), superseding 08-26's err-deep
# margins): floor = the RENDERED floor plate — DEM(anchor) + agl + the deepest
# genuine solid's y (thickness-gated) — and the anchor family is re-seated
# after the mesh so the plate lands ON that floor (seat = "floor_plate").
# The trench = the floor plate ⊕ cutout.floor_overlap_m; the rim = the shell's
# at-grade footprint ⊖ cutout.rim_inset_fraction x the shell's thickness (09-08a);
# no wall band (cutout.emit_wall_band).
# ADMISSION IS BY THE OBJECT'S OWN GEOMETRY (RULINGS 2026-09-04i, 04f-2/3):
# a region is admitted when it is a CLOSED below-grade region (its rim reaches
# grade all round) with a GENUINE SOLID FLOOR (a thickness-gated component
# carrying near-horizontal solid faces admission_depth_m or more under the
# local ground).  Every refusal names its reason: no floor (a skirt), an open
# rim (a ramp into a bore/garage), a basement (a floor wholly under the same
# object's own above-grade solid — the building's pad governs), the runway
# family, a tunnel structure.  min_area_m2 and max_covered_fraction are
# REPORTED DIAGNOSTICS, never refusals ("an area floor or covered-fraction
# constant that refuses a real drainage bowl is a defect, not a law").
floor = "deepest_solid"            # the floor key: the facility's deepest genuine solid AS RENDERED (DEM(anchor) + agl + y) — the floor plate itself, no margin (RULINGS 2026-09-06b (3): "the floor = the rendered floor plate"; 08-26's err-deep margins retired with the plate seat below)
seat  = "floor_plate"              # the basin's anchor FAMILY is re-seated after the mesh so its rendered floor plate lands ON the trench floor (delta = floor − (mesh(anchor) + agl + plate y)); an anchor INSIDE its own trench otherwise renders the object sunk by the trench depth (measured OTHH 873/879: plate −5.17 vs floor −1.35; 877 outside its ring was right) — 2026-09-06b (3)
min_solid_thickness_m = 0.3        # a solid part thinner than this is a ground DECAL, never a floor witness (MIN_SOLID_PART_THICKNESS_M; 08-26 §2.1, LEMD VOR quads at −50 m)
admission_depth_m   = 2.5          # THE FLOOR GATE: a floor plate must lie this far below the LOCAL terrain to witness a pit (TRENCH_SPINE_MIN_DEPTH_M; 08-26 region recipe; 04i — a depth gate on the floor, never on the cut's outline: the region is the shell's footprint below the ground)
floor_plate_normal_y_min = 0.7     # a solid face is a FLOOR PLATE when |normal_y| reaches this (NEAR_HORIZONTAL_NORMAL_Y_MIN; 04i "a genuine solid floor")
rim_reaches_grade   = true         # THE RIM TEST (04i; v1's pit seed PIT_SEED_MAX_ABOVE_GRADE_Y_M = the ground band): a floor witness's shell TOPS OUT within contact_band_m of the local ground — a shell passing through the ground is a BUILDING standing on the pack's flat plane over real relief (LEMD cargo terminal: slab 5.8 m under the local ground, walls 15 m above it), REFUSED by resource with its height; the ring-station openness (stations farther than footprint_close_m from the members' at-grade geometry) is REPORTED per basin, never a refusal (OTHH's owner-accepted Dewatering pits read 1–2 of 46 stations open where a buried culvert leaves the shell)
# THE RIM IS THE SHELL'S GROUND-CONTACT RING (RULINGS 2026-09-06f (970)): solids
# of the SAME component standing above the contact band are cover or
# protrusions (a control tower, a vent) — never the rim — unless they cover
# basement_cover_min of the floor (rule 4).  This fraction of the component's
# solid FACE AREA (each triangle clipped at the band plane over the ground at
# the component, 3-D area) may stand above the band without refusing the pit;
# more is a shell through the ground (rule 1, through_grade).  Measured LEMD85
# (the T4S sunken structure, a 27,193 m2 floor plate 4.03 m under the ground):
# 1,004 of 29,228 m2 = 3.4 % above the band, its tower reaching +11.4 m.
rim_protrusion_max_fraction = 0.05
# THE DEPTH IS AUTHORED (RULINGS 2026-09-09ag, spec §13): a basin is a SUNKEN
# SOLID, so its floor plate stands this far under the placement's OWN render
# datum (anchor_z + agl, its rendered y = 0 plane) as well as admission_depth_m
# under the local ground.  Rule 1's local ground is the DEM at the component;
# when the pack's datum sits UNDER the terrain, at-datum geometry reads "below
# grade" without ever having been sunk.  Measured (spec §13.1): OTHH's Drainage
# (3.82), Dewatering (13.14) and tunnel objects (15.0, their datum itself 3-8 m
# under the ground) and LEMD's genuine Ground-FSX-LEMD37 basin (7.05) all clear
# it; LEMD's 33 terminal-slab basins author 0.22-1.67 m, four of them a "floor"
# ABOVE their own datum (plate_y +4.34 .. +9.27), while reading 3.6-16.1 m under
# the local ground because Aerosoft authored the pack as ONE FLAT PLANE over
# 32 m of relief.  An ABSOLUTE cap on the datum's drop under the ground was
# REFUTED here (measured, 2026-09-09ag): at 1.0 m it refused OTHH's 8 tunnels,
# whose datum stands 3-8 m under the ground and whose floors are authored 15 m
# down.  The value is admission_depth_m's: the same floor gate, against the
# object's own datum instead of the terrain.
authored_depth_min_m = 2.5
contact_band_m      = 1.0          # the ground-contact band half width: geometry above +this over the region is COVER (GROUND_CONTACT_BAND_HALF_WIDTH_M; founding spec §2.1); ALSO the seat's FACILITY depth (RULINGS 2026-09-05p): a member whose feet stand deeper than this below the built mesh never founds its anchor family and keeps its authored y (emit/rebake._facility; OTHH unit:21's sunken TerminalRoads/Parking lifted the 399-member terminal +1.888 m)
footprint_close_m   = 2.0          # the below-grade union is morphologically closed at this (AT_GRADE_FOOTPRINT_CLOSE_M; 08-26)
min_area_m2         = 1000.0       # DIAGNOSTIC ONLY (04i): v1's facility floor (TRENCH_SPINE_MIN_FOOTPRINT_AREA_M2; 08-26 recipe step 5); a basin under it is admitted and NOTED — it refused OTHH's six Drainage bowls (closed regions 54–544 m² under the 2.5 m clip), which the owner ruled a defect
rim_sample_step_m   = 10.0         # R_est = the MEDIAN DEM sampled this far apart along the region ring (rim-flush spec §2.1 item 2; _BASIN_RIM_SAMPLE_STEP_M)
basement_cover_min  = 0.9          # THE BASEMENT TEST (RULINGS 2026-09-06c (1)): a region whose floor lies under the SAME object's above-grade solids for at least this fraction of its area is a BASEMENT (the pad governs, no pit); anything less covered is a PIT — covered or open — cut to its floor plate, the cover being the object (cuts_pads).  Measured LEMD building16 on 1.0.288: the 04i erosion test ("wholly covered to within a footprint_close_m / 2 sliver") fired at 38 % / 37 % own cover on two 2 m² regions (basins 26/27) because a sliver-wide remainder erodes to nothing; the fraction never does.
max_covered_fraction = 0.5         # DIAGNOSTIC ONLY (04i): cover above the contact band by the pack's own geometry is REPORTED per basin against this, never a refusal — a covered region is a COVERED PIT (the cover is the object; the terrain still needs the cutout under it) unless it is a BASEMENT (floor wholly under the same object's above-grade solid: the building's pad governs, no pit).  v1's founding constant 0.02 (BOWL_MAX_ABOVE_GRADE_AREA_FRACTION) was never exercised; M4b stated 0.5 for ratification; 04i made the question moot.
floor_disagreement_m = 2.0         # basin_floor_declaration: |solid_minimum_y + body_depth| beyond this is a floor its own geometry does not evidence (BASIN_FLOOR_DISAGREEMENT_M; 08-26 §2.2)
rim                 = "ground"     # the at-grade rim (inside the outer perimeter by cutout.rim_inset_fraction x the shell thickness, 09-08a): the ground's value where its edge is shared with governed ground (rim LEVEL with the apron, 2026-08-28c item 3), the DEM where bare (09-03b)
shell_reaches_grade = true         # a solid part witnesses a pit only if its rendered TOP reaches within contact_band_m of the ground over it (v1 pit seed: PIT_SEED_MAX_ABOVE_GRADE_Y_M = the ground-contact band); geometry wholly under the terrain is buried, never a pit (LEMD: v1-baked grass clumps 20–44 m under grade)
cuts_pads           = true         # inside a below-grade region the trench is SENIOR to every pad/building authority (08-26; building_pad.in_basin_sits_at_floor)
cuts_runway_family  = false        # a region reaching the runway family is refused, never cut (08-25 tunnel analogue)
# THE FLOOR SITS UNDER THE OBJECT'S FLOOR (owner RULINGS 2026-09-11t, spec
# design-surface-spec.md §24 (2)).  The object PROVIDES a floor plate; the
# terrain floor is what stands under it, and where the two are the same
# elevation the terrain is what the sim shows ("the object also provides a
# floor ... that should be visible instead of seeing the terrain at the bottom
# of the basin").  The trench floor therefore stands this far UNDER the plate:
# the floor row is rim - (body_depth + floor_clearance_m), and the plate seat
# reads its ground as the trench floor PLUS this, so the plate does not chase
# the floor down.  Measured at LEMD's T4S pit on 1.0.315: floor_z 588.952 ==
# solid_min_z 588.952, a clearance of exactly 0.000 m.
floor_clearance_m   = 0.5

[retaining_wall]
allowed_outside_carves = false     # walls only at tunnel/bridge carves; everything else feathers (08-07 :887-917)
in_runway_strip = false            # no wall inside the runway strip keep-out (08-21d :1672)

[rebake]
# OBJECT RE-SEAT (RULINGS 2026-09-04i 04f-1; THE CONTACT-CLUSTER LAW 2026-09-06g):
# every build restores the pack's objects to their authored state before
# READING and re-bakes them against the terrain the patch produced, after the
# mesh.  The unit is v1's WELDED CONTACT CLUSTER, as v2 code (v2 never imports
# v1): pools by placed-footprint overlap, structures = connected ε-contact
# solids, clusters cut where two adjacent GROUND parts' seat targets (mesh
# under the part − base_y) disagree, seated on the MEDIAN ground under the
# cluster's ground parts, the delta written PER VERTEX through v1's writer
# (object_rebake.apply: the OBJ8 vertex y tokens, never the DSF, the authored
# file kept as <name>.anchor_bak).  Anchor spelling is only the subtrahend.
restore_before_read = true         # the loader reads <obj>.anchor_bak where one exists — the AUTHORED geometry, never a previous bake (04f-1; m4b-report §9 Q1)
ground_datum        = "cluster"    # a ground object seats by its contact clusters (06g; v1 object_clusters.form_clusters + object_anchor._seat_clusters)
deck_datum          = "deck_top"   # a hard-deck object seats its deck TOP on the solved surface at the deck (bridge.deck_datum; R12: the y=0 datum was the defect)
# THE PARTITION (v1 object_anchor.discover_object_pools / partition_structures, obj8_partition.contact_graph)
pool_overlap_m      = 0.25         # placements whose placed solid footprints overlap within this pool (transitively) — a pool bounds the contact search (DSF_OBJECT_CONTACT_EPSILON_M: v1 pools by the same ε)
contact_epsilon_m   = 0.25         # two welded parts within this of each other (3-D, surface to surface) are ONE structure (DSF_OBJECT_CONTACT_EPSILON_M)
contact_weld_m      = 0.001        # two parts sharing a vertex POSITION to this are welded (v1 weld_parts / obj8_reader.VERTEX_WELD_DECIMALS = 3: the millimetre) — pass 1 of the contact graph, before any triangle test
contact_narrow_budget = 400000     # point × triangle operations per part pair after which the pair cannot be proved apart and KEEPS its contact (obj8_partition.NARROW_PHASE_POINT_TRIANGLE_BUDGET; I-20 merge on doubt)
contact_batch_rows  = 50000        # point × triangle rows stacked per numpy call in the narrow phase (a performance knob: memory ≈ rows × 200 B; smaller batches union contacts sooner, so more pairs skip as already joined)
elevated_base_m     = 0.5          # a part whose lowest authored y is above this is ELEVATED: it never votes on the cut and inherits the cluster it contacts most (DSF_OBJECT_ELEVATED_BASE_M; v1 I-8)
foot_samples_max    = 4            # RULINGS 2026-09-09s (2): a ground part's SEAT TARGET is the median over its own FEET of (mesh z at the foot - the foot's authored y); the feet are its lowest solid vertices within basin.contact_band_m of the component's own minimum, at most this many, spread by farthest-point over the plan (the plan carries them: 1 = the pre-09s single centroid sample)
# THE CUT AND THE SEAT (per-cluster seating spec §3.2 / §4)
cluster_seat_tolerance_m = 0.5     # a ground-to-ground contact edge whose two ends' seat targets differ by more than this is CUT; the connected components of what remains are the clusters (DSF_OBJECT_CLUSTER_SEAT_TOLERANCE_M)
body_feet_span_m    = 100.0        # RULINGS 2026-09-10i (2): a BODY (one touching set of parts) wider than this must carry at least one MEASURED foot per that span; short of it the seat SAMPLES the design surface under every ground-contact part's footprint centroid and those samples join the median (LEMD k1: 4,202 parts over 982 m decided by ONE foot at -6.507 against neighbours +2.8).  0 = the pre-10i reading (whatever feet the body happens to have)
plate_gap_max_m     = 4.0          # RULINGS 2026-09-10u (2): a free component (a roof / floor PLANE) with no carrier within the identity spacing joins the wall whose PLAN FOOTPRINT it overlaps and whose TOP lies within this of its own bottom - a roof over a wall top with an eave or parapet gap - instead of falling straight to the nearest carrier in 3-D (LEMD: 332 plate-above-wall pairs authored 0.5-4 m clear of their wall).  Beyond it, nearest as before (reported).  0 = the pre-10u pure-nearest fallback
abutment_deck_share_min = 0.5       # owner RULINGS 2026-09-11a (spec §17.5): a body / chain is an ELEVATED DECK - the only thing that may become the JUNIOR of a CROSS-PLACEMENT group - when its parts belonging to elevated-deck resources (airport/deck_signature.elevated_deck: a plate on PIERS) hold at least this share of its plan area.  A share, not "every member", because contact welds a kerb or a parking slab of another resource onto a deck body (LEMD's viaduct carries parts of LEMD02/LEMD20/PKT4); a BUILDING body has no deck part in it at all.  1.0 = every member must be a deck; 0 = the ungated round-1 rule (buildings group with buildings, refuted: LEMD feet over 3 m 14 -> 23)
abutment_extent_min_m = 1.0        # owner RULINGS 2026-09-10ay (spec §17): the minimum plan EXTENT along which two parts of ONE ANCHOR PLANE (one plan unit: every placement of it carries the same anchor_z + agl, so their authored relation is exact) must MEET to ABUT - plan boxes within emit.identity.min_distinct_spacing_m on BOTH axes, meeting over at least this on one of them (a corner graze is not an abutment), authored z intervals within plate_gap_max_m, and NO epsilon-contact edge.  An abutment binds no body; it GROUPS the two bodies, which then take the SENIOR body's delta (largest plan footprint, then the most measured feet).  LEMD T4: the departures viaduct (Terminal4_green-STRT4, deck top +11.85) runs 2.24 m under the terminal kerb (Terminal4-LEMD01, bottom +14.09) it was authored to meet, with no contact edge at all - it was seated on its own piers and rose 6.77 m over the building; the strict plan-OVERLAP reading left its outer 4 bodies (end-to-end deck slabs, overlap 0) 0.60-0.83 m behind.  0 = the pre-10ay reading (no grouping)
line_object_ratio   = 20.0         # RULINGS 2026-09-10bb (spec §16): a component is LINE-SHAPED when its plan-box DIAGONAL over its plan-area width (plan-projected triangle area / diagonal) exceeds this and its height is under line_object_max_h; a RESOURCE every genuine component of which is line-shaped, and which carries no structure seat, is a LINE OBJECT - a fence, a kerb, a jet-blast line, a light string.  It forms NO rigid body with what it touches, founds NO foot, and DRAPES (the segment seat below).  Measured at LEMD: the box-SIDES reading is refuted (Munoza-LEMDzaun is the whole perimeter in one component, box 4,463 x 2,583 m, ratio 1.7; the diagonal reading gives 3.4e6).  0 = the pre-10bb reading (no line class)
line_object_max_h   = 6.0          # ...and low.  10bb proposed 3.0; REFUTED at LEMD - its fences stand 3.07-5.90 m (OldTerminal_FSX-ZAUN 5.90).  What keeps building walls out of the class is the whole-FILE test, not this number: per COMPONENT at 6 m, 4,207 of 9,423 LEMD ground parts classify (the T4 terminals' own walls among them); per FILE, 54 of 300 resources
line_object_stations_max = 64      # ...and the cap on a line object's drape STATIONS: its feet are widened at plan time to ceil(length / body_feet_span_m) spread by the same farthest-point walk, each station reads the design surface under itself, and every vertex takes the delta of the station nearest it in plan (LEMD's 5,157 m perimeter fence: 52 stations)
min_delta_m         = 1.0          # a cluster whose largest per-resource correction is under this stays at its authored y and the terrain adapts (DSF_OBJECT_BAKE_MIN_DELTA_M, reseat-threshold spec §2.1)
cluster_span_pad_m  = 3.0          # a cluster whose ground relief across its ground parts exceeds this is BAKED AND PADDED: seated at its median, flagged for pads (DSF_OBJECT_BAKE_MAX_GROUND_SPAN_M; spec §4.3)
cluster_residual_pad_m = 0.75      # a ground part the rigid seat leaves further than this off the mesh raises a PAD REQUEST for its connected group (DSF_OBJECT_FOOT_PAD_RESIDUAL_M; spec §5.3)
nobake_pad_floor_m  = 0.15         # ...and the materiality floor of the requests a cluster that STAYS (below the threshold) raises against its authored base (DSF_OBJECT_NOBAKE_PAD_FLOOR_M)
pad_max_relief_m    = 3.0          # a request asking the terrain for more than this is recorded flagged over the cap, never promised (DSF_OBJECT_PAD_MAX_RELIEF_M)
a3_guard_max_diameter_m = 100.0    # a cluster no wider than this is refused when its single offset would WORSEN the mean ground-part residual (v1 amendment A3, bounded by A19: object_anchor.A3_GUARD_MAXIMUM_DIAMETER_METRES)
a3_tolerance_m      = 0.000001     # ...by more than this (object_anchor.RESIDUAL_COMPARISON_TOLERANCE_METRES)
agreement_window_m  = 0.25         # a STRUCTURE seat (deck members of one family; a plate resource at several anchors) takes the agreeing coalition within this window (R12 amendment 3/4, _MEMBER_DELTA_AGREEMENT_WINDOW_M); tie or no ≥2 coalition → refused with a finding
water_founds_seat   = false        # a ground part whose centroid stands on a WATER mesh triangle is UNMEASURED: it never votes on the cut nor founds a seat (R12: OTHH's canal at 0.00 is not a datum)
one_anchor_one_seat = false        # since 06g the anchor family is the SUBTRAHEND, not the seat's unit: members of one family seat by their own contact clusters (was: one rigid unit per anchor spelling)
deck_family_seats_rigid = true     # a deck-family member's parts IN CONTACT with the deck plate (a pier, a railing, a footing under the canal bed) seat WITH the deck; a part-less member takes the deck's delta (R12-2 completeness: v1 wrote all 12 Bridge_01 members); the deck never founds the ground parts around or under it (06g)
# THE FACILITY RULE (RULINGS 2026-09-05p, at cluster level 06g) reads [basin]
# contact_band_m: a cluster whose parts stand deeper than that band BELOW the
# built mesh AND outside its structure's agreeing coalition of cluster lifts
# is a FACILITY cluster — never seated, authored y kept (the cutout is the
# basin pass's affair); a structure sunk uniformly lifts as one (05q).
facility_requires_at_grade_coalition = true  # the coalition a facility cluster is measured against must itself stand within contact_band_m of the mesh (05q: "the family's AT-GRADE coalition"); a structure whose coalition is buried or floating beyond the band (a row on a slope) has no at-grade reference — every cluster lifts by its own ground, v1's law.  false = the strict relative reading: any cluster deeper than the band beyond its structure's coalition is a facility
plate_seat_min_delta_m = 0.05      # RULINGS 2026-09-08u (1): a STRUCTURE PLATE SEAT (a tunnel wall's crest plate, a basin's floor plate — the plate-datum units) writes any |delta| at or above this; the deep OTHH bore's +0.492 m crest sat 0.49 m under grade and the 1.0 m min_delta_m declined it, which is visible.  = the 08o seat bar; min_delta_m stays for every other unit (a deck seat, a cluster), and 08d (d) is unchanged — nothing under its OWN threshold is written
structure_seat_threshold_exempt = false  # RULINGS 2026-09-08d (d): a STRUCTURE seat (a deck top, a wall / floor plate) under min_delta_m STAYS like a cluster seat — OTHH Drainage_06 was written +0.001 m under the exemption.  true = 05n-4's reading (bakes at any |delta|; v1's bridge_abutment_seat wrote OTHH's interchange at +0.9576 under the 1.0 m threshold), withdrawn by 08d, kept as a lawful value
# THE FLAT-SITE DATUM AT THE SEAT (RULINGS 2026-09-08d, spec
# othh-seat-artefacts-spec.md): on a flat-candidate site (05k-2, a
# `substitutes` verdict) the pack's seats are authoritative — the datum Z0
# reaches the anchor and the ground the seat reads, inside the verdict's region
# (pavement ∪ boundary ⊕ margin).  The anchor's ground is what the sim's
# placement probe returns: a land sample deeper than basin.contact_band_m
# below Z0 is a CUT the mesh made (a trench / pit floor) and stays the anchor's
# ground — the plate seat's delta is the cut compensation (Dewatering_01 +13.14).
anchor_water_founds_seat = false   # an anchor whose mesh sample is WATER: false = it takes Z0 where a site datum exists and is HELD (no write) where none does (08d: OTHH's canal at 0.00 founded 45 Bridges Bus writes against a base 3.96 m under the plane); true = the water surface founds the base (1.0.293's law; v1's, which wrote Bridge_05 +1.6450 / Bridge_04 +2.5672 / Bridge_01 +4.1589)
flat_site_anchor_datum   = true    # a LAND anchor inside the datum region within basin.contact_band_m of Z0 takes Z0 as its ground (the plane's sub-band residual is the datum's); deeper = a cut, the mesh stays
flat_site_ground_datum   = true    # the datum extends under every object footprint: the pack's seat is AUTHORITATIVE for an object anchored inside the region, over its WHOLE footprint (Terminal_Parking_VCN: two parts on the canal bank beyond the region's edge wrote −1.89), and for any part standing inside it — a CLUSTER ground part reads its object's authored y = 0 plane as its ground (delta 0: never the canal bank, Terminal_Parking_VCN −1.89; never the raw inset DEM outside the patch, Emiri −1.07…−2.09; never −agl, Bridge_05 +3.50 under a literal "ground = Z0") and a deck unit keeps its authored deck (TerminalRoads −10.87); plate stations read the raw mesh (a floor or a rim by construction: the cut compensations)


[placement]
# THE PLACEMENT STAGE (owner RULINGS 2026-09-11e (1)/(2); spec
# object-placement-spec.md §9).  A split exists only where the terrain
# DIFFERS under the object: the bodies of one placement whose intended-zero
# terrain heights (the design surface at each body's anchor minus its
# y_zero) agree within split_tol_m are ONE file, anchored by the senior
# body (the one with the most ground-contact vertices).  The same number is
# the generic anchor rule's admission: a body with no ground-contact vertex
# whose design surface reads within split_tol_m of the body's own zero
# plane anchors at its LOW-SIDE foot and is reported with its residual.
# THE SEGMENT CUT (owner RULINGS 2026-09-11f (2)): a LINE OBJECT authored as
# ONE component — Aerosoft LEMD's Munoza-LEMDzaun is the whole 2 km perimeter
# fence in one — has exactly one body, so the body split cannot touch it and
# its far end floats by whatever the terrain does over the run (14.68 m, the
# airport's worst row).  Its triangles are assigned by centroid to stations
# this far apart along the line and each station becomes its own body, file
# and placement, anchored at its MID-FOOT.  It is body_feet_span_m's own span
# — 10bb's drape stations, restated for the placement stage, which is why the
# two readings of a fence agree — and the cap on the stations is
# [rebake] line_object_stations_max.  0 disarms the segment cut.
line_segment_m      = 100.0        # = [rebake] body_feet_span_m (10i (2) / 10bb): one station per 100 m of fence; LEMD's perimeter reads 52 stations under the 64 cap
# THE CANOPY-AND-BUILDING GROUP (owner RULINGS 2026-09-11i; spec §11).  A
# canopy on columns stays connected to its columns and to the building it
# abuts: the group is ONE object and the TERRAIN adapts to it (one pad over
# the union of the group's footprints, the target under each foot
# level + (y_foot - y_zero)).  A LONG connecting body - the HECA railway
# class, two far buildings joined by one span - may instead DISCONNECT so
# the buildings seat, and only when the group pad turns out INFEASIBLE.
# This is that length: a group whose plan span exceeds it is releasable, a
# shorter one is reported with its residual and never split (the owner
# rules per case).  Per airport in airports.toml where a pack needs it.
# 0 disarms the long-span exception entirely.
group_span_max_m    = 150.0        # 11i: LEMD's kerbside canopies span 30-90 m and are never releasable; HECA's railway joins two terminals hundreds of metres apart
# THE RELIEF TARGET (owner RULINGS 2026-09-11j; spec §11a (2)).  X-Plane
# drapes a whole body at ONE anchor, so a body whose feet are authored at
# different y cannot stand on a flat pad: the terrain under every foot must
# be level + (y_foot - y_zero).  LEMD38's canopy modules are nine column
# feet authored 2.63 m apart, 28-114 m across, and 1,158 of LEMD's 9,546
# bodies carry over 3 m of authored relief - that residual is this law's,
# not the grouping's.  This is how far a pad vertex may stand from a foot
# and still take its target; beyond it the pad keeps its level.  0 disarms
# the relief target and restores the pre-11j flat pad.
relief_radius_m     = 12.0         # a column bay: LEMD38's feet stand 9-14 m apart, so every pad vertex between two columns reads one of them
split_tol_m         = 0.3          # round 1 measured LEMD 302 placements -> 13,924 cut files and OTHH 954 -> 65,360: the SEAT's bodies are far finer than a PLACEMENT needs (11e).  0.3 m is the materiality the sim read is judged at; 0 would restore round 1's one-file-per-body reading
# A CARRIER IS A SOLID — THE CLASS, NOT THE FILL FRACTION (owner RULINGS
# 2026-09-12j; spec §16 (3) amended).  `carrier_fill_min` is DELETED, not
# disarmed.  What stays is the CLASS exclusion, which is the whole rule:
# a LINE SEGMENT, a grass strip and a sign never carry another body's
# zero, because a fence's axis-aligned plan box is not a thing to stand
# on (LEMD's `green-PKT4__b1`, 120 roof vertices, was carried by
# `LEMDzaun__b5` 6 m below the garage slab it belongs to — 11ai).  The
# FILL FRACTION was the wrong instrument for that rule and struck the
# right answers as well: a terminal's WALL RING is a thin loop, and the
# `LEMD54` / `LEMD59` bodies the T2 roofs rest on — which overlap every
# roof and pass §16a (2)'s own ground test — fill 0.005-0.031 of their
# boxes and were removed as carriers before the rest-on rule ranked
# anything, leaving it tops 2.5-14.6 m below the roofs.
# PLAN CONTIGUITY (owner RULINGS 2026-09-11ap; spec §16b (1)).  A split
# exists only where the terrain differs under the object — but zero
# AGREEMENT alone is not evidence that two bodies are one thing: LEMD's
# `Taxisigns-SENRG` is 80 signs over 835 x 2,319 m, and §9 wrote them
# into files by height alone, so `SENRG__b10` rode a zero set 1,590 m
# away and stood +4.58 m over the ground at the owner's gate 5 (11ap
# item 2).  Bodies join one file only when they are also CONTIGUOUS IN
# PLAN: their boxes within this of each other.  A building's parts and
# a wall's rings stand metres apart; a sign and the next sign do not.
# IT IS NEVER BELOW `line_segment_m` (Fable's §16b (1) amendment): §10
# cuts a line object into stations that far apart ON PURPOSE, and a
# shorter reach makes every station its own file by construction (at
# 30 m LEMD's line-segment files went 300 -> 1,755, the airport 1,371 ->
# 4,050).  What forbids a body chaining onto one a kilometre away is the
# TERRAIN-GROUP test beside this one — the design surface under each must
# agree as well — never the reach alone.
coarsen_reach_m     = 100.0

# §16c (6) COMPONENTS IN CONTACT BIND (owner RULINGS 2026-09-12h).  §16c
# (1) made the connected COMPONENT the atom of every group, and an
# exporter's "one solid" is often several components that TOUCH: OTHH's
# `OTHH_Fuel_02_LOD0_007` has two 0.4 mm apart, which the millimetre key
# `obj8.solid_components` welds on reads as two components — written at
# two zeros they showed a 2.70 m seam.  Components of ONE resource whose
# geometry comes within this are ONE RIGID BODY for anchoring: one zero,
# the senior component's carrier.  A CONTACT tolerance, not a reach (the
# plan's own ε-contact graph binds the rest), so it is millimetres.
# 0 disarms the distance test.
contact_eps_m       = 0.002

# §16c (7) THE RIGID REACH (owner RULINGS 2026-09-12j).  §16c (6)'s
# CONTACT tolerance is millimetres and cannot reach what an exporter
# authored as one object in separate pieces: LEMD's
# `OldTerminal_FSX-HANG3` is a hangar whose four vault arcs stand
# 1.507-1.853 m from its two spine components with ZERO ε-contacts in the
# rebake plan, and round 2 wrote them at six zeros spanning 1.37 m — a
# continuous arcing roof with steps in it, which is what the owner read.
# SOLID components of ONE resource whose geometry comes within this CHAIN
# into one rigid cluster, and the cluster is the atom of every §16c (1)
# group.  LINE classes are excluded: a fence's posts stand metres apart
# by design and chaining them would re-assemble the 2 km run §10 exists
# to cut.  0 disarms the reach and leaves §16c (6)'s contact alone.
rigid_reach_m       = 2.0
